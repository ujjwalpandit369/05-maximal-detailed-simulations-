<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Detecting Topology - Circles in the Sky</title>
    <meta name="description" content="A simulation of the 'circles-in-the-sky' method for detecting a finite, toroidal universe topology using the Cosmic Microwave Background (CMB).">
    <meta name="keywords" content="Cosmic Topology, Circles in the Sky, CMB, Cosmic Microwave Background, Finite Universe, WMAP, Planck, Physics Simulation">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #c9d1d9;
            --secondary-color: #161b22;
            --accent-color: #e3b341; /* A golden CMB color */
            --highlight-color: #58a6ff; /* A blue for circles */
            --border-color: #30363d;
            --font-family: 'Exo 2', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); line-height: 1.8; font-size: 18px; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; color: var(--accent-color); font-weight: 700; }
        h2 { font-size: 2em; color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        h3 { font-size: 1.5em; color: var(--highlight-color); margin-top: 30px; }
        .panel { background-color: var(--secondary-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: flex-start; }
        .viz-item { background-color: #000; border: 2px solid var(--accent-color); border-radius: 8px; position: relative; height: 600px; }
        .viz-item canvas { width: 100%; height: 100%; display: block; }
        .controls-column .panel { position: sticky; top: 20px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-color); }
        button {
            width: 100%; padding: 10px; background-color: var(--highlight-color); color: #0d1117;
            border: none; border-radius: 4px; font-size: 1em; cursor: pointer; margin-bottom: 10px; font-weight: bold;
        }
        .metrics-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .metric-item { background-color: #0d1117; padding: 10px; border-radius: 5px; border-left: 3px solid var(--accent-color); }
        .metric-item strong { display: block; color: var(--highlight-color); font-size: 0.9em; }
        .metric-item span { font-family: var(--font-mono); font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Simulation: Detecting Topology with Circles in the Sky</h1>
            <p>Visualizing the Observational Signature of a Finite Universe</p>
        </header>

        <div class="main-layout">
            <div class="simulation-column">
                <div class="panel">
                    <h3>CMB Sky Map (Mollweide Projection)</h3>
                    <div class="viz-item" id="cmb-container"></div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>

            <div class="controls-column">
                 <div class="panel">
                    <h3>3D View (Last Scattering Surface in Universe)</h3>
                    <div class="viz-item" id="lss-container"></div>
                </div>
                <div class="panel">
                    <h3>Universe Controls</h3>
                    <div class="control-group">
                        <label>Universe Size / Observable Radius</label>
                        <input type="range" id="size-ratio" min="0.5" max="1.5" step="0.01" value="1.2">
                        <span id="ratio-value">1.2</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // This simulation uses direct canvas drawing, no external libraries needed.
    const SimApp = {
        elements: {},
        ctx: { cmb: null, lss: null },
        state: { ratio: 1.2, cmbTexture: null },

        init() {
            this.cacheDOMElements();
            this.setupEventListeners();
            this.generateCMBTexture();
            this.injectTextContent();
            this.animate();
        },

        cacheDOMElements() {
            const cmbCanvas = document.createElement('canvas');
            this.elements.cmbContainer = document.getElementById('cmb-container');
            this.elements.cmbContainer.appendChild(cmbCanvas);
            this.ctx.cmb = cmbCanvas.getContext('2d');

            const lssCanvas = document.createElement('canvas');
            this.elements.lssContainer = document.getElementById('lss-container');
            this.elements.lssContainer.appendChild(lssCanvas);
            this.ctx.lss = lssCanvas.getContext('2d');

            this.elements.ratioSlider = document.getElementById('size-ratio');
            this.elements.ratioValue = document.getElementById('ratio-value');
        },

        generateCMBTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(size, size);
            for (let i = 0; i < imageData.data.length; i += 4) {
                const val = Math.floor(128 + (Math.random() - 0.5) * 80);
                imageData.data[i] = val + 20; // R
                imageData.data[i+1] = val;    // G
                imageData.data[i+2] = val - 20; // B
                imageData.data[i+3] = 255;    // A
            }
            ctx.putImageData(imageData, 0, 0);
            this.state.cmbTexture = canvas;
        },

        setupEventListeners() {
            this.elements.ratioSlider.addEventListener('input', e => {
                this.state.ratio = parseFloat(e.target.value);
                this.elements.ratioValue.textContent = this.state.ratio.toFixed(2);
            });
        },

        drawLSS() {
            const ctx = this.ctx.lss;
            const w = ctx.canvas.width = this.elements.lssContainer.clientWidth;
            const h = ctx.canvas.height = this.elements.lssContainer.clientHeight;
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,w,h);

            const universeSize = w * 0.8;
            const lssRadius = (universeSize / this.state.ratio) / 2;

            // Draw fundamental domain
            ctx.strokeStyle = 'var(--primary-color)';
            ctx.lineWidth = 1;
            ctx.strokeRect(w/2 - universeSize/2, h/2 - universeSize/2, universeSize, universeSize);

            // Draw ghost domains
            ctx.strokeStyle = 'rgba(201, 209, 217, 0.2)';
            ctx.strokeRect(w/2 - universeSize/2 - universeSize, h/2 - universeSize/2, universeSize, universeSize);
            ctx.strokeRect(w/2 - universeSize/2 + universeSize, h/2 - universeSize/2, universeSize, universeSize);

            // Draw LSS
            ctx.fillStyle = 'rgba(227, 179, 65, 0.3)';
            ctx.beginPath();
            ctx.arc(w/2, h/2, lssRadius, 0, 2*Math.PI);
            ctx.fill();
            ctx.strokeStyle = 'var(--accent-color)';
            ctx.stroke();

            // Draw intersection circles
            if (this.state.ratio < 1) {
                ctx.strokeStyle = 'var(--highlight-color)';
                ctx.lineWidth = 3;
                const x_intersect = universeSize / 2;
                const y_intersect_sq = lssRadius**2 - x_intersect**2;
                if(y_intersect_sq > 0) {
                    const y_intersect = Math.sqrt(y_intersect_sq);
                    ctx.beginPath();
                    ctx.moveTo(w/2 - x_intersect, h/2 - y_intersect);
                    ctx.lineTo(w/2 - x_intersect, h/2 + y_intersect);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(w/2 + x_intersect, h/2 - y_intersect);
                    ctx.lineTo(w/2 + x_intersect, h/2 + y_intersect);
                    ctx.stroke();
                }
            }
        },

        drawCMB() {
            const ctx = this.ctx.cmb;
            const w = ctx.canvas.width = this.elements.cmbContainer.clientWidth;
            const h = ctx.canvas.height = this.elements.cmbContainer.clientHeight;
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,w,h);

            // Draw CMB background (Mollweide projection)
            ctx.drawImage(this.state.cmbTexture, 0, 0, w, h);

            // Draw circles if they exist
            if (this.state.ratio < 1) {
                const angularRadius = Math.acos(this.state.ratio);
                const circleRadius = angularRadius / (Math.PI/2) * (h/2);

                ctx.strokeStyle = 'var(--highlight-color)';
                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.ellipse(w/4, h/2, circleRadius * 0.7, circleRadius, 0, 0, 2*Math.PI);
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(w*3/4, h/2, circleRadius * 0.7, circleRadius, 0, 0, 2*Math.PI);
                ctx.stroke();
            }
        },

        animate() {
            this.drawLSS();
            this.drawCMB();
            requestAnimationFrame(() => this.animate());
        },

        injectTextContent() {
            const content = `
                <h2>The Ultimate Question: What is the Shape of the Universe?</h2>
                <p>After exploring the strange possibilities allowed by mathematics—from simple wraparound tori to twisted and non-orientable spaces—we arrive at the ultimate question for a physicist: how could we ever find out? How could we test the global topology of our own universe? For a long time, this question was considered purely metaphysical. But in the 1990s, a group of cosmologists including Neil Cornish, David Spergel, Glenn Starkman, and Jean-Pierre Luminet realized that the Cosmic Microwave Background (CMB) provides a powerful observational tool to directly probe the shape of space.</p>
                <p>The method they developed, known as the <strong>"circles-in-the-sky"</strong> test, provides a clear, "smoking gun" signature for a finite, multi-connected universe. This simulation visualizes the geometry behind this ingenious idea and shows you what astronomers are looking for in their maps of the early universe.</p>

                <h2>The Last Scattering Surface</h2>
                <p>The key to the method is understanding the source of the CMB. It is not a physical "wall" at the edge of the universe. Instead, it is the light from a specific moment in time, about 380,000 years after the Big Bang, when the universe cooled enough to become transparent. The light from that moment has been traveling towards us ever since. Because light travels at a finite speed, the points from which we are receiving that light today form a giant sphere around us, known as the <strong>Surface of Last Scattering (LSS)</strong>. The 3D view in the simulation shows this sphere (in yellow) centered on you, the observer.</p>

                <h2>Intersections and Circles</h2>
                <p>Now, imagine we live in a finite 3-torus universe, represented by the central box (the "fundamental domain"). If this box is larger than the LSS, as shown when the size ratio is greater than 1, then the LSS fits entirely inside it without any issue. We would have no way of knowing the universe wraps around.</p>
                <p>But what if the universe is smaller than the LSS? You can simulate this by dragging the size ratio slider to be less than 1. In this case, the LSS is too big to fit inside the fundamental domain. It must necessarily self-intersect. As shown in the 3D view, the LSS sphere expands beyond the boundary of the box and re-enters from the other side (which is, of course, the same side). The intersection of a sphere with itself is always a circle. Because we are seeing the same region of primordial plasma from two different directions, the pattern of hot and cold spots (the CMB fluctuations) on both circles must be identical.</p>
                <p>Therefore, the definitive signature of a finite 3-torus topology is a pair of <strong>matched circles in the sky</strong> with the same radius and the same temperature pattern. The CMB sky map in the simulation shows what this would look like. When the size ratio is less than 1, a pair of matched circles appears, representing the ultimate observational test of cosmic topology.</p>

                <h2>The Search and the Null Result</h2>
                <p>Cosmologists have performed exhaustive searches for such matched circles in the data from the WMAP and Planck CMB satellites. The process is computationally immense, requiring checking all possible radii and all possible pairs of positions on the sky. To date, no statistically significant pairs of matched circles have been found.</p>
                <p>This "null result" does not mean the universe is infinite. It simply sets a limit on the size of the topology. If the universe has a toroidal shape, the fundamental domain must be larger than the diameter of the last scattering surface. We live in a cosmic "box" that is too big for us to see the other side. While this is a disappointing result for now, it is a triumph of modern cosmology that we can even ask—and observationally constrain—a question as profound as "What is the shape of the universe?".</p>

                <h2>Q&A: Reading the Cosmic Tea Leaves</h2>
                <div class="qa-item">
                    <strong>1. Why must the intersection of two spheres be a circle?</strong>
                    <p>This is a fundamental theorem of Euclidean geometry. Imagine two bubbles intersecting; their intersection forms a perfect circle. The same principle applies here. Our LSS is a 2-sphere in 3D space, and its "ghost" copy from the other side of the universe is also a 2-sphere. Their intersection is a 1-dimensional circle.</p>
                </div>
                <div class="qa-item">
                    <strong>2. How would this test work for other topologies, like the twisted ones?</strong>
                    <p>The principle is the same, but the signature changes. For the twisted torus, you would still find matched circles, but the temperature pattern on one circle would be rotated relative to the other. For a non-orientable topology like a Klein bottle, the pattern on one circle would be a mirror-image of the pattern on the other. Searches for these signatures have also been performed, with no positive results.</p>
                </div>
                <!-- ... 18+ more Q&A items ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
