<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: LQC Bounce vs. Standard Inflation</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --accent-color: #00ffaa; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        h1 { font-size: 2.5em; margin: 0; }
        .comparison-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; text-align: center; }
        canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 4px; }
        .controls-panel { text-align: center; background: var(--panel-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .metrics-panel { font-family: 'Courier New', monospace; font-size: 0.9em; }
        .exposition, .qa-section { background: var(--panel-bg); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>LQC Big Bounce vs. Standard Inflation</h1></header>
        <div class="controls-panel">
            <button id="start-sim">Start / Pause</button>
            <button id="reset-sim">Reset</button>
        </div>
        <div class="comparison-layout">
            <div class="simulation-panel">
                <h2>Standard Inflation</h2>
                <canvas id="inflation-canvas" width="600" height="400"></canvas>
                <div class="metrics-panel" id="inflation-metrics"></div>
            </div>
            <div class="simulation-panel">
                <h2>LQC Big Bounce</h2>
                <canvas id="lqc-canvas" width="600" height="400"></canvas>
                <div class="metrics-panel" id="lqc-metrics"></div>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full comparative simulation script.
    // The final version will contain two synchronized simulations, each with its
    // own physics model, and dynamic charts showing comparative metrics.

    const DOM = {
        inflationCanvas: document.getElementById('inflation-canvas'),
        inflationCtx: document.getElementById('inflation-canvas').getContext('2d'),
        lqcCanvas: document.getElementById('lqc-canvas'),
        lqcCtx: document.getElementById('lqc-canvas').getContext('2d'),
        inflationMetrics: document.getElementById('inflation-metrics'),
        lqcMetrics: document.getElementById('lqc-metrics'),
        startBtn: document.getElementById('start-sim'),
        resetBtn: document.getElementById('reset-sim'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = {
        isRunning: false,
        time: 0,
        inflation: { a: 1e-30 },
        lqc: { a: 10 }
    };

    function draw(canvas, ctx, modelState) {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const gridSize = 50 * modelState.a;
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        // ... drawing logic for grid and particles ...
    }

    function update() {
        if (!state.isRunning) return;
        state.time += 1;

        // Simplified update logic
        // Inflation: exponential growth
        state.inflation.a *= 1.1;
        // LQC: bounce logic
        if (state.time < 50) state.lqc.a -= 0.2;
        else if (state.lqc.a < 10) state.lqc.a += 0.2;

        DOM.inflationMetrics.textContent = `Time: ${state.time}, Scale Factor a(t) = ${state.inflation.a.toExponential(1)}`;
        DOM.lqcMetrics.textContent = `Time: ${state.time}, Scale Factor a(t) = ${state.lqc.a.toFixed(1)}`;

        requestAnimationFrame(update);
    }

    function render() {
        draw(DOM.inflationCanvas, DOM.inflationCtx, state.inflation);
        draw(DOM.lqcCanvas, DOM.lqcCtx, state.lqc);
        requestAnimationFrame(render);
    }

    function setup() {
        DOM.startBtn.addEventListener('click', () => { state.isRunning = !state.isRunning; if(state.isRunning) update(); });
        DOM.expositionContent.innerHTML = `<h1>Clash of Theories</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;
        render();
    }

    setup();
});
</script>
</body>
</html>
