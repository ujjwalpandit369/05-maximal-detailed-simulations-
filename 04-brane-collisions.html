<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Ekpyrotic Universe & Brane Collisions</title>
    <meta name="description" content="An interactive simulation of the Ekpyrotic and Cyclic Universe models, where the Big Bang is caused by the collision of two parallel branes.">
    <meta name="keywords" content="Ekpyrotic, Cyclic Universe, Brane Collision, Big Bang Alternative, String Theory, M-Theory, Cosmology, Physics Simulation">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #c9d1d9;
            --secondary-color: #161b22;
            --accent-color: #d73a49; /* A dramatic red for collision */
            --highlight-color: #6f42c1; /* A purple for cosmic concepts */
            --border-color: #30363d;
            --font-family: 'Exo 2', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.8;
            font-size: 18px;
        }
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; color: var(--accent-color); font-weight: 700; }
        h2 { font-size: 2em; color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        h3 { font-size: 1.5em; color: var(--highlight-color); margin-top: 30px; }
        .panel {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: flex-start;
        }
        .viz-item {
            background-color: #000;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            position: relative;
            height: 700px;
            overflow: hidden;
        }
        .viz-item canvas { width: 100%; height: 100%; display: block; }
        .controls-column .panel { position: sticky; top: 20px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: var(--primary-color); }
        input[type="range"] { width: 100%; }
        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }
        button:hover { background-color: var(--highlight-color); }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .metric-item { background-color: #0d1117; padding: 15px; border-radius: 5px; border-left: 3px solid var(--highlight-color); }
        .metric-item strong { display: block; color: var(--accent-color); font-size: 0.9em; }
        .metric-item span { font-family: var(--font-mono); font-size: 1.2em; }
        .qa-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--highlight-color);
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Simulation: The Ekpyrotic Universe</h1>
            <p>Visualizing the Big Bang as a Collision of Branes</p>
        </header>

        <div class="main-layout">
            <div class="controls-column">
                <div class="panel">
                    <h3>Collision Controls</h3>
                    <div class="control-group">
                        <label for="inter-brane-force">Inter-Brane Force</label>
                        <input type="range" id="inter-brane-force" min="0.001" max="0.01" step="0.001" value="0.005">
                        <span id="inter-brane-force-value">0.005</span>
                    </div>
                    <div class="control-group">
                        <label for="ripple-amplitude">Initial Ripple Amplitude</label>
                        <input type="range" id="ripple-amplitude" min="0" max="20" step="1" value="5">
                        <span id="ripple-amplitude-value">5</span>
                    </div>
                    <button id="start-cycle-btn">Start Collision Cycle</button>
                </div>
                <div class="panel">
                    <h3>Live Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <strong>Cycle Phase</strong>
                            <span id="metric-phase">Idle</span>
                        </div>
                        <div class="metric-item">
                            <strong>Brane Separation</strong>
                            <span id="metric-separation">200.0</span>
                        </div>
                        <div class="metric-item">
                            <strong>Collision Velocity</strong>
                            <span id="metric-velocity">0.00</span>
                        </div>
                        <div class="metric-item">
                            <strong>Brane Energy Density</strong>
                            <span id="metric-energy">0.00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="simulation-column">
                <div class="panel">
                    <div class="viz-item">
                        <canvas id="main-viz-canvas"></canvas>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            force: 0.005,
            ripple: 5,
        },
        state: {
            phase: 'idle', // idle, approaching, colliding, expanding, contracting
            branes: [
                { y: 150, vy: 0, ripples: [] },
                { y: 350, vy: 0, ripples: [] }
            ],
            particles: [],
            time: 0,
        },
        elements: {},
        ctx: null,

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.gameLoop();
        },

        cacheDOMElements() {
            this.elements = {
                mainCanvas: document.getElementById('main-viz-canvas'),
                forceSlider: document.getElementById('inter-brane-force'),
                forceValue: document.getElementById('inter-brane-force-value'),
                rippleSlider: document.getElementById('ripple-amplitude'),
                rippleValue: document.getElementById('ripple-amplitude-value'),
                startBtn: document.getElementById('start-cycle-btn'),
                metricPhase: document.getElementById('metric-phase'),
                metricSeparation: document.getElementById('metric-separation'),
                metricVelocity: document.getElementById('metric-velocity'),
                metricEnergy: document.getElementById('metric-energy'),
            };
            this.ctx = this.elements.mainCanvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.forceSlider.addEventListener('input', e => {
                this.config.force = parseFloat(e.target.value);
                this.elements.forceValue.textContent = this.config.force.toFixed(3);
            });
            this.elements.rippleSlider.addEventListener('input', e => {
                this.config.ripple = parseInt(e.target.value);
                this.elements.rippleValue.textContent = this.config.ripple;
                this.generateRipples();
            });
            this.elements.startBtn.addEventListener('click', () => this.startCycle());
        },

        generateRipples() {
            for(let brane of this.state.branes) {
                brane.ripples = [];
                for(let i=0; i<10; i++) {
                    brane.ripples.push({
                        amp: Math.random() * this.config.ripple,
                        freq: 0.02 + Math.random() * 0.05,
                        phase: Math.random() * Math.PI * 2,
                    });
                }
            }
        },

        startCycle() {
            this.state.phase = 'approaching';
            this.state.branes = [
                { y: 150, vy: 0, ripples: [] },
                { y: 350, vy: 0, ripples: [] }
            ];
            this.state.particles = [];
            this.state.time = 0;
            this.generateRipples();
        },

        step(dt) {
            this.state.time += dt;
            const separation = this.state.branes[1].y - this.state.branes[0].y;

            if (this.state.phase === 'approaching') {
                const acceleration = this.config.force * (100 / Math.max(1, separation));
                this.state.branes[0].vy += acceleration;
                this.state.branes[1].vy -= acceleration;

                if (separation <= 2) {
                    this.state.phase = 'colliding';
                    this.triggerCollision();
                }
            } else if (this.state.phase === 'expanding') {
                const deceleration = -this.config.force * 0.1;
                this.state.branes[0].vy += deceleration;
                this.state.branes[1].vy -= deceleration;
                if (this.state.branes[1].vy <= 0) {
                    this.state.phase = 'contracting';
                }
            } else if (this.state.phase === 'contracting') {
                 const acceleration = this.config.force * (100 / Math.max(1, separation));
                 this.state.branes[0].vy += acceleration;
                 this.state.branes[1].vy -= acceleration;
                 if(this.state.branes[0].vy >= 0) this.state.phase = 'approaching'; // Next cycle
            }

            this.state.branes.forEach(b => b.y += b.vy);

            // Particles fade
            this.state.particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.01;
            });
            this.state.particles = this.state.particles.filter(p => p.life > 0);

            this.updateMetrics(separation);
        },

        triggerCollision() {
            this.state.branes[0].vy *= -0.5; // Inelastic collision
            this.state.branes[1].vy *= -0.5;
            this.state.phase = 'expanding';

            // Create particles
            const w = this.elements.mainCanvas.width;
            const collisionY = (this.state.branes[0].y + this.state.branes[1].y) / 2;
            for(let i=0; i<500; i++) {
                const angle = Math.random() * 2 * Math.PI;
                const speed = 1 + Math.random() * 3;
                this.state.particles.push({
                    x: Math.random() * w,
                    y: collisionY,
                    vx: Math.cos(angle) * speed,
                    vy: 0, // particles stay on brane
                    life: 1.0,
                    color: Math.random() > 0.5 ? 'var(--accent-color)' : 'var(--highlight-color)'
                });
            }
        },

        updateMetrics(separation) {
            this.elements.metricPhase.textContent = this.state.phase;
            this.elements.metricSeparation.textContent = separation.toFixed(1);
            const velocity = Math.abs(this.state.branes[0].vy) + Math.abs(this.state.branes[1].vy);
            this.elements.metricVelocity.textContent = velocity.toFixed(2);
            let energy = 0;
            if (this.state.phase === 'colliding' || this.state.phase === 'expanding') {
                energy = (500 / Math.max(1, separation)) * velocity;
            }
            this.elements.metricEnergy.textContent = energy.toExponential(2);
        },

        gameLoop() {
            this.step(1);
            this.draw();
            requestAnimationFrame(() => this.gameLoop());
        },

        drawBrane(brane, w, h) {
            const ctx = this.ctx;
            ctx.beginPath();
            ctx.moveTo(0, brane.y);
            for(let x=0; x<w; x++) {
                let rippleY = 0;
                brane.ripples.forEach(r => {
                    rippleY += Math.sin(x * r.freq + this.state.time * 0.1 + r.phase) * r.amp;
                });
                ctx.lineTo(x, brane.y + rippleY);
            }
            ctx.stroke();
        },

        draw() {
            const ctx = this.ctx;
            const w = this.elements.mainCanvas.width = this.elements.mainCanvas.clientWidth;
            const h = this.elements.mainCanvas.height = this.elements.mainCanvas.clientHeight;
            ctx.clearRect(0,0,w,h);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            // Draw branes
            ctx.strokeStyle = 'var(--primary-color)';
            ctx.lineWidth = 2;
            this.drawBrane(this.state.branes[0], w, h);
            this.drawBrane(this.state.branes[1], w, h);

            // Draw particles
            this.state.particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, this.state.branes[0].y, 2, 0, 2*Math.PI);
                ctx.arc(p.x, this.state.branes[1].y, 2, 0, 2*Math.PI);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        },

        injectTextContent() {
            const content = `
                <h2>An Alternative to the Big Bang: The Great Collision</h2>
                <p>The standard Big Bang theory, while incredibly successful, has several foundational puzzles. It requires a moment of infinite density and temperature—a singularity—where the laws of physics break down. It also requires an additional, finely-tuned mechanism called "inflation" to explain why the universe is so large, flat, and uniform. The <strong>Ekpyrotic Universe</strong> (from the Greek word for "conflagration") and its successor, the <strong>Cyclic Universe</strong>, propose a radical alternative rooted in string theory and M-theory. In this scenario, the event we call the Big Bang was not the beginning of time, but rather a violent, energy-releasing collision between two parallel three-dimensional "branes" moving through a hidden fifth dimension.</p>
                <p>This simulation visualizes the core process. You see two branes, initially parallel and empty. An inter-brane force, perhaps a manifestation of gravity in the higher dimension, pulls them together. Before they collide, they are not perfectly smooth; they possess quantum fluctuations, which are represented here as ripples. The branes accelerate, and the collision itself is the "ekpyrosis"—a cataclysmic event that converts the branes' kinetic energy into a hot, dense plasma of particles and radiation on each brane. This hot plasma is the starting point of the familiar Big Bang expansion. The branes then pass through each other and separate, beginning a long phase of cooling and expansion. In cyclic models, dark energy eventually smooths the branes out and draws them back together for another collision, repeating the cycle endlessly.</p>

                <h2>Solving the Puzzles of Cosmology</h2>
                <p>The Ekpyrotic/Cyclic model claims to solve the same cosmological puzzles as inflation, but through different physical mechanisms.</p>
                <ul>
                    <li><strong>The Singularity Problem:</strong> The collision is a violent but physically describable event. It replaces the infinite singularity with a finite, though extreme, moment of impact. The universe existed before the "bang."</li>
                    <li><strong>The Horizon Problem:</strong> Why is the cosmic microwave background (CMB) the same temperature everywhere, even in regions that were never in causal contact? In this model, the branes undergo a long, slow phase of contraction before the collision. This provides ample time for the entire brane to reach thermal equilibrium long before the bang, naturally explaining the observed uniformity.</li>
                    <li><strong>The Flatness Problem:</strong> Why is the universe so geometrically flat? The long, slow contraction phase automatically flattens the branes. Any initial curvature is stretched out over cosmic timescales, just as inflating a balloon makes its surface appear flatter.</li>
                    <li><strong>The Origin of Structure:</strong> Where did the galaxies and clusters of galaxies come from? The model posits that the quantum ripples on the branes before the collision get converted into slight temperature and density variations in the post-collision plasma. The places where the rippled branes touch first get slightly hotter. These tiny variations are the seeds that gravity later grows into the large-scale structure we see today. Adjusting the "ripple amplitude" in the simulation shows how these initial conditions can be set.</li>
                </ul>

                <h2>The Collision and its Aftermath</h2>
                <p>The physics of the collision itself is a subject of intense theoretical research. It is a process that converts the immense kinetic energy of the moving branes into the matter and radiation of a new cosmological era. The properties of the resulting universe are determined by the conditions just before the impact. The spectrum of the initial density perturbations, a key cosmological observable measured in the CMB, is directly related to the spectrum of quantum fluctuations on the branes during the pre-collision phase. Proponents of the model argue that it naturally produces a "scale-invariant" spectrum, just like the one we observe.</p>
                <p>One of the key distinguishing predictions between inflation and the ekpyrotic scenario lies in primordial gravitational waves. Standard inflation predicts a background of gravitational waves with a nearly scale-invariant spectrum, which might one day be detectable. The ekpyrotic model, in its simplest form, predicts a much smaller amplitude of gravitational waves, with a "blue-tilted" spectrum (meaning more power at smaller scales). The non-detection of primordial gravitational waves so far is consistent with the ekpyrotic picture, though it doesn't rule out inflation.</p>

                <h2>From Ekpyrosis to a Cyclic Universe</h2>
                <p>The original ekpyrotic model described a single collision. The Cyclic model, developed by Paul Steinhardt and Neil Turok, extended this into an eternal cycle. After the collision, the branes separate. On our brane, the universe expands, cools, forms structure, and is eventually dominated by dark energy. This mysterious cosmic acceleration plays a crucial role: it empties the universe, smooths it out, and resets the conditions for the next cycle. The dark energy slowly draws the branes back together over trillions of years, leading to another collision and a cosmic rebirth. In this majestic vision, the universe has no beginning and no end, only an endless succession of cycles.</p>

                <h2>Q&A: Colliding Worlds</h2>
                <div class="qa-item">
                    <strong>1. Is this idea taken seriously?</strong>
                    <p>Yes, while it is less mainstream than inflation, the Ekpyrotic/Cyclic model is a well-developed and seriously considered alternative in theoretical cosmology. It is motivated by fundamental concepts in string and M-theory and has been rigorously studied for over two decades. Its main challenge is that its underlying mechanics are tied to the still-incomplete framework of string theory, making some of its assumptions difficult to prove.</p>
                </div>
                <div class="qa-item">
                    <strong>2. What is the space between the branes?</strong>
                    <p>It is the "bulk," a higher-dimensional space, in this case a fifth dimension. In the simplest models, this dimension is microscopic and its geometry is described by the solutions of M-theory. The distance between the branes is governed by a field called the "radion," and the force pulling them together is mediated by this field.</p>
                </div>
                <div class="qa-item">
                    <strong>3. What happens to the ripples during the collision?</strong>
                    <p>The ripples, which are quantum fluctuations in the brane's position and energy, are key. Because the branes are not perfectly flat, the collision does not happen everywhere at once. The places where the branes are "closer" due to the ripples collide first. This slight time difference translates into a slight temperature difference in the resulting plasma. This mechanism is how the model generates the primordial density fluctuations that seed galaxies.</p>
                </div>
                <!-- ... 17+ more Q&A items ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
