<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: DGP Modified Gravity</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .chart-container { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>DGP Gravity: Leaking into Extra Dimensions</h1></header>
        <div class="main-layout">
            <div class="chart-container">
                <h2>Force vs. Distance (Log-Log Plot)</h2>
                <div id="main-chart"></div>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <label>Crossover Scale (r<sub>c</sub>): <span id="rc-value">1</span> Gpc</label>
                <input type="range" id="rc-slider" min="0.1" max="10" step="0.1" value="1">
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full DGP gravity script.
    // The final version will contain dynamic SVG charts comparing the
    // standard 1/r^2 force law with the DGP model.

    const DOM = {
        chart: document.getElementById('main-chart'),
        rcSlider: document.getElementById('rc-slider'),
        rcValue: document.getElementById('rc-value'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = { rc: 1.0 };

    function calculateForces() {
        const r_values = Array.from({length: 100}, (_, i) => Math.pow(10, -2 + i * 0.04)); // Log scale from 0.01 to 100

        const standard_force = r_values.map(r => 1 / (r*r));

        // Simplified DGP model where force transitions from 1/r^2 to 1/r^3
        const dgp_force = r_values.map(r => 1 / (r*r + r*r*r / state.rc));

        return { r_values, standard_force, dgp_force };
    }

    function drawChart() {
        const data = calculateForces();
        // Placeholder for dynamic SVG chart drawing logic
        DOM.chart.innerHTML = `<p>Chart will show standard gravity vs. DGP gravity with r<sub>c</sub>=${state.rc.toFixed(1)} Gpc.</p>`;
    }

    function setup() {
        function update() {
            state.rc = parseFloat(DOM.rcSlider.value);
            DOM.rcValue.textContent = `${state.rc.toFixed(1)} Gpc`;
            drawChart();
        }

        DOM.rcSlider.addEventListener('input', update);

        DOM.expositionContent.innerHTML = `<h1>Leaking Gravity</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        update();
    }

    setup();
});
</script>
</body>
</html>
