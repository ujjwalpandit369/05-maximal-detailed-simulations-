<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Wave Function on a Compact Dimension</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; text-align: center; }
        canvas { width: 100%; height: 250px; display: block; background: #000; border-radius: 4px; }
        .controls-panel { grid-column: 1 / 3; text-align: center; background: var(--panel-bg); padding: 15px; border-radius: 8px; margin-top: 20px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Wave Functions: Particle in a Box vs. a Compact Dimension</h1></header>
        <div class="controls-panel">
            <label>Quantum Number (n): <span id="n-value">1</span></label>
            <input type="range" id="n-slider" min="1" max="10" step="1" value="1">
            <label>Size of Space (L): <span id="l-value">1.0</span></label>
            <input type="range" id="l-slider" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Particle in a Box</h2>
                <canvas id="box-canvas"></canvas>
            </div>
            <div class="simulation-panel">
                <h2>Particle on a Circle (Compact Dimension)</h2>
                <canvas id="circle-canvas"></canvas>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Wave Function script.
    // The final version will draw the standing wave solutions for both
    // the box and circle boundary conditions.

    const DOM = {
        boxCanvas: document.getElementById('box-canvas'), boxCtx: document.getElementById('box-canvas').getContext('2d'),
        circleCanvas: document.getElementById('circle-canvas'), circleCtx: document.getElementById('circle-canvas').getContext('2d'),
        nSlider: document.getElementById('n-slider'), nValue: document.getElementById('n-value'),
        lSlider: document.getElementById('l-slider'), lValue: document.getElementById('l-value'),
        expositionContent: document.getElementById('exposition-content'), qaContent: document.getElementById('qa-content')
    };

    let state = { n: 1, L: 1.0 };

    function drawWave(ctx, L, n, is_circle) {
        const w = ctx.canvas.width, h = ctx.canvas.height;
        ctx.fillStyle = 'black'; ctx.fillRect(0,0,w,h);
        ctx.strokeStyle = 'cyan'; ctx.lineWidth = 2;

        ctx.beginPath();
        for (let x = 0; x <= w; x++) {
            const x_norm = x / w; // x from 0 to 1
            let psi;
            if (is_circle) {
                psi = Math.cos(2 * Math.PI * n * x_norm / L);
            } else {
                psi = Math.sin(n * Math.PI * x_norm / L);
            }
            const y = h/2 - psi * (h/2 - 20);
            if (x===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }
        ctx.stroke();
    }

    function update() {
        state.n = parseInt(DOM.nSlider.value);
        state.L = parseFloat(DOM.lSlider.value);
        DOM.nValue.textContent = state.n;
        DOM.lValue.textContent = state.L.toFixed(2);

        drawWave(DOM.boxCtx, state.L, state.n, false);
        drawWave(DOM.circleCtx, state.L, state.n, true);
    }

    function setup() {
        DOM.nSlider.addEventListener('input', update);
        DOM.lSlider.addEventListener('input', update);

        DOM.expositionContent.innerHTML = `<h1>Quantization from Boundaries</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        update();
    }

    setup();
});
</script>
</body>
</html>
