<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: DGP Accelerated Expansion</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; text-align: center; }
        .controls-panel { grid-column: 1 / 3; background: var(--panel-bg); padding: 15px; border-radius: 8px; text-align: center; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>DGP Accelerated Expansion vs. Standard Cosmology</h1></header>
        <div class="controls-panel">
            <label>Matter Density (Ω<sub>m</sub>): <span id="omega-m-value">0.3</span></label>
            <input type="range" id="omega-m-slider" min="0.1" max="2.0" step="0.1" value="0.3">
            <button id="run-btn">Run Simulations</button>
        </div>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Standard Universe (Matter Only)</h2>
                <div id="std-chart"></div>
            </div>
            <div class="simulation-panel">
                <h2>DGP Universe</h2>
                <div id="dgp-chart"></div>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full DGP vs Standard model script.
    // The final version will contain two synchronized numerical solvers
    // and dynamic SVG charts to compare the expansion histories.

    const DOM = {
        stdChart: document.getElementById('std-chart'),
        dgpChart: document.getElementById('dgp-chart'),
        omegaMSlider: document.getElementById('omega-m-slider'),
        omegaMValue: document.getElementById('omega-m-value'),
        runBtn: document.getElementById('run-btn'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    function solve(model, omega_m) {
        let a = 0.1, a_dot = 1, t = 0;
        const dt = 0.1;
        const history = [];
        const r_c = 1.0; // Crossover scale

        while (t < 20) {
            let H = a_dot / a;
            let a_dot_dot;

            if (model === 'std') {
                a_dot_dot = -0.5 * omega_m / (a*a);
            } else { // DGP
                // Simplified DGP equation effect
                const effective_lambda = H / r_c;
                a_dot_dot = -0.5 * omega_m / (a*a) + effective_lambda * a;
            }

            a_dot += a_dot_dot * dt;
            a += a_dot * dt;
            t += dt;
            if (history.length > 500) break;
            history.push({t, a});
        }
        return history;
    }

    function runSimulations() {
        const omega_m = parseFloat(DOM.omegaMSlider.value);
        const std_history = solve('std', omega_m);
        const dgp_history = solve('dgp', omega_m);

        // Placeholder for dynamic SVG chart drawing logic
        DOM.stdChart.innerHTML = `<p>Standard model simulation results will be plotted here.</p>`;
        DOM.dgpChart.innerHTML = `<p>DGP model simulation results will be plotted here.</p>`;
    }

    function setup() {
        DOM.runBtn.addEventListener('click', runSimulations);
        DOM.omegaMSlider.oninput = () => { DOM.omegaMValue.textContent = DOM.omegaMSlider.value; };

        DOM.expositionContent.innerHTML = `<h1>Acceleration from Modified Gravity</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        runSimulations();
    }

    setup();
});
</script>
</body>
</html>
