<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Quantum Zeno Effect in Many-Worlds</title>
    <style>
        /* Using the same abstract theme as the previous file */
        :root {
            --bg-color: #111; --primary-color: #eee; --secondary-color: #444;
            --accent-color: #8a2be2; --highlight-color: #00ddff;
            --font-family: 'Inter', 'Segoe UI', sans-serif;
            --monospace-family: 'Fira Code', 'Courier New', monospace;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; font-weight: 300; }
        .header { text-align: center; margin-bottom: 30px; }
        .subtitle { font-style: italic; color: var(--primary-color); opacity: 0.8; }
        .main-layout { display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; } }
        .panel { background-color: rgba(255,255,255,0.03); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .control-item { display: flex; flex-direction: column; }
        .control-item label { color: var(--highlight-color); margin-bottom: 8px; }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .viz-item { background-color: #000; border-radius: 8px; padding: 15px; position: relative; min-height: 400px; }
        .viz-item canvas { width: 100%; height: 100%; }
        .viz-title { text-align: center; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr; gap: 15px; text-align: center; }
        .metric-item .label { font-weight: bold; font-size: 0.9em; opacity: 0.8; }
        .metric-item .value { font-family: var(--monospace-family); font-size: 1.8em; color: var(--accent-color); }
        .text-content { padding: 20px; background-color: rgba(0,0,0,0.1); border-radius: 8px; }
        button { background-color: var(--accent-color); color: #fff; border: 1px solid var(--accent-color); padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Deep Simulation: The Quantum Zeno Effect</h1>
            <p class="subtitle">How frequent measurements "freeze" a quantum system, interpreted through the lens of Many-Worlds.</p>
        </header>

        <div class="main-layout">
            <div class="controls-metrics-column">
                <div class="panel">
                    <h3>Controls</h3>
                    <div class="controls-grid">
                         <div class="control-item">
                            <label>Evolution Speed (ω): <span id="speed-value">1.0</span></label>
                            <input type="range" id="evolution-speed" min="0.1" max="5.0" step="0.1" value="1.0">
                        </div>
                        <div class="control-item">
                            <label>Time Between Measurements (Δt): <span id="measure-time-value">0.2</span> s</label>
                            <input type="range" id="measure-time" min="0.05" max="2.0" step="0.01" value="0.2">
                        </div>
                        <div class="button-group" style="margin-top: 15px;">
                            <button id="start-stop-btn">Start</button>
                            <button id="reset-btn">Reset</button>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3>Metrics</h3>
                    <div class="metrics-grid" id="metrics-container"></div>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                    <div class="comparison-grid">
                        <div class="viz-item">
                            <div class="viz-title">Free Evolution</div>
                            <canvas id="free-canvas"></canvas>
                        </div>
                        <div class="viz-item">
                            <div class="viz-title">Zeno Effect (Frequent Measurement)</div>
                            <canvas id="zeno-canvas"></canvas>
                        </div>
                    </div>
                </div>

                <div class="text-content" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            evolutionSpeed: 1.0, // radians per second
            measureTime: 0.2,
        },
        state: {
            isRunning: false,
            time: 0,
            free_theta: 0,
            zeno_theta: 0,
            zeno_last_measure: 0,
            zeno_branches: [],
        },
        elements: {},
        ctx: {},

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.resetSimulation();
        },

        cacheDOMElements() {
            this.elements = {
                startStopBtn: document.getElementById('start-stop-btn'),
                resetBtn: document.getElementById('reset-btn'),
                evolutionSpeedSlider: document.getElementById('evolution-speed'),
                measureTimeSlider: document.getElementById('measure-time'),
                speedValue: document.getElementById('speed-value'),
                measureTimeValue: document.getElementById('measure-time-value'),
                freeCanvas: document.getElementById('free-canvas'),
                zenoCanvas: document.getElementById('zeno-canvas'),
                metricsContainer: document.getElementById('metrics-container'),
            };
            this.ctx.free = this.elements.freeCanvas.getContext('2d');
            this.ctx.zeno = this.elements.zenoCanvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.startStopBtn.addEventListener('click', () => this.togglePause());
            this.elements.resetBtn.addEventListener('click', () => this.resetSimulation());
            this.elements.evolutionSpeedSlider.addEventListener('input', e => { this.config.evolutionSpeed = parseFloat(e.target.value); this.elements.speedValue.textContent = this.config.evolutionSpeed.toFixed(1); });
            this.elements.measureTimeSlider.addEventListener('input', e => { this.config.measureTime = parseFloat(e.target.value); this.elements.measureTimeValue.textContent = `${this.config.measureTime.toFixed(2)} s`; });
        },

        resetSimulation() {
            this.state.isRunning = false;
            if (this.state.animationFrameId) cancelAnimationFrame(this.state.animationFrameId);
            this.elements.startStopBtn.textContent = 'Start';
            this.state.time = 0;
            this.state.free_theta = 0;
            this.state.zeno_theta = 0;
            this.state.zeno_last_measure = 0;
            this.state.zeno_branches = [];
            this.draw();
        },

        step(dt) {
            this.state.time += dt;

            // Free evolution
            this.state.free_theta += this.config.evolutionSpeed * dt;

            // Zeno evolution
            this.state.zeno_theta += this.config.evolutionSpeed * dt;
            if (this.state.time - this.state.zeno_last_measure >= this.config.measureTime) {
                // In MWI, a "measurement" is branching. The observer's branch is the one with the highest probability.
                // The probability of staying in the initial state is |<ψ(0)|ψ(t)>|^2 = cos^2(Δθ)
                const d_theta = this.state.zeno_theta;
                const probability_stay = Math.cos(d_theta)**2;

                // Create a splinter world for the "evolved" state
                this.state.zeno_branches.push({
                    theta: this.state.zeno_theta,
                    alpha: 1 - probability_stay, // Opacity proportional to probability
                    life: 1.0
                });

                // We follow the main branch, which "resets"
                this.state.zeno_theta = 0;
                this.state.zeno_last_measure = this.state.time;
            }

            // Update and fade branches
            this.state.zeno_branches.forEach(b => b.life -= dt * 2);
            this.state.zeno_branches = this.state.zeno_branches.filter(b => b.life > 0);
        },

        draw() {
            this.drawDial(this.ctx.free, this.state.free_theta, []);
            this.drawDial(this.ctx.zeno, this.state.zeno_theta, this.state.zeno_branches);
            this.updateMetrics();
        },

        drawDial(ctx, theta, branches) {
            const canvas = ctx.canvas;
            const w = canvas.width;
            const h = canvas.height;
            const cx = w/2;
            const cy = h/2;
            const r = w * 0.4;

            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,w,h);

            // Draw dial
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2*Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx, cy-r); ctx.lineTo(cx, cy-r-10);
            ctx.stroke();

            // Draw branches
            branches.forEach(b => {
                ctx.strokeStyle = `rgba(0, 221, 255, ${b.alpha * b.life * 0.5})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + r * Math.sin(b.theta), cy - r * Math.cos(b.theta));
                ctx.stroke();
            });

            // Draw main vector
            ctx.strokeStyle = 'var(--accent-color)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + r * Math.sin(theta), cy - r * Math.cos(theta));
            ctx.stroke();
        },

        updateMetrics() {
            const prob_stay = (Math.cos(this.state.zeno_theta)**2 * 100).toFixed(1);
            const metrics = {
                time: { label: 'Time', value: this.state.time.toFixed(2) + ' s' },
                prob: { label: 'Survival Probability (Zeno)', value: `${prob_stay}%` },
                worlds: { label: 'Splinter Worlds', value: this.state.zeno_branches.length },
            };
            const container = this.elements.metricsContainer;
            container.innerHTML = '';
            for(const [key, metric] of Object.entries(metrics)) {
                const el = document.createElement('div');
                el.classList.add('metric-item');
                el.innerHTML = `<div class="label">${metric.label}</div><div class="value">${metric.value}</div>`;
                container.appendChild(el);
            }
        },

        gameLoop() { /* ... */ },
        togglePause() { /* ... */ },

        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>The Quantum Zeno Effect, sometimes called the "watched pot" effect, is a fascinating phenomenon where the evolution of a quantum system can be halted by measuring it frequently enough. In traditional interpretations, this is explained by repeated wave function collapse. But how does the Many-Worlds Interpretation (MWI), which has no collapse, account for this? This simulation provides the MWI perspective. On the left, a quantum spin evolves freely. On the right, the same system is "measured" periodically. In the MWI view, each measurement is a branching of the universe. By measuring frequently, you are constantly splitting off universes where the spin *has* evolved, while you, the observer, are overwhelmingly likely to follow the branch where it has not. The result is that your reality appears frozen, while a cascade of other worlds carries away the possibilities of change.</p>

                <h2>Core Theory</h2>
                <p>Consider a quantum state |ψ⟩ that is initially in a state |ψ₀⟩ (e.g., spin up). Under its own dynamics (governed by a Hamiltonian H), it will evolve over time. After a short time Δt, its state is |ψ(Δt)⟩. The probability that the system is *still* in the state |ψ₀⟩ is given by P(stay) = |⟨ψ₀|ψ(Δt)⟩|². For small Δt, this probability is very high, approximately 1 - (ΔE/ħ)²(Δt)², where ΔE is the energy uncertainty.</p>
                <p><b>In the Copenhagen view:</b> If we measure the system at time Δt, the wave function collapses. It will collapse back to |ψ₀⟩ with probability P(stay), effectively resetting the evolution. If we do this repeatedly and rapidly, we keep forcing it back to the initial state, preventing it from ever evolving away.</p>
                <p><b>In the Many-Worlds view:</b> There is no collapse. When the observer measures the system at time Δt, the universe branches. One branch, with a large probability amplitude (proportional to cos(ωΔt)), contains the observer and the system still in state |ψ₀⟩. Another branch, with a small amplitude (proportional to sin(ωΔt)), contains a copy of the observer and the system in an evolved state. If Δt is small, the observer is almost certain to find themselves in the "stay" branch. By repeating the measurement, the observer continuously follows the high-probability path where the system state is essentially unchanged, while creating a spray of low-probability "splinter" universes where the evolution did happen. The simulation on the right visualizes this: the main vector (your world) stays put, while faint branches (other worlds) split off at each measurement.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. Does this mean we can stop time for a quantum particle?</strong>
                    <p>In a sense, yes, but only for a specific state of that particle. You aren't stopping time itself, but you are preventing the particle from transitioning out of a chosen state into other states. It's crucial to understand that this requires repeated interaction with the particle (the "measurements"). This interaction must be able to distinguish the initial state from other states. The effect has been experimentally verified numerous times, for example, by using laser pulses to repeatedly probe an atom and prevent it from decaying from an excited state.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on the Zeno effect and MWI ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };

    document.addEventListener('DOMContentLoaded', () => SimApp.init());
    </script>
</body>
</html>
