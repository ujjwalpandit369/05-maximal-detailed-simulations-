<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: 10D Superstring Theory</title>
    <meta name="description" content="An interactive simulation of superstring theory, visualizing how different vibrational modes of a fundamental string give rise to different particles.">
    <meta name="keywords" content="String Theory, Superstring, Vibrational Modes, Extra Dimensions, Calabi-Yau, Quantum Gravity, Physics Simulation">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #c9d1d9;
            --secondary-color: #161b22;
            --accent-color: #56d364; /* A vibrant green for strings */
            --highlight-color: #a371f7; /* A mystical purple */
            --border-color: #30363d;
            --font-family: 'Exo 2', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.8;
            font-size: 18px;
        }
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; color: var(--accent-color); font-weight: 700; }
        h2 { font-size: 2em; color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        h3 { font-size: 1.5em; color: var(--highlight-color); margin-top: 30px; }
        .panel {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            align-items: flex-start;
        }
        .viz-item {
            background-color: #000;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            position: relative;
            height: 700px;
            overflow: hidden;
        }
        .viz-item canvas { width: 100%; height: 100%; display: block; }
        #calabi-yau-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            border: 1px solid var(--border-color);
            background-color: rgba(0,0,0,0.5);
        }
        .controls-column .panel { position: sticky; top: 20px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: var(--primary-color); }
        select, button {
            width: 100%;
            padding: 10px;
            background-color: var(--secondary-color);
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1em;
        }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .metric-item { background-color: #0d1117; padding: 15px; border-radius: 5px; border-left: 3px solid var(--highlight-color); }
        .metric-item strong { display: block; color: var(--accent-color); font-size: 0.9em; }
        .metric-item span { font-family: var(--font-mono); font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Simulation: The Symphony of Superstrings</h1>
            <p>Visualizing Particles as Vibrational Modes of a Fundamental String</p>
        </header>

        <div class="main-layout">
            <div class="simulation-column">
                <div class="panel">
                    <div class="viz-item">
                        <div id="string-container"></div>
                        <div id="calabi-yau-container"></div>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>

            <div class="controls-column">
                <div class="panel">
                    <h3>String Controls</h3>
                    <div class="control-group">
                        <label for="string-type-select">String Type</label>
                        <select id="string-type-select">
                            <option value="closed" selected>Closed String</option>
                            <option value="open">Open String</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="vibration-mode-select">Vibrational Mode (Harmonic)</label>
                        <select id="vibration-mode-select">
                            <option value="0">n=0 (Ground State)</option>
                            <option value="1">n=1 (First Harmonic)</option>
                            <option value="2">n=2 (Second Harmonic)</option>
                            <option value="3">n=3 (Third Harmonic)</option>
                        </select>
                    </div>
                     <div class="control-group">
                        <label for="tension-slider">String Tension (T)</label>
                        <input type="range" id="tension-slider" min="0.1" max="2" step="0.1" value="1">
                        <span id="tension-value">1.0</span>
                    </div>
                </div>
                <div class="panel">
                    <h3>Resulting Particle Properties</h3>
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <strong>Particle Type</strong>
                            <span id="metric-particle-type">Graviton</span>
                        </div>
                        <div class="metric-item">
                            <strong>Mass² (in T units)</strong>
                            <span id="metric-mass">0</span>
                        </div>
                        <div class="metric-item">
                            <strong>Spin</strong>
                            <span id="metric-spin">2</span>
                        </div>
                        <div class="metric-item">
                            <strong>Force / Matter</strong>
                            <span id="metric-class">Boson (Force)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // This script requires THREE.js, which is linked in the head.
    const SimApp = {
        config: {
            stringType: 'closed',
            mode: 0,
            tension: 1.0,
        },
        elements: {},
        three: {
            string: { scene: null, camera: null, renderer: null, stringMesh: null, line: null },
            cy: { scene: null, camera: null, renderer: null, cyMesh: null }
        },

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.initThreeJS();
            this.updateParticleProperties();
            this.injectTextContent();
            this.animate();
        },

        cacheDOMElements() {
            this.elements = {
                stringContainer: document.getElementById('string-container'),
                cyContainer: document.getElementById('calabi-yau-container'),
                typeSelect: document.getElementById('string-type-select'),
                modeSelect: document.getElementById('vibration-mode-select'),
                tensionSlider: document.getElementById('tension-slider'),
                tensionValue: document.getElementById('tension-value'),
                particleType: document.getElementById('metric-particle-type'),
                mass: document.getElementById('metric-mass'),
                spin: document.getElementById('metric-spin'),
                class: document.getElementById('metric-class'),
            };
        },

        initThreeJS() {
            // Main string scene
            const s = this.three.string;
            s.scene = new THREE.Scene();
            s.camera = new THREE.PerspectiveCamera(75, this.elements.stringContainer.clientWidth / this.elements.stringContainer.clientHeight, 0.1, 1000);
            s.renderer = new THREE.WebGLRenderer({ antialias: true });
            s.renderer.setSize(this.elements.stringContainer.clientWidth, this.elements.stringContainer.clientHeight);
            this.elements.stringContainer.appendChild(s.renderer.domElement);
            s.camera.position.z = 5;

            // Calabi-Yau scene
            const c = this.three.cy;
            c.scene = new THREE.Scene();
            c.camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            c.renderer = new THREE.WebGLRenderer({ antialias: true });
            c.renderer.setSize(150, 150);
            this.elements.cyContainer.appendChild(c.renderer.domElement);
            const cyGeometry = new THREE.TorusKnotGeometry(0.5, 0.1, 100, 16, 3, 5);
            const cyMaterial = new THREE.MeshNormalMaterial({ wireframe: true });
            c.cyMesh = new THREE.Mesh(cyGeometry, cyMaterial);
            c.scene.add(c.cyMesh);
            c.camera.position.z = 1.5;
        },

        setupUIListeners() {
            this.elements.typeSelect.addEventListener('change', e => {
                this.config.stringType = e.target.value;
                this.updateParticleProperties();
            });
            this.elements.modeSelect.addEventListener('change', e => {
                this.config.mode = parseInt(e.target.value);
                this.updateParticleProperties();
            });
            this.elements.tensionSlider.addEventListener('input', e => {
                this.config.tension = parseFloat(e.target.value);
                this.elements.tensionValue.textContent = this.config.tension.toFixed(1);
                this.updateParticleProperties();
            });
        },

        updateParticleProperties() {
            const { stringType, mode, tension } = this.config;
            let particle = {};

            if (stringType === 'closed') {
                if (mode === 0) particle = { name: 'Graviton/Dilaton', massSq: 0, spin: 2, class: 'Boson (Force)' };
                else particle = { name: 'Massive Particle', massSq: (mode * 2 * tension).toFixed(1), spin: 'Mixed', class: 'Boson/Fermion' };
            } else { // open
                if (mode === 0) particle = { name: 'Photon-like', massSq: 0, spin: 1, class: 'Boson (Force)' };
                else particle = { name: 'Electron-like', massSq: (mode * tension).toFixed(1), spin: '1/2', class: 'Fermion (Matter)' };
            }

            this.elements.particleType.textContent = particle.name;
            this.elements.mass.textContent = particle.massSq;
            this.elements.spin.textContent = particle.spin;
            this.elements.class.textContent = particle.class;
        },

        animate() {
            requestAnimationFrame(() => this.animate());
            const time = Date.now() * 0.002;

            // Animate CY
            this.three.cy.cyMesh.rotation.x += 0.01;
            this.three.cy.cyMesh.rotation.y += 0.005;
            this.three.cy.renderer.render(this.three.cy.scene, this.three.cy.camera);

            // Animate string
            if (this.three.string.line) {
                const points = this.three.string.line.geometry.points;
                const mode = this.config.mode;
                const type = this.config.stringType;

                for(let i=0; i<points.length; i++) {
                    const p = points[i];
                    const freq = (mode + 1) * Math.PI;
                    if (mode > 0) {
                        p.y = 0.5 * Math.sin(i/10 * freq + time) * Math.sin(i/points.length * Math.PI);
                        if (type === 'closed') {
                           p.x = 2 * Math.cos(i / points.length * 2 * Math.PI) + 0.5 * Math.cos(i/10 * freq + time) * Math.sin(i/points.length * Math.PI);
                        }
                    } else {
                         p.y = 0;
                         if(type === 'closed') p.x = 2 * Math.cos(i / points.length * 2 * Math.PI);
                    }
                }
                this.three.string.line.geometry.verticesNeedUpdate = true;
            } else {
                 this.createString();
            }
            this.three.string.renderer.render(this.three.string.scene, this.three.string.camera);
        },

        createString() {
            if (this.three.string.line) this.three.string.scene.remove(this.three.string.line);

            const points = [];
            const segments = 100;
            const length = 4;
            for (let i = 0; i <= segments; i++) {
                if (this.config.stringType === 'open') {
                    points.push(new THREE.Vector3(-length/2 + (i/segments)*length, 0, 0));
                } else {
                    points.push(new THREE.Vector3(2 * Math.cos(i/segments * 2 * Math.PI), 2 * Math.sin(i/segments * 2 * Math.PI), 0));
                }
            }

            const geometry = new THREE.Geometry();
            geometry.points = points;
            const material = new THREE.LineBasicMaterial({ color: 0x56d364, linewidth: 3 });
            this.three.string.line = new THREE.Line(geometry, material);
            this.three.string.scene.add(this.three.string.line);
        },

        injectTextContent() {
            const content = `
                <h2>From Points to Strings: A Revolution in Physics</h2>
                <p>For centuries, the ambition of fundamental physics has been to find a single, unified theory that describes all the forces and particles of nature. The Standard Model of Particle Physics is a monumental achievement, successfully describing three of the four fundamental forces (electromagnetism, the weak force, and the strong force) in a single quantum framework. Yet, it leaves out gravity. The problem is that when we try to combine General Relativity (our theory of gravity) with quantum mechanics, the math breaks down, yielding nonsensical, infinite answers. <strong>String Theory</strong> proposes a radical and elegant solution: what if the fundamental constituents of reality are not zero-dimensional points, but tiny, one-dimensional, vibrating "strings"?</p>
                <p>This simple-sounding premise changes everything. The interactions of point particles occur at a single point in spacetime, leading to the infinities that plague quantum gravity. The interactions of strings are "smeared out" in spacetime as they touch and merge, naturally smoothing out the infinities and allowing for a consistent quantum theory of gravity. This simulation visualizes the most profound consequence of this idea: the particles themselves are nothing more than different "notes" played on a fundamental string.</p>

                <h2>The Symphony of Reality</h2>
                <p>The core concept of string theory is that a single, fundamental string can vibrate in different ways, much like a violin string can produce different musical notes (a fundamental note and various overtones or harmonics). In string theory, these different vibrational modes are not musical notes; they are the fundamental particles of our universe. A string vibrating in one pattern might appear to us as an electron. The same string vibrating in another pattern would be a photon. And another, a quark. All the particles in the universe could be unified into a single framework—they are all just different notes in a grand cosmic symphony played on the same fundamental strings. This is the ultimate dream of unification.</p>
                <p>In this simulation, you can select different vibrational modes for a string. Notice how changing the mode changes the properties of the resulting particle. The "ground state" (mode n=0) corresponds to the lowest-energy vibration, typically producing massless particles. Higher modes (n=1, 2, 3...) correspond to more energetic vibrations and thus produce more massive particles. The mass of these particles is also determined by the <strong>string tension</strong>, a fundamental parameter of the theory that determines how "stiff" the strings are.</p>

                <h2>Open Strings, Closed Strings, and Gravity</h2>
                <p>There are two primary types of strings. <strong>Open strings</strong> have two endpoints, while <strong>closed strings</strong> form a continuous loop. This distinction is critical. Open strings can describe particles like the photon, the carrier of the electromagnetic force. But the real magic comes from closed strings. A remarkable mathematical result is that the lowest-energy, massless vibrational mode of a closed string always has the exact properties of the <strong>graviton</strong>—the hypothetical quantum particle of gravity. Unlike any previous theory, string theory doesn't just accommodate gravity; it *requires* it. The existence of gravity is a direct prediction of the theory.</p>

                <h2>The Need for Extra Dimensions and Supersymmetry</h2>
                <p>This beautiful picture comes with a startling prediction: it can only work in a universe with more dimensions than the four we experience (3 space + 1 time). The earliest version of string theory required 26 dimensions. This version had a fatal flaw: its lowest-energy state was a "tachyon," a particle that travels faster than light and implies an unstable vacuum. The solution was to introduce <strong>supersymmetry</strong>, a profound symmetry that relates the two fundamental classes of particles: bosons (force-carriers, like the photon) and fermions (matter particles, like the electron). By incorporating supersymmetry, the theory became <strong>Superstring Theory</strong>. The tachyon was eliminated, and the number of required dimensions dropped to a more (though still highly) manageable <strong>10 dimensions</strong>.</p>
                <p>So where are these 6 extra spatial dimensions? The theory posits they are <strong>compactified</strong>—curled up into a tiny, complex geometric shape at every point in our familiar 3D space. The most likely candidates for these shapes are known as Calabi-Yau manifolds, one of which is visualized in the corner of the simulation. We don't see the extra dimensions because they are smaller than anything we can probe, but their shape and structure determine the very laws of physics and the types of string vibrations—and thus, particles—that are possible in our universe.</p>

                <h2>Q&A: Unraveling the Strings</h2>
                <div class="qa-item">
                    <strong>1. Has string theory been experimentally proven?</strong>
                    <p>No. To date, there is no direct experimental evidence for string theory. Its predictions, such as extra dimensions and supersymmetry, have not yet been observed at particle accelerators like the LHC. The energy scale at which strings would become directly visible (the Planck scale) is about a quadrillion times higher than what the LHC can reach. For now, it remains a mathematically compelling and consistent theoretical framework, but not a proven physical theory.</p>
                </div>
                <div class="qa-item">
                    <strong>2. What are strings made of?</strong>
                    <p>In string theory, the strings are fundamental. They are not "made of" anything smaller. They are the basic building blocks of everything else, just as point particles are in the Standard Model. The question "What is a string made of?" is like asking "What is an electron made of?"—in the theory, it's a fundamental object.</p>
                </div>
                <!-- ... 18+ more Q&A items ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
