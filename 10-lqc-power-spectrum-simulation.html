<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: LQC Power Spectrum</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --accent-color: #00ffaa; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        h1 { font-size: 2.5em; margin: 0; }
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .chart-container { background: var(--panel-bg); border-radius: 8px; padding: 20px; grid-column: 1 / 2; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; grid-column: 2 / 3; }
        h3 { color: var(--secondary-color); }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="range"] { width: 100%; }
        .exposition, .qa-section { background: var(--panel-bg); border-radius: 8px; padding: 25px; margin-top: 20px; grid-column: 1 / 3; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>LQC-Corrected Primordial Power Spectrum</h1></header>
        <div class="main-layout">
            <div class="chart-container">
                <h2>P(k) vs. Wavenumber k</h2>
                <div id="spectrum-chart"></div>
                <h2>Residuals ((LQC - Inflation) / Inflation)</h2>
                <div id="residuals-chart"></div>
            </div>
            <div class="controls-panel">
                <h3>Controls</h3>
                <label>Spectral Index (n<sub>s</sub>): <span id="ns-value">0.965</span></label>
                <input type="range" id="ns-slider" min="0.9" max="1.1" step="0.005" value="0.965">
                <label>LQC Bounce Scale (k<sub>0</sub>): <span id="k0-value">0.1</span></label>
                <input type="range" id="k0-slider" min="0.01" max="1" step="0.01" value="0.1">
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full LQC power spectrum script.
    // The final version will contain dynamic SVG charts comparing the
    // inflationary and LQC models based on user-controlled parameters.

    const DOM = {
        spectrumChart: document.getElementById('spectrum-chart'),
        residualsChart: document.getElementById('residuals-chart'),
        nsSlider: document.getElementById('ns-slider'),
        nsValue: document.getElementById('ns-value'),
        k0Slider: document.getElementById('k0-slider'),
        k0Value: document.getElementById('k0-value'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = { ns: 0.965, k0: 0.1 };

    function calculateSpectra() {
        const k_values = Array.from({length: 200}, (_, i) => Math.pow(10, -4 + i * 0.02));

        const inflation_spec = k_values.map(k => Math.pow(k, state.ns - 1));

        // Simplified LQC suppression model
        const lqc_spec = k_values.map(k => {
            const suppression = 1 / (1 + Math.pow(state.k0 / k, 2));
            return Math.pow(k, state.ns - 1) * suppression;
        });

        const residuals = inflation_spec.map((p_inf, i) => {
            const p_lqc = lqc_spec[i];
            return (p_lqc - p_inf) / p_inf;
        });

        return { k_values, inflation_spec, lqc_spec, residuals };
    }

    function drawCharts() {
        const { k_values, inflation_spec, lqc_spec, residuals } = calculateSpectra();

        // Placeholder for dynamic SVG chart drawing logic
        DOM.spectrumChart.innerHTML = `<p>Chart showing inflationary and LQC spectra.</p>`;
        DOM.residualsChart.innerHTML = `<p>Chart showing percentage difference.</p>`;
    }

    function setup() {
        function update() {
            state.ns = parseFloat(DOM.nsSlider.value);
            state.k0 = parseFloat(DOM.k0Slider.value);
            DOM.nsValue.textContent = state.ns.toFixed(3);
            DOM.k0Value.textContent = state.k0.toFixed(2);
            drawCharts();
        }

        DOM.nsSlider.addEventListener('input', update);
        DOM.k0Slider.addEventListener('input', update);

        DOM.expositionContent.innerHTML = "<h1>An Echo of the Bounce</h1><p>...Full 5000+ word text...</p>";
        DOM.qaContent.innerHTML = "<h2>Questions & Answers</h2>" + "<div>...20+ Q&A items...</div>";

        update();
    }

    setup();
});
</script>
</body>
</html>
