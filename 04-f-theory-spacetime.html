<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: 12D F-Theory</title>
    <meta name="description" content="An interactive simulation of F-Theory, visualizing how the geometry of a 2-torus fiber over a 10D spacetime encodes the string coupling constant and D7-branes.">
    <meta name="keywords" content="F-Theory, String Theory, Type IIB, D-Brane, Duality, Axio-dilaton, Elliptic Fibration, Physics Simulation">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #c9d1d9;
            --secondary-color: #161b22;
            --accent-color: #4ec9b0; /* A teal/turquoise color */
            --highlight-color: #f07178; /* A reddish color for singularities */
            --border-color: #30363d;
            --font-family: 'Exo 2', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.8;
            font-size: 18px;
        }
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; color: var(--accent-color); font-weight: 700; }
        h2 { font-size: 2em; color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        h3 { font-size: 1.5em; color: var(--highlight-color); margin-top: 30px; }
        .panel {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: flex-start;
        }
        .viz-item {
            background-color: #000;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            position: relative;
            height: 600px;
        }
        .viz-item canvas { width: 100%; height: 100%; display: block; }
        .controls-column .panel { position: sticky; top: 20px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .metric-item { background-color: #0d1117; padding: 15px; border-radius: 5px; border-left: 3px solid var(--highlight-color); }
        .metric-item strong { display: block; color: var(--accent-color); font-size: 0.9em; }
        .metric-item span { font-family: var(--font-mono); font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Simulation: F-Theory and the Geometric Origin of Forces</h1>
            <p>Visualizing the 12-Dimensional Framework for Non-Perturbative String Theory</p>
        </header>

        <div class="main-layout">
            <div class="simulation-column">
                <div class="panel">
                    <h3>10D Base Space</h3>
                    <div class="viz-item" id="base-space-container"></div>
                </div>
                 <div class="panel" id="text-content-container"></div>
            </div>

            <div class="controls-column">
                 <div class="panel">
                    <h3>2D Torus Fiber</h3>
                    <div class="viz-item" id="torus-container"></div>
                </div>
                <div class="panel">
                    <h3>Probe Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <strong>Probe Location (x,y)</strong>
                            <span id="metric-location">(0.50, 0.50)</span>
                        </div>
                        <div class="metric-item">
                            <strong>String Coupling gₛ</strong>
                            <span id="metric-coupling">1.00</span>
                        </div>
                        <div class="metric-item">
                            <strong>Status</strong>
                            <span id="metric-status">Smooth</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // Requires THREE.js
    const SimApp = {
        elements: {},
        three: {
            base: { scene: null, renderer: null, camera: null, probe: null, d7brane: null },
            torus: { scene: null, renderer: null, camera: null, torusMesh: null }
        },

        init() {
            this.cacheDOMElements();
            this.initThreeJS();
            this.injectTextContent();
            this.animate();
        },

        cacheDOMElements() {
            this.elements = {
                baseContainer: document.getElementById('base-space-container'),
                torusContainer: document.getElementById('torus-container'),
                metricLocation: document.getElementById('metric-location'),
                metricCoupling: document.getElementById('metric-coupling'),
                metricStatus: document.getElementById('metric-status'),
            };
        },

        initThreeJS() {
            // Base space scene
            const b = this.three.base;
            b.scene = new THREE.Scene();
            b.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
            b.renderer = new THREE.WebGLRenderer();
            b.renderer.setSize(this.elements.baseContainer.clientWidth, this.elements.baseContainer.clientHeight);
            this.elements.baseContainer.appendChild(b.renderer.domElement);
            b.camera.position.z = 10;

            const planeGeo = new THREE.PlaneGeometry(2, 2);
            const planeMat = new THREE.MeshBasicMaterial({ color: 0x161b22 });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            b.scene.add(plane);

            const probeGeo = new THREE.CircleGeometry(0.05, 32);
            const probeMat = new THREE.MeshBasicMaterial({ color: 0xffcb6b });
            b.probe = new THREE.Mesh(probeGeo, probeMat);
            b.scene.add(b.probe);

            const d7Geo = new THREE.TorusGeometry(0.5, 0.02, 16, 100);
            const d7Mat = new THREE.MeshBasicMaterial({ color: 0xf07178 });
            b.d7brane = new THREE.Mesh(d7Geo, d7Mat);
            b.d7brane.position.set(0.3, 0.3, 0);
            b.scene.add(b.d7brane);

            // Torus scene
            const t = this.three.torus;
            t.scene = new THREE.Scene();
            t.camera = new THREE.PerspectiveCamera(75, this.elements.torusContainer.clientWidth / this.elements.torusContainer.clientHeight, 0.1, 1000);
            t.renderer = new THREE.WebGLRenderer({ antialias: true });
            t.renderer.setSize(this.elements.torusContainer.clientWidth, this.elements.torusContainer.clientHeight);
            this.elements.torusContainer.appendChild(t.renderer.domElement);
            t.camera.position.z = 3;

            const torusGeo = new THREE.TorusGeometry(1, 0.4, 32, 100);
            const torusMat = new THREE.MeshStandardMaterial({ color: 0x4ec9b0, roughness: 0.5 });
            t.torusMesh = new THREE.Mesh(torusGeo, torusMat);
            t.scene.add(t.torusMesh);
            const light = new THREE.PointLight(0xffffff, 1);
            light.position.set(5,5,5);
            t.scene.add(light);

            this.elements.baseContainer.addEventListener('mousemove', e => {
                const rect = this.elements.baseContainer.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                const y = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
                b.probe.position.set(x, y, 1);
            });
        },

        animate() {
            requestAnimationFrame(() => this.animate());
            const t = this.three.torus;
            t.torusMesh.rotation.x += 0.005;
            t.torusMesh.rotation.y += 0.01;

            this.updateTorusShape();

            this.three.base.renderer.render(this.three.base.scene, this.three.base.camera);
            this.three.torus.renderer.render(this.three.torus.scene, this.three.torus.camera);
        },

        updateTorusShape() {
            const probePos = this.three.base.probe.position;
            const d7Pos = this.three.base.d7brane.position;
            const distToBrane = probePos.distanceTo(d7Pos);

            const coupling = Math.max(0.1, 5 / (distToBrane * 20 + 1));
            const tubeRadius = 0.4 / coupling;

            this.three.torus.torusMesh.geometry.dispose();
            this.three.torus.torusMesh.geometry = new THREE.TorusGeometry(1, tubeRadius, 32, 100);

            this.elements.metricLocation.textContent = `(${probePos.x.toFixed(2)}, ${probePos.y.toFixed(2)})`;
            this.elements.metricCoupling.textContent = coupling.toFixed(2);
            if (distToBrane < 0.1) {
                this.elements.metricStatus.textContent = 'Singular (D7-Brane)';
                this.three.torus.torusMesh.material.color.set(0xf07178);
            } else {
                 this.elements.metricStatus.textContent = 'Smooth';
                 this.three.torus.torusMesh.material.color.set(0x4ec9b0);
            }
        },

        injectTextContent() {
            const content = `
                <h2>Beyond Perturbation: F-Theory</h2>
                <p>Superstring theories are incredibly powerful, but most of our understanding of them is "perturbative"—it is based on calculations that only work when the fundamental string coupling constant, <code>gₛ</code>, is very small. This is like understanding a drum only by tapping it very lightly. What happens when the coupling is strong? How does the drum sound when you hit it hard? For a long time, this "non-perturbative" or "strongly-coupled" regime was largely inaccessible. <strong>F-Theory</strong>, introduced by physicist Cumrun Vafa, is a powerful framework developed to explore exactly this regime, specifically for Type IIB superstring theory.</p>
                <p>F-theory is not a new physical theory in 12 dimensions. Rather, it is a 12-dimensional <em>geometric framework</em> that cleverly encodes the non-perturbative physics of the 10-dimensional Type IIB theory. The two "extra" dimensions in F-theory are not physical; they are a mathematical construct, forming a 2-torus (a donut shape) at every point of the 10D spacetime. The crucial insight is that the <strong>shape</strong> of this torus geometrically encodes the value of the string coupling constant.</p>

                <h2>The Geometric Dictionary of F-Theory</h2>
                <p>The core of F-theory is another beautiful "physics-geometry dictionary." In Type IIB string theory, the coupling constant <code>gₛ</code> is not a constant number; it's determined by the value of a field called the dilaton. F-theory geometrizes this concept.</p>
                <ul>
                    <li><strong>The Base and the Fiber:</strong> The physical 10D spacetime is called the "base." At every point on this base, we attach a 2-torus, called the "fiber." This entire structure is a type of mathematical object called an elliptic fibration.</li>
                    <li><strong>The Shape of the Torus is the Coupling:</strong> The "shape" of the torus (its complex structure modulus, τ) is identified with a combination of the dilaton and another field called the axion. The value of τ at a point on the base space tells you the exact value of the string coupling <code>gₛ</code> at that same point in the physical 10D theory.</li>
                </ul>
                <p>In this simulation, the left pane represents the 10D base space. You can move your probe to any location. The right pane shows the corresponding torus fiber for that location. As you move the probe, you can see the shape of the torus change, representing the changing value of the string coupling constant across the spacetime.</p>

                <h2>Singularities, Branes, and the Power of Geometry</h2>
                <p>The true power of F-theory becomes apparent when the coupling becomes strong. What happens when <code>gₛ</code> approaches infinity? In F-theory, this corresponds to the torus fiber degenerating—it pinches itself into a singular shape, like a donut being squeezed until the hole vanishes. This is a geometric singularity.</p>
                <p>Remarkably, these locations where the torus becomes singular are precisely the locations of <strong>D7-branes</strong> in the physical Type IIB theory. D7-branes are 7-dimensional objects that are essential for building realistic particle physics models, but their behavior at strong coupling is very difficult to study. F-theory transforms this difficult physics problem into a problem in algebraic geometry—the study of solutions to polynomial equations. By studying the types of singularities the torus can develop, physicists can classify the types of forces (like the SU(3), SU(2), and U(1) forces of the Standard Model) and matter content that can exist on these branes. This has made F-theory an incredibly powerful and popular tool for "string phenomenology"—the effort to build models from string theory that reproduce the Standard Model of particle physics.</p>
                <p>In the simulation, the red circle in the base space represents the location of a D7-brane. As you move your probe over this circle, you will see the torus in the right pane pinch and turn red, indicating that it has become singular and the string coupling is very strong.</p>

                <h2>Q&A: The Father of Theories?</h2>
                <div class="qa-item">
                    <strong>1. Are the 11th and 12th dimensions of F-theory real?</strong>
                    <p>No, they are generally considered a mathematical convenience. Unlike the 11th dimension of M-theory, which is thought to be a real physical spatial dimension, the two extra dimensions of F-theory are a formal tool to keep track of the varying coupling constant of the 10D Type IIB theory. The physics described by F-theory is ultimately 10-dimensional.</p>
                </div>
                <div class="qa-item">
                    <strong>2. Why is it called F-Theory?</strong>
                    <p>It's a playful name. Cumrun Vafa, its creator, noted that M-Theory's name was mysterious. Since F comes before M in the alphabet, it was a joke that perhaps F-Theory was the "Father" of M-Theory. In reality, F-theory is a specific construction for studying Type IIB string theory, while M-theory is the proposed unification of all five string theories.</p>
                </div>
                <!-- ... 18+ more Q&A items ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
