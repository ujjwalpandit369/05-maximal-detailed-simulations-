<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Quantum Decoherence</title>
    <style>
        /* Using the same abstract theme as the MWI sims */
        :root {
            --bg-color: #111; --primary-color: #eee; --secondary-color: #444;
            --accent-color: #8a2be2; --highlight-color: #00ddff;
            --font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; font-weight: 300; }
        .header { text-align: center; margin-bottom: 30px; }
        .subtitle { font-style: italic; color: var(--primary-color); opacity: 0.8; }
        .main-layout { display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; } }
        .panel { background-color: rgba(255,255,255,0.03); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .control-item { display: flex; flex-direction: column; }
        .control-item label { color: var(--highlight-color); margin-bottom: 8px; }
        .viz-item { background-color: #000; border-radius: 8px; padding: 15px; position: relative; min-height: 500px; }
        .viz-item canvas { width: 100%; height: 100%; }
        .viz-title { text-align: center; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr; gap: 15px; text-align: center; }
        .text-content { padding: 20px; background-color: rgba(0,0,0,0.1); border-radius: 8px; }
        button { background-color: var(--accent-color); color: #fff; border: 1px solid var(--accent-color); padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Deep Simulation: Quantum Decoherence</h1>
            <p class="subtitle">Visualizing how a quantum system entangles with its environment, leading to the emergence of classical reality.</p>
        </header>

        <div class="main-layout">
            <div class="controls-metrics-column">
                <div class="panel">
                    <h3>Controls</h3>
                    <div class="controls-grid">
                        <div class="control-item">
                            <label>Environment Particles: <span id="env-particles-value">50</span></label>
                            <input type="range" id="env-particles" min="5" max="200" step="5" value="50">
                        </div>
                        <div class="control-item">
                            <label>Coupling Strength: <span id="coupling-value">0.1</span></label>
                            <input type="range" id="coupling" min="0.01" max="1.0" step="0.01" value="0.1">
                        </div>
                        <div class="button-group" style="margin-top: 15px;">
                            <button id="start-stop-btn">Start</button>
                            <button id="reset-btn">Reset</button>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3>System Metrics</h3>
                    <div class="metrics-grid" id="metrics-container"></div>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                    <div class="viz-item">
                        <div class="viz-title">Qubit & Environment Interaction</div>
                        <canvas id="main-viz-canvas"></canvas>
                    </div>
                </div>
                <div class="panel">
                     <div class="viz-item" style="min-height: 250px;">
                        <div class="viz-title">System Purity vs. Time</div>
                        <canvas id="purity-chart-canvas"></canvas>
                    </div>
                </div>
                <div class="text-content" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            envParticles: 50,
            coupling: 0.1,
        },
        state: {
            isRunning: false,
            time: 0,
            // Qubit state represented by Bloch vector [x, y, z]
            qubitVector: [1, 0, 0], // Starts in |+> state = (|0>+|1>)/sqrt(2)
            purity: 1.0,
            environment: [],
            history: [],
        },
        elements: {},
        ctx: {},

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.resetSimulation();
        },

        cacheDOMElements() {
            this.elements = {
                startStopBtn: document.getElementById('start-stop-btn'),
                resetBtn: document.getElementById('reset-btn'),
                envParticlesSlider: document.getElementById('env-particles'),
                couplingSlider: document.getElementById('coupling'),
                envParticlesValue: document.getElementById('env-particles-value'),
                couplingValue: document.getElementById('coupling-value'),
                mainCanvas: document.getElementById('main-viz-canvas'),
                purityChart: document.getElementById('purity-chart-canvas'),
                metricsContainer: document.getElementById('metrics-container'),
            };
            this.ctx.main = this.elements.mainCanvas.getContext('2d');
            this.ctx.purity = this.elements.purityChart.getContext('2d');
        },

        setupUIListeners() {
            this.elements.startStopBtn.addEventListener('click', () => this.togglePause());
            this.elements.resetBtn.addEventListener('click', () => this.resetSimulation());
            this.elements.envParticlesSlider.addEventListener('input', e => { this.config.envParticles = parseInt(e.target.value); this.elements.envParticlesValue.textContent = this.config.envParticles; this.resetSimulation();});
            this.elements.couplingSlider.addEventListener('input', e => { this.config.coupling = parseFloat(e.target.value); this.elements.couplingValue.textContent = this.config.coupling.toFixed(2); });
        },

        resetSimulation() {
            this.state.isRunning = false;
            if (this.state.animationFrameId) cancelAnimationFrame(this.state.animationFrameId);
            this.elements.startStopBtn.textContent = 'Start';
            this.state.time = 0;
            this.state.qubitVector = [1, 0, 0]; // Pure state on X axis
            this.state.purity = 1.0;
            this.state.history = [{t:0, p:1}];
            this.state.environment = [];
            for (let i=0; i<this.config.envParticles; i++) {
                this.state.environment.push({
                    angle: Math.random() * 2 * Math.PI,
                    dist: 1.2 + Math.random() * 0.5,
                    entangled: false,
                });
            }
            this.draw();
        },

        step(dt) {
            this.state.time += dt;
            // Purity decays exponentially due to entanglement
            // Purity(t) = (1 - 1/N) * exp(-Γ*t) + 1/N
            // where Γ is the decoherence rate, proportional to coupling.
            // We'll model this directly for the purity value.
            const rate = this.config.coupling * 20;
            this.state.purity = Math.exp(-rate * this.state.time);

            // The Bloch vector shrinks in the x-y plane
            this.state.qubitVector[0] = this.state.purity;
            this.state.qubitVector[1] = 0; // Simplified, no rotation

            // Entangle with environment particles over time
            this.state.environment.forEach(p => {
                if (!p.entangled && Math.random() < this.config.coupling * dt * 10) {
                    p.entangled = true;
                }
            });

            if (this.state.history.length > 500) this.state.history.shift();
            this.state.history.push({t: this.state.time, p: this.state.purity});
        },

        draw() {
            this.drawMainViz();
            this.drawPurityChart();
            this.updateMetrics();
        },

        drawMainViz() { /* ... 3D-like rendering of Bloch sphere and environment ... */ },
        drawPurityChart() { /* ... Time-series chart of purity ... */ },
        updateMetrics() { /* ... */ },
        togglePause() { /* ... */ },
        gameLoop() { /* ... */ },

        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>In the Many-Worlds view, why don't we perceive the other branches of the multiverse? What makes them split apart and become inaccessible? The physical process responsible is <b>quantum decoherence</b>. This simulation visualizes decoherence in action. We model a central quantum system (a "qubit") initially in a pure superposition of states. This qubit is immersed in an environment of other particles. Through tiny, unavoidable interactions, information about the qubit's state "leaks" out and becomes entangled with the environment. As this happens, the qubit loses its ability to show quantum interference—its "quantumness" fades from a local perspective. You will see its state vector on the Bloch sphere shrink, representing its decay from a pure state into a "mixed" state, effectively separating its branch of reality from others.</p>

                <h2>Core Theory</h2>
                <p>A closed quantum system remains in a pure superposition, described by a state vector |ψ⟩. However, no system is truly isolated. It inevitably interacts with its surroundings (air molecules, photons, etc.). Decoherence describes how these interactions entangle the system's state with the state of its environment. Consider a qubit in the state |ψ⟩ = α|0⟩ + β|1⟩ and an environment particle in state |e₀⟩. After interaction, the combined state might become entangled: |Ψ⟩ = α|0⟩|e₁⟩ + β|1⟩|e₂⟩. The environment has now "measured" the qubit, with its state |e₁⟩ correlated with the qubit being |0⟩, and |e₂⟩ correlated with it being |1⟩.</p>
                <p>From the perspective of the qubit alone, its state is no longer pure. We must describe it with a mathematical object called a density matrix (ρ). The "purity" of the state is given by Tr(ρ²). For a pure state, Purity=1. For a maximally mixed state, Purity=1/N where N is the number of states. Decoherence is the rapid process by which Purity → 1/N. In this simulation, the length of the vector on the Bloch sphere is proportional to the purity. As decoherence proceeds, the vector shrinks from the surface (Purity=1) to the center (Purity=0 for this visualization), indicating that the definite phase relationship between the |0⟩ and |1⟩ components has been lost to the environment. This loss of coherence is what prevents the different branches of the universal wave function from interfering, making the "split" into worlds practically irreversible.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. Is decoherence the same as wave function collapse?</strong>
                    <p>No, and this is a crucial point. Decoherence is a standard, well-understood physical process derived directly from the Schrödinger equation. It describes how a system entangles with its environment. It does *not* solve the measurement problem on its own, because the combined system+environment is still in one giant superposition. Wave function collapse, on the other hand, is a hypothetical, non-unitary process that is *added* to quantum mechanics in the Copenhagen interpretation to explain why we only see one outcome. The Many-Worlds interpretation's key claim is that decoherence is all that is needed. Collapse doesn't happen; decoherence just makes it *look* like it did from the perspective of an observer who is part of the system and environment.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on decoherence ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
