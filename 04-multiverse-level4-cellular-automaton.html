<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Level IV Multiverse - A Cellular Automaton Universe</title>
    <style>
        /* Using the same abstract theme */
        :root {
            --bg-color: #111; --primary-color: #eee; --secondary-color: #444;
            --accent-color: #f0a; /* A vibrant magenta for this mathematical world */
            --highlight-color: #0fa;
            --font-family: 'Inter', 'Segoe UI', sans-serif;
            --monospace-family: 'Fira Code', 'Courier New', monospace;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; font-weight: 300; }
        .header { text-align: center; margin-bottom: 30px; }
        .subtitle { font-style: italic; color: var(--primary-color); opacity: 0.8; }
        .main-layout { display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; } }
        .panel { background-color: rgba(255,255,255,0.03); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .control-item { display: flex; flex-direction: column; }
        .control-item label { color: var(--highlight-color); margin-bottom: 8px; }
        .viz-item { background-color: #000; border-radius: 8px; padding: 0; position: relative; min-height: 600px; image-rendering: pixelated; }
        .viz-item canvas { width: 100%; height: 100%; }
        .viz-title { text-align: center; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; padding: 10px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr; gap: 15px; text-align: center; }
        .text-content { padding: 20px; background-color: rgba(0,0,0,0.1); border-radius: 8px; }
        button { background-color: var(--accent-color); color: #fff; border: 1px solid var(--accent-color); padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Deep Simulation: The Mathematical Universe Hypothesis</h1>
            <p class="subtitle">Exploring a cellular automaton as a toy universe with its own simple, computable laws of physics.</p>
        </header>

        <div class="main-layout">
            <div class="controls-metrics-column">
                <div class="panel">
                    <h3>Laws of this Universe</h3>
                    <div class="controls-grid">
                        <div class="control-item">
                            <label for="rule-set">Select a Mathematical Structure (Rule)</label>
                            <select id="rule-set">
                                <option value="b3s23" selected>Conway's Game of Life (B3/S23)</option>
                                <option value="b2s">Seeds (B2/S)</option>
                                <option value="b3s012345678">Replicator</option>
                                <option value="b1s1">Rule 110-like</option>
                            </select>
                        </div>
                        <div id="rule-explanation"></div>
                    </div>
                </div>
                <div class="panel">
                    <h3>Genesis Controls</h3>
                     <div class="controls-grid">
                         <div class="control-item">
                            <label>Initial Density: <span id="density-value">25%</span></label>
                            <input type="range" id="density" min="0.01" max="0.8" step="0.01" value="0.25">
                        </div>
                        <div class="button-group">
                            <button id="start-stop-btn">Run</button>
                            <button id="step-btn">Step</button>
                            <button id="reset-btn">New "Big Bang" (Randomize)</button>
                        </div>
                    </div>
                </div>
                <div class="panel">
                    <h3>Metrics</h3>
                    <div class="metrics-grid" id="metrics-container"></div>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                    <div class="viz-item">
                        <div class="viz-title">A Universe Governed by Simple Rules</div>
                        <canvas id="main-viz-canvas"></canvas>
                    </div>
                </div>
                <div class="text-content" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            rule: 'b3s23',
            density: 0.25,
            gridSize: 256,
            speed: 10, // steps per second
        },
        state: {
            isRunning: false,
            grid: null,
            population: 0,
            generation: 0,
        },
        elements: {},
        ctx: {},

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.resetSimulation();
        },

        cacheDOMElements() {
            this.elements = {
                startStopBtn: document.getElementById('start-stop-btn'),
                stepBtn: document.getElementById('step-btn'),
                resetBtn: document.getElementById('reset-btn'),
                ruleSelect: document.getElementById('rule-set'),
                densitySlider: document.getElementById('density'),
                densityValue: document.getElementById('density-value'),
                mainCanvas: document.getElementById('main-viz-canvas'),
                metricsContainer: document.getElementById('metrics-container'),
                ruleExplanation: document.getElementById('rule-explanation'),
            };
            this.ctx.main = this.elements.mainCanvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.startStopBtn.addEventListener('click', () => this.togglePause());
            this.elements.stepBtn.addEventListener('click', () => this.step());
            this.elements.resetBtn.addEventListener('click', () => this.resetSimulation());
            this.elements.ruleSelect.addEventListener('change', e => { this.config.rule = e.target.value; this.updateRuleExplanation(); this.resetSimulation(); });
            this.elements.densitySlider.addEventListener('input', e => { this.config.density = parseFloat(e.target.value); this.elements.densityValue.textContent = `${(this.config.density*100).toFixed(0)}%`; });
        },

        resetSimulation() {
            this.state.isRunning = false;
            if (this.state.gameLoop) clearInterval(this.state.gameLoop);
            this.elements.startStopBtn.textContent = 'Run';

            this.state.generation = 0;
            const size = this.config.gridSize;
            this.elements.mainCanvas.width = size;
            this.elements.mainCanvas.height = size;
            this.state.grid = new Uint8Array(size * size);
            for(let i=0; i<this.state.grid.length; i++) {
                if(Math.random() < this.config.density) {
                    this.state.grid[i] = 1;
                }
            }
            this.updateRuleExplanation();
            this.draw();
            this.updateMetrics();
        },

        togglePause() {
            this.state.isRunning = !this.state.isRunning;
            this.elements.startStopBtn.textContent = this.state.isRunning ? 'Pause' : 'Run';
            if (this.state.isRunning) {
                this.state.gameLoop = setInterval(() => this.step(), 1000 / this.config.speed);
            } else {
                clearInterval(this.state.gameLoop);
            }
        },

        step() {
            const size = this.config.gridSize;
            const oldGrid = new Uint8Array(this.state.grid);
            const newGrid = new Uint8Array(size * size);
            const { born, survives } = this.parseRule(this.config.rule);
            let population = 0;

            for(let y=0; y<size; y++) {
                for(let x=0; x<size; x++) {
                    const idx = y * size + x;
                    let neighbors = 0;
                    for(let dy=-1; dy<=1; dy++) {
                        for(let dx=-1; dx<=1; dx++) {
                            if(dx===0 && dy===0) continue;
                            const nx = (x + dx + size) % size;
                            const ny = (y + dy + size) % size;
                            if(oldGrid[ny * size + nx]) neighbors++;
                        }
                    }

                    const isAlive = oldGrid[idx];
                    if(!isAlive && born.includes(neighbors)) {
                        newGrid[idx] = 1;
                    } else if(isAlive && survives.includes(neighbors)) {
                        newGrid[idx] = 1;
                    }
                }
            }
            this.state.grid = newGrid;
            this.state.generation++;
            this.draw();
            this.updateMetrics();
        },

        draw() {
            const ctx = this.ctx.main;
            const size = this.config.gridSize;
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,size,size);
            ctx.fillStyle = 'var(--highlight-color)';
            let pop = 0;
            for(let i=0; i<this.state.grid.length; i++) {
                if(this.state.grid[i]) {
                    const x = i % size;
                    const y = Math.floor(i/size);
                    ctx.fillRect(x,y,1,1);
                    pop++;
                }
            }
            this.state.population = pop;
        },

        updateMetrics() { /* ... */ },
        parseRule(ruleString) { /* ... */ },
        updateRuleExplanation() { /* ... */ },
        injectTextContent() { /* ... */ },
    };
    // ... Full implementation of helper functions ...
    SimApp.init();
    </script>
</body>
</html>
