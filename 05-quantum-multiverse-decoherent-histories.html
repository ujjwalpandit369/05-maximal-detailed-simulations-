<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Decoherent Histories Universe</title>
    <style>
        /* Using the same abstract theme */
        :root {
            --bg-color: #111; --primary-color: #eee; --secondary-color: #444;
            --accent-color: #8a2be2; --highlight-color: #00ddff;
            --consistent-color: #28a745; --inconsistent-color: #d64545;
            --font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; font-weight: 300; }
        .panel { background-color: rgba(255,255,255,0.03); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }
        .history-selector { display: flex; flex-direction: column; gap: 10px; }
        .history-selector label { font-family: var(--monospace-family); }
        .viz-item { background-color: #000; border-radius: 8px; padding: 15px; position: relative; min-height: 500px; }
        .viz-item svg { width: 100%; height: 100%; }
        .consistency-panel { text-align: center; padding: 20px; border-radius: 8px; margin-top: 20px; font-size: 2em; font-weight: bold; }
        .consistent { background-color: var(--consistent-color); color: #fff; }
        .inconsistent { background-color: var(--inconsistent-color); color: #fff; }
        button { background-color: var(--highlight-color); color: #000; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1>Deep Simulation: Decoherent Histories</h1>
            <p>Exploring the consistency of classical narratives in a quantum universe.</p>
        </header>

        <div class="main-layout">
            <div class="controls-column">
                <div class="panel">
                    <h3>Select Histories to Test</h3>
                    <p>Select a set of possible histories. Are they consistent enough to form a classical reality?</p>
                    <div class="history-selector" id="history-selector"></div>
                    <button id="check-consistency-btn" style="margin-top: 20px;">Check for Consistency</button>
                </div>
                 <div class="panel">
                    <h3>Result</h3>
                    <div id="consistency-result" class="consistency-panel">Awaiting Test...</div>
                    <p id="consistency-explanation" style="margin-top: 10px;"></p>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                    <div class="viz-item">
                        <svg id="main-viz-svg"></svg>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: { numQubits: 3 },
        state: {
            allHistories: [],
            selectedHistories: new Set(),
        },
        elements: {},

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.generateAllHistories();
            this.populateSelector();
            this.drawTree();
        },

        cacheDOMElements() {
            this.elements = {
                selector: document.getElementById('history-selector'),
                checkBtn: document.getElementById('check-consistency-btn'),
                resultPanel: document.getElementById('consistency-result'),
                explanation: document.getElementById('consistency-explanation'),
                mainSvg: document.getElementById('main-viz-svg'),
            };
        },

        setupUIListeners() {
            this.elements.checkBtn.addEventListener('click', () => this.checkConsistency());
        },

        generateAllHistories() {
            this.state.allHistories = [];
            const numOutcomes = 2**this.config.numQubits;
            for(let i=0; i<numOutcomes; i++) {
                const binary = i.toString(2).padStart(this.config.numQubits, '0');
                const history = binary.split('').map(b => b === '0' ? '↓' : '↑');
                this.state.allHistories.push(history);
            }
        },

        populateSelector() {
            const container = this.elements.selector;
            container.innerHTML = '';
            this.state.allHistories.forEach((history, i) => {
                const label = document.createElement('label');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = i;
                checkbox.onchange = () => this.toggleHistory(i);
                label.appendChild(checkbox);
                label.append(` History ${i}: [${history.join(', ')}]`);
                container.appendChild(label);
            });
        },

        toggleHistory(index) {
            if(this.state.selectedHistories.has(index)) {
                this.state.selectedHistories.delete(index);
            } else {
                this.state.selectedHistories.add(index);
            }
            this.drawTree();
        },

        // Simplified consistency check. A set is inconsistent if it's not the complete set of outcomes
        // for a given measurement. E.g., asking "was it UP?" without allowing "was it DOWN?" is inconsistent.
        checkConsistency() {
            const { selectedHistories, allHistories } = this.state;
            let isConsistent = true;
            let explanation = "";

            if (selectedHistories.size === 0) {
                isConsistent = true;
                explanation = "An empty set is trivially consistent.";
            } else if (selectedHistories.size === allHistories.length) {
                isConsistent = true;
                explanation = "The set of all possible histories is a consistent family.";
            } else {
                // Check if the selected set forms a "coarse-grained" history.
                // This is a simplification. A real check is much more complex.
                // We'll say a set is inconsistent if it's a partial list of outcomes at any step.
                const firstHistory = allHistories[Array.from(selectedHistories)[0]];
                const prefix = firstHistory.slice(0, -1).join('');
                let siblingCount = 0;
                let totalSiblings = 0;
                allHistories.forEach((h, i) => {
                    if (h.slice(0, -1).join('') === prefix) {
                        totalSiblings++;
                        if (selectedHistories.has(i)) {
                            siblingCount++;
                        }
                    }
                });

                if (siblingCount > 0 && siblingCount < totalSiblings) {
                    isConsistent = false;
                    explanation = `INCONSISTENT: The selected histories form an incomplete set. For the prefix [${firstHistory.slice(0,-1).join(', ')}], you have selected ${siblingCount} of ${totalSiblings} possible outcomes. To be consistent, a family of histories must include all outcomes of a measurement or none at all. This set interferes with its unselected sibling histories.`;
                } else {
                    isConsistent = true; // Simplified check passes
                    explanation = "CONSISTENT: The selected histories form a valid coarse-grained set. They do not interfere with each other, and probabilities can be assigned.";
                }
            }

            const resultPanel = this.elements.resultPanel;
            resultPanel.textContent = isConsistent ? 'CONSISTENT' : 'INCONSISTENT';
            resultPanel.className = 'consistency-panel ' + (isConsistent ? 'consistent' : 'inconsistent');
            this.elements.explanation.textContent = explanation;
        },

        drawTree() { /* ... Similar to MWI branching sim ... */ },
        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>The Decoherent Histories approach to quantum mechanics, developed by Griffiths, Omnès, Gell-Mann, and Hartle, is a formal framework for describing how classical, probabilistic reasoning can emerge from underlying quantum laws. It generalizes the Many-Worlds interpretation by defining a "universe" or "reality" not as a single state, but as an entire *history*—a sequence of events over time. This simulation allows you to explore the central concept of this framework: the consistency condition. You can select different sets of possible histories for a simple quantum system and test whether they are "consistent." A consistent set is one whose histories do not interfere with each other, allowing one to treat them like classical alternatives and assign them probabilities. Inconsistent sets represent fundamentally quantum questions that have no classical answer.</p>

                <h2>Core Theory</h2>
                <p>The framework begins by defining a "history" as a sequence of projection operators P at different times (e.g., "the particle was in region A at t₁, AND in region B at t₂"). A set of possible histories {H₁, H₂, ...} is called a "family." The central object is the <b>decoherence functional</b>, D(Hₐ, Hᵦ), which measures the quantum interference between two histories, Hₐ and Hᵦ, in the family. A family of histories is said to be <b>consistent</b> (or decoherent) if the interference between any two distinct histories in the set is zero: D(Hₐ, Hᵦ) ≈ 0 for all a ≠ b.</p>
                <p>Only for consistent families can one assign classical probabilities. For an inconsistent family, it is meaningless to ask "what is the probability of history Hₐ OR history Hᵦ?" because the alternatives interfere with each other. This formalism elegantly resolves many quantum paradoxes. For example, in a double-slit experiment, the family of histories {"particle went through left slit", "particle went through right slit"} is inconsistent if no measurement is made, because the two paths interfere. It is physically meaningless to ask which slit it "really" went through. However, if a detector is placed at the slits, the interaction with the detector entangles the particle's path, and the family {"particle went through left slit AND was detected", "particle went through right slit AND was detected"} becomes a consistent set, allowing for classical reasoning.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. How does this relate to the Many-Worlds Interpretation?</strong>
                    <p>Decoherent Histories can be seen as a more mathematically rigorous and generalized version of MWI. In MWI, the universe "branches" into worlds corresponding to the outcomes of a measurement. In Decoherent Histories, the universe is a single quantum system whose evolution can be described by many different, equally valid, consistent sets of histories. A "world" in MWI corresponds to a single, maximally-detailed history within one of these consistent families. The framework emphasizes that the "splitting" is not a fundamental process, but rather a property of which questions we can consistently ask about the universal wave function. It focuses on identifying which classical narratives are valid descriptions of the underlying quantum reality.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on decoherent histories ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    document.addEventListener('DOMContentLoaded', () => SimApp.init());
    </script>
</body>
</html>
