<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Quantum Potential</title>
    <style>
        /* Using the abstract theme */
        :root {
            --bg-color: #111; --primary-color: #eee; --secondary-color: #444;
            --accent-color: #8a2be2; --highlight-color: #00ddff;
            --font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; font-weight: 300; }
        .panel { background-color: rgba(255,255,255,0.03); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; }
        .viz-item { background-color: #000; border-radius: 8px; position: relative; min-height: 400px; }
        .viz-item canvas { width: 100%; height: 100%; }
        .viz-title { text-align: center; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1>Deep Simulation: Bohm's Quantum Potential</h1>
            <p>Visualizing the hidden potential that guides quantum particles in Pilot-Wave theory.</p>
        </header>

        <div class="main-layout">
            <div class="controls-metrics-column">
                <div class="panel">
                    <h3>Double-Slit Controls</h3>
                    <div class="control-item" style="margin-bottom:15px;">
                        <label>Slit Separation: <span id="separation-value">80</span></label>
                        <input type="range" id="slit-separation" min="20" max="150" step="5" value="80">
                    </div>
                    <div class="control-item" style="margin-bottom:15px;">
                        <label>Wave Number (k): <span id="wavenum-value">0.3</span></label>
                        <input type="range" id="wavenum" min="0.1" max="1.0" step="0.05" value="0.3">
                    </div>
                    <button id="recalculate-btn">Recalculate Fields</button>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                    <div class="comparison-grid">
                        <div class="viz-item">
                            <div class="viz-title">Wave Intensity |ψ|²</div>
                            <canvas id="intensity-canvas"></canvas>
                        </div>
                        <div class="viz-item">
                            <div class="viz-title">Quantum Potential Q(x,y)</div>
                            <canvas id="potential-canvas"></canvas>
                        </div>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: { slitSeparation: 80, waveNumber: 0.3, gridSize: 128 },
        state: { R: null, Q: null }, // Amplitude R and Quantum Potential Q
        elements: {}, ctx: {},

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.recalculate();
        },

        cacheDOMElements() { /* ... */ },
        setupUIListeners() { /* ... */ },

        recalculate() {
            const size = this.config.gridSize;
            this.state.R = new Float32Array(size * size);
            this.state.Q = new Float32Array(size * size);

            const wave = new Float32Array(size * size * 2); // complex wave
            const slit_x = size * 0.2;
            const s1_y = size/2 - this.config.slitSeparation/2;
            const s2_y = size/2 + this.config.slitSeparation/2;

            // Calculate complex wave function and amplitude R
            for(let y=0; y<size; y++) {
                for(let x=0; x<size; x++) {
                    const idx = y * size + x;
                    const d1 = Math.sqrt((x-slit_x)**2 + (y-s1_y)**2);
                    const d2 = Math.sqrt((x-slit_x)**2 + (y-s2_y)**2);
                    const k = this.config.waveNumber;
                    wave[idx*2] = Math.cos(k*d1) + Math.cos(k*d2); // Real
                    wave[idx*2+1] = Math.sin(k*d1) + Math.sin(k*d2); // Imag
                    this.state.R[idx] = Math.sqrt(wave[idx*2]**2 + wave[idx*2+1]**2);
                }
            }

            // Calculate Quantum Potential Q = -∇²R / R
            for(let y=1; y<size-1; y++) {
                for(let x=1; x<size-1; x++) {
                    const idx = y * size + x;
                    const laplacian_R = this.state.R[idx-1] + this.state.R[idx+1] + this.state.R[idx-size] + this.state.R[idx+size] - 4*this.state.R[idx];
                    if (this.state.R[idx] > 1e-6) {
                        this.state.Q[idx] = -laplacian_R / this.state.R[idx];
                    } else {
                        this.state.Q[idx] = 0;
                    }
                }
            }
            this.draw();
        },

        draw() {
            this.drawField(this.ctx.intensity, this.state.R, false);
            this.drawField(this.ctx.potential, this.state.Q, true);
        },

        drawField(ctx, data, isPotential) { /* ... canvas drawing logic for heatmaps ... */ },
        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>In the de Broglie-Bohm pilot-wave theory, the "weirdness" of quantum mechanics is encoded in a hidden field called the <b>Quantum Potential</b>, Q. While the pilot wave ψ guides the particle, the quantum potential is what exerts the mysterious "quantum force" that creates non-classical motion. This simulation provides a technical look at this crucial object. For a double-slit setup, it visualizes both the standard probability density |ψ|² (the interference pattern) and the underlying Quantum Potential Q that produces it. You will see that Q is a highly complex, information-rich landscape whose peaks and valleys create "channels" that deterministically guide particles into the interference fringes, forbidding them from entering the dark areas.</p>

                <h2>Core Theory</h2>
                <p>The standard Schrödinger equation can be rewritten in a way that makes it look like the classical Hamilton-Jacobi equation, but with an extra term. This extra term is the Quantum Potential, Q. It is formally defined as:</p>
                <p><b>Q = - (ħ²/2m) * (∇²R / R)</b></p>
                <p>Where R = |ψ| is the amplitude of the wave function. The classical force on the particle is then F = -∇(V + Q), where V is any classical potential. The particle behaves just like a classical particle, but subject to this additional, strange potential. Unlike classical potentials, Q is <b>non-local</b>. Its value at a point x depends on the shape of the entire wave function R everywhere in space. This is how information about the whole experimental setup (e.g., whether one or two slits are open) is transmitted to the particle. In the double-slit experiment, Q is large and complex in the region behind the slits, creating a landscape of "hills" and "valleys" that push the particles into the observed interference pattern. Far away, where the wave is simple, Q goes to zero and the particle behaves classically.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. Is the Quantum Potential a real, physical field?</strong>
                    <p>This is a deep ontological question within the interpretation itself. In David Bohm's original formulation, yes, the quantum potential was considered a real, physical field, just as real as an electric field. It was seen as an active information field that informed the particle of its environment. Other proponents of the theory are more agnostic, viewing it simply as a mathematically useful component of the theory that describes the particle's motion, without necessarily giving it the status of a fundamental physical field. Regardless of its reality, its mathematical form is what gives rise to all the non-classical behaviors of the particle.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on the quantum potential ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    document.addEventListener('DOMContentLoaded', () => SimApp.init());
    </script>
</body>
</html>
