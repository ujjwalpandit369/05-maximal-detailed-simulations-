<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Gravity in Large Extra Dimensions (ADD Model)</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .chart-container { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Gravity at Short Distances in the ADD Model</h1></header>
        <div class="main-layout">
            <div class="chart-container">
                <h2>Force vs. Distance (Log-Log Plot)</h2>
                <div id="main-chart"></div>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <label>Size of Extra Dimensions (R): <span id="r-value">0.1</span> mm</label>
                <input type="range" id="r-slider" min="-3" max="1" step="0.1" value="-1">
                <label>Number of Extra Dimensions (n)</label>
                <select id="n-select"><option value="1">1</option><option value="2" selected>2</option><option value="6">6</option></select>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full ADD model gravity script.
    // The final version will contain dynamic SVG charts comparing the
    // standard 1/r^2 force law with the ADD model.

    const DOM = {
        chart: document.getElementById('main-chart'),
        rSlider: document.getElementById('r-slider'),
        rValue: document.getElementById('r-value'),
        nSelect: document.getElementById('n-select'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = { R: 0.1, n: 2 };

    function calculateForces() {
        const r_values = Array.from({length: 200}, (_, i) => Math.pow(10, -6 + i * 0.04)); // Log scale

        const standard_force = r_values.map(r => 1 / (r*r));

        // ADD model force law
        const add_force = r_values.map(r => {
            if (r > state.R) return 1 / (r*r);
            else return 1 / (r*r) * Math.pow(state.R / r, state.n);
        });

        return { r_values, standard_force, add_force };
    }

    function drawChart() {
        const data = calculateForces();
        // Placeholder for dynamic SVG chart drawing logic
        DOM.chart.innerHTML = `<p>Chart showing standard gravity vs. ADD gravity with R=${state.R.toExponential(1)} mm and n=${state.n}.</p>`;
    }

    function setup() {
        function update() {
            state.R = Math.pow(10, parseFloat(DOM.rSlider.value));
            state.n = parseInt(DOM.nSelect.value);
            DOM.rValue.textContent = `${state.R.toExponential(1)} mm`;
            drawChart();
        }

        DOM.rSlider.addEventListener('input', update);
        DOM.nSelect.addEventListener('change', update);

        DOM.expositionContent.innerHTML = `<h1>Gravity's Strength at Small Scales</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        update();
    }

    setup();
});
</script>
</body>
</html>
