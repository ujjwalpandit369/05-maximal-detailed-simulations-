<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Level III Multiverse - Many-Worlds Branching</title>
    <style>
        /* A new, more abstract/minimalist theme */
        :root {
            --bg-color: #111;
            --primary-color: #eee;
            --secondary-color: #444;
            --accent-color: #8a2be2; /* Blue-violet for a quantum feel */
            --highlight-color: #00ddff;
            --font-family: 'Inter', 'Segoe UI', sans-serif;
            --monospace-family: 'Fira Code', 'Courier New', monospace;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; font-weight: 300; }
        .header { text-align: center; margin-bottom: 30px; }
        .subtitle { font-style: italic; color: var(--primary-color); opacity: 0.8; }
        .main-layout { display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; } }
        .panel { background-color: rgba(255,255,255,0.03); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .control-item { display: flex; flex-direction: column; }
        .control-item label { color: var(--highlight-color); margin-bottom: 8px; }
        .viz-item { background-color: #000; border-radius: 8px; padding: 15px; position: relative; min-height: 600px; }
        .viz-item svg { width: 100%; height: 100%; }
        .viz-title { text-align: center; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .metric-item { background-color: var(--secondary-color); color: var(--bg-color); padding: 10px; border-radius: 5px; text-align: center; }
        .metric-item .label { font-weight: bold; font-size: 0.9em; opacity: 0.8; }
        .metric-item .value { font-family: var(--monospace-family); font-size: 1.8em; color: var(--accent-color); }
        .text-content { padding: 20px; background-color: rgba(0,0,0,0.1); border-radius: 8px; }
        button { background-color: var(--accent-color); color: #fff; border: 1px solid var(--accent-color); padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: var(--highlight-color); color: #000; border-color: var(--highlight-color); }
        #state-inspector { background-color: #000; border: 1px solid var(--highlight-color); padding: 15px; margin-top: 15px; min-height: 100px; font-family: var(--monospace-family); color: var(--highlight-color); }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Deep Simulation: The Many-Worlds Interpretation</h1>
            <p class="subtitle">Visualizing the branching of the universal wave function at each quantum measurement.</p>
        </header>

        <div class="main-layout">
            <div class="controls-metrics-column">
                <div class="panel">
                    <h3>Controls</h3>
                    <div class="controls-grid">
                        <div class="control-item">
                            <label for="num-qubits">Number of Qubits</label>
                            <input type="range" id="num-qubits" min="1" max="5" step="1" value="3">
                        </div>
                        <div class="control-item">
                            <button id="step-btn">Perform Measurement Step</button>
                        </div>
                         <div class="control-item">
                            <button id="reset-btn">Reset Simulation</button>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3>Metrics</h3>
                    <div class="metrics-grid" id="metrics-container"></div>
                </div>

                <div class="panel">
                    <h3>State Inspector</h3>
                    <p style="font-size:0.9em; opacity: 0.7;">Click on a universe (node) in the diagram to inspect its state.</p>
                    <div id="state-inspector">
                        <p>No universe selected.</p>
                    </div>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                    <div class="viz-item">
                        <div class="viz-title">Multiverse Branching Structure</div>
                        <svg id="main-viz-svg"></svg>
                    </div>
                </div>

                <div class="text-content" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            numQubits: 3,
        },
        state: {
            step: 0,
            worlds: [], // The tree structure
            nextId: 0,
        },
        elements: {},

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.resetSimulation();
        },

        cacheDOMElements() {
            this.elements = {
                stepBtn: document.getElementById('step-btn'),
                resetBtn: document.getElementById('reset-btn'),
                numQubitsSlider: document.getElementById('num-qubits'),
                mainSvg: document.getElementById('main-viz-svg'),
                metricsContainer: document.getElementById('metrics-container'),
                stateInspector: document.getElementById('state-inspector'),
            };
        },

        setupUIListeners() {
            this.elements.stepBtn.addEventListener('click', () => this.performStep());
            this.elements.resetBtn.addEventListener('click', () => this.resetSimulation());
            this.elements.numQubitsSlider.addEventListener('input', e => { this.config.numQubits = parseInt(e.target.value); this.resetSimulation(); });
        },

        resetSimulation() {
            this.state.step = 0;
            this.state.nextId = 0;
            const initialState = Array(this.config.numQubits).fill('?'); // '?' for superposition
            this.state.worlds = [{
                id: this.state.nextId++,
                state: initialState,
                amplitude: 1.0,
                parent: null,
                children: [],
                depth: 0,
            }];
            this.update();
        },

        performStep() {
            if (this.state.step >= this.config.numQubits) {
                console.log("All qubits measured.");
                return;
            }

            const leaves = this.findLeaves();
            const qubitToMeasure = this.state.step;

            leaves.forEach(leaf => {
                // Split the world/leaf
                const stateUp = [...leaf.state];
                stateUp[qubitToMeasure] = '↑'; // UP
                const childUp = {
                    id: this.state.nextId++,
                    state: stateUp,
                    amplitude: leaf.amplitude * 0.5, // Assuming equal superposition
                    parent: leaf.id,
                    children: [],
                    depth: leaf.depth + 1,
                };

                const stateDown = [...leaf.state];
                stateDown[qubitToMeasure] = '↓'; // DOWN
                const childDown = {
                    id: this.state.nextId++,
                    state: stateDown,
                    amplitude: leaf.amplitude * 0.5,
                    parent: leaf.id,
                    children: [],
                    depth: leaf.depth + 1,
                };

                leaf.children.push(childUp, childDown);
                this.state.worlds.push(childUp, childDown);
            });

            this.state.step++;
            this.update();
        },

        findLeaves() {
            return this.state.worlds.filter(w => w.children.length === 0);
        },

        update() {
            this.drawTree();
            this.updateMetrics();
        },

        drawTree() {
            const svg = this.elements.mainSvg;
            svg.innerHTML = '';
            const { width, height } = svg.getBoundingClientRect();

            const nodes = this.state.worlds;
            const links = [];
            nodes.forEach(node => {
                node.children.forEach(child => {
                    links.push({ source: node, target: child });
                });
            });

            // Simple tree layout
            const depthCounts = {};
            nodes.forEach(n => {
                if(!depthCounts[n.depth]) depthCounts[n.depth] = 0;
                n.x = (n.depth + 0.5) * (width / (this.config.numQubits + 1));
                n.y = (depthCounts[n.depth] + 1) / (2**n.depth + 1) * height;
                depthCounts[n.depth]++;
            });

            links.forEach(link => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', link.source.x);
                line.setAttribute('y1', link.source.y);
                line.setAttribute('x2', link.target.x);
                line.setAttribute('y2', link.target.y);
                line.setAttribute('stroke', '#444');
                line.setAttribute('stroke-width', 1);
                svg.appendChild(line);
            });

            nodes.forEach(node => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', node.x);
                circle.setAttribute('cy', node.y);
                circle.setAttribute('r', 5 + 15 * Math.sqrt(node.amplitude));
                circle.setAttribute('fill', 'var(--accent-color)');
                circle.setAttribute('stroke', 'var(--highlight-color)');
                circle.setAttribute('stroke-width', 2);
                circle.style.cursor = 'pointer';
                circle.addEventListener('click', () => this.inspectState(node));
                svg.appendChild(circle);
            });
        },

        inspectState(node) {
            const inspector = this.elements.stateInspector;
            const stateString = node.state.map((s,i) => `Qubit ${i+1}: ${s}`).join('<br>');
            inspector.innerHTML = `<strong>Universe ID: ${node.id}</strong><br>Probability: ${(node.amplitude * 100).toFixed(2)}%<br>${stateString}`;
        },

        updateMetrics() {
            const metrics = {
                worlds: { label: 'Number of Worlds', value: this.findLeaves().length },
                steps: { label: 'Measurement Steps', value: this.state.step },
            };
            const container = this.elements.metricsContainer;
            container.innerHTML = '';
            for(const [key, metric] of Object.entries(metrics)) {
                const el = document.createElement('div');
                el.classList.add('metric-item');
                el.innerHTML = `<div class="label">${metric.label}</div><div class="value">${metric.value}</div>`;
                container.appendChild(el);
            }
        },

        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>The Many-Worlds Interpretation (MWI) of quantum mechanics is a radical and elegant solution to the infamous "measurement problem." It posits that the universal wave function never "collapses." Instead, at every quantum measurement, the universe itself branches into multiple, parallel universes—one for each possible outcome. All branches are equally real. This simulation provides a direct visualization of this process. Starting with a simple quantum system in a superposition of states, each "measurement step" you perform will cause the universe to branch, creating a dizzying, tree-like multiverse where every quantum possibility is realized in some world.</p>

                <h2>Core Theory</h2>
                <p>In standard quantum mechanics, a system is described by a wave function, which evolves deterministically according to the Schrödinger equation. The problem arises during measurement: the wave function appears to instantaneously and randomly "collapse" to a single outcome. The MWI, proposed by Hugh Everett III, rejects this collapse postulate. It claims the wave function of the entire universe, containing all systems and observers, is the only reality. When an observer measures a quantum system, they become entangled with it. This entanglement splits the universal wave function into non-communicating branches. From the perspective of an observer within one branch, it appears as if the wave function has collapsed to a single result. But from a "God's-eye view," all possible outcomes have occurred in different, equally real worlds.</p>
                <p>This simulation models this branching. We begin with a system of N qubits, all in a superposition of 'Up' (↑) and 'Down' (↓). This is our root universe. When we "measure" the first qubit, the universe splits into two branches. In one, the qubit is Up; in the other, it is Down. The other N-1 qubits remain in superposition within each branch. When we measure the second qubit, both of these branches split again, resulting in four universes. This process continues, with the number of worlds growing as 2<sup>k</sup>, where k is the number of measurements. The simulation visualizes this branching as a tree, where each node is a universe and each link is a measurement event.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. Is this scientifically testable?</strong>
                    <p>This is the central debate. The MWI is notoriously difficult to test directly, as the different branches of the wave function are, by design, decoherent and non-communicating. You cannot "jump" from one world to another. However, proponents argue that MWI is more parsimonious than collapse theories because it doesn't require adding a new, non-linear, and poorly understood "collapse" mechanism to the Schrödinger equation. The testability of MWI is therefore indirect: it would be supported if quantum mechanics continues to prove correct in ever-larger systems, and if no evidence for a specific collapse mechanism is ever found. Some speculative experiments, like "quantum suicide," have been proposed but are not considered feasible or ethical.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on MWI ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };

    document.addEventListener('DOMContentLoaded', () => SimApp.init());
    </script>
</body>
</html>
