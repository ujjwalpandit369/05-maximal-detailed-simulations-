<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Level IV Multiverse - A Fractal Universe</title>
    <style>
        /* Using the same abstract theme */
        :root {
            --bg-color: #111; --primary-color: #eee; --secondary-color: #444;
            --accent-color: #f0a; --highlight-color: #0fa;
            --font-family: 'Inter', 'Segoe UI', sans-serif;
            --monospace-family: 'Fira Code', 'Courier New', monospace;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; font-weight: 300; }
        .header { text-align: center; margin-bottom: 30px; }
        .subtitle { font-style: italic; color: var(--primary-color); opacity: 0.8; }
        .main-layout { display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; } }
        .panel { background-color: rgba(255,255,255,0.03); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .control-item { display: flex; flex-direction: column; }
        .control-item label { color: var(--highlight-color); margin-bottom: 8px; }
        .viz-item { background-color: #000; border-radius: 8px; padding: 0; position: relative; min-height: 600px; cursor: crosshair; }
        .viz-item canvas { width: 100%; height: 100%; }
        .viz-title { text-align: center; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; padding: 10px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr; gap: 15px; text-align: center; font-size: 0.9em; }
        .text-content { padding: 20px; background-color: rgba(0,0,0,0.1); border-radius: 8px; }
        button { background-color: var(--accent-color); color: #fff; border: 1px solid var(--accent-color); padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Deep Simulation: Exploring a Fractal Reality</h1>
            <p class="subtitle">Navigating the infinite complexity of a mathematical structure, presented as a complete universe.</p>
        </header>

        <div class="main-layout">
            <div class="controls-metrics-column">
                <div class="panel">
                    <h3>Universe Explorer Controls</h3>
                    <div class="controls-grid">
                        <div class="control-item">
                            <label>Max Iterations (Physics Depth): <span id="iter-value">100</span></label>
                            <input type="range" id="max-iterations" min="50" max="1000" step="10" value="100">
                        </div>
                        <div class="control-item">
                            <label>Coloring Algorithm</label>
                            <select id="color-scheme">
                                <option value="smooth" selected>Smooth Gradient</option>
                                <option value="zebra">Zebra Stripes</option>
                                <option value="galaxy">Galaxy</option>
                            </select>
                        </div>
                        <button id="reset-view-btn">Reset View</button>
                    </div>
                </div>

                <div class="panel">
                    <h3>Probe Readings</h3>
                    <div class="metrics-grid" id="metrics-container">
                        <p>Hover over the universe to probe its properties.</p>
                    </div>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                    <div class="viz-item">
                        <div class="viz-title">The Mandelbrot Set</div>
                        <canvas id="main-viz-canvas"></canvas>
                    </div>
                </div>
                <div class="text-content" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    // NOTE: A Web Worker would be ideal for the fractal calculation to prevent UI freezing.
    // For simplicity in this single-file format, we'll do it on the main thread but with a
    // loading indicator and awareness that it can be slow.
    const SimApp = {
        config: {
            maxIter: 100,
            colorScheme: 'smooth',
            // View parameters
            cx: -0.7, cy: 0, scale: 3.0,
        },
        elements: {},
        ctx: null,
        worker: null,

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.render();
        },

        cacheDOMElements() {
            this.elements = {
                maxIterSlider: document.getElementById('max-iterations'),
                iterValue: document.getElementById('iter-value'),
                colorSchemeSelect: document.getElementById('color-scheme'),
                resetViewBtn: document.getElementById('reset-view-btn'),
                mainCanvas: document.getElementById('main-viz-canvas'),
                metricsContainer: document.getElementById('metrics-container'),
            };
            this.ctx = this.elements.mainCanvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.maxIterSlider.addEventListener('change', e => { this.config.maxIter = parseInt(e.target.value); this.render(); });
            this.elements.maxIterSlider.addEventListener('input', e => { this.elements.iterValue.textContent = e.target.value; });
            this.elements.colorSchemeSelect.addEventListener('change', e => { this.config.colorScheme = e.target.value; this.render(); });
            this.elements.resetViewBtn.addEventListener('click', () => { this.config.cx = -0.7; this.config.cy = 0; this.config.scale = 3.0; this.render(); });

            this.elements.mainCanvas.addEventListener('mousedown', e => {
                const canvas = this.elements.mainCanvas;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const w = canvas.width;
                const h = canvas.height;

                const new_cx = this.config.cx + (x - w/2) / w * this.config.scale;
                const new_cy = this.config.cy + (y - h/2) / h * this.config.scale;
                const new_scale = this.config.scale * 0.5;

                this.config.cx = new_cx;
                this.config.cy = new_cy;
                this.config.scale = new_scale;
                this.render();
            });
        },

        render() {
            const canvas = this.elements.mainCanvas;
            const w = canvas.width = canvas.clientWidth;
            const h = canvas.height = canvas.clientHeight;
            const ctx = this.ctx;

            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,w,h);
            ctx.font = "20px " + getComputedStyle(document.body).getPropertyValue('--font-family');
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText("Rendering...", w/2, h/2);

            // Defer the heavy calculation to allow the UI to update
            setTimeout(() => {
                const imageData = ctx.createImageData(w, h);
                const data = imageData.data;
                const { maxIter, cx, cy, scale } = this.config;

                for(let py=0; py<h; py++) {
                    for(let px=0; px<w; px++) {
                        const x0 = cx + scale * (px / w - 0.5);
                        const y0 = cy + scale * (py / h - 0.5) * (h/w);

                        let x=0, y=0, iter=0;
                        while(x*x + y*y <= 4 && iter < maxIter) {
                            const xtemp = x*x - y*y + x0;
                            y = 2*x*y + y0;
                            x = xtemp;
                            iter++;
                        }

                        const idx = (py * w + px) * 4;
                        const color = this.getColor(iter, maxIter, x, y);
                        data[idx] = color[0];
                        data[idx+1] = color[1];
                        data[idx+2] = color[2];
                        data[idx+3] = 255;
                    }
                }
                ctx.putImageData(imageData, 0, 0);
            }, 50);
        },

        getColor(iter, maxIter, x, y) {
            if (iter === maxIter) return [0,0,0]; // Inside the set

            switch(this.config.colorScheme) {
                case 'zebra':
                    return iter % 2 === 0 ? [255,255,255] : [0,0,0];
                case 'galaxy': {
                    const v = Math.log(iter) / Math.log(maxIter);
                    return [10 + v*200, 20 + v*100, 50 + v*200];
                }
                case 'smooth':
                default: {
                    const log_zn = Math.log(x*x + y*y) / 2;
                    const nu = Math.log(log_zn / Math.log(2)) / Math.log(2);
                    const i = iter + 1 - nu;
                    const c1 = [255, 0, 170]; // Magenta
                    const c2 = [0, 221, 255]; // Cyan
                    const t = 0.5 + 0.5 * Math.cos(3.0 + i*0.15);
                    return [
                        c1[0] * t + c2[0] * (1-t),
                        c1[1] * t + c2[1] * (1-t),
                        c1[2] * t + c2[2] * (1-t),
                    ];
                }
            }
        },

        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>Max Tegmark's Level IV multiverse, or the Mathematical Universe Hypothesis (MUH), is the most audacious and philosophically profound of the multiverse theories. It proposes that our physical reality is not just *described by* mathematics, but that it *is* a mathematical structure. Furthermore, it posits that *every* self-consistent mathematical structure corresponds to its own physically real universe. This simulation invites you to explore this idea by treating a famous mathematical object—the Mandelbrot set—as a complete toy universe. The simple equation z → z² + c represents the entirety of this universe's "physical law." By zooming in, you can explore the infinite, non-repeating complexity and beauty that emerges from this simple rule, providing an intuition for how a universe of immense richness could be fundamentally mathematical.</p>

                <h2>Core Theory</h2>
                <p>The Mathematical Universe Hypothesis (MUH) equates physical existence with mathematical existence. A mathematical structure is a set of abstract entities with relations between them. The Mandelbrot set is one such structure. Its entities are the points 'c' in the complex plane. The relation is the behavior of the sequence zₙ₊₁ = zₙ² + c, starting with z₀ = 0. If the sequence remains bounded, the point 'c' is in the set; otherwise, it is not. This simple, deterministic rule generates a structure of infinite complexity.</p>
                <p>In this simulation, we treat this structure as a universe. An "observer" inside this reality wouldn't see the equations; they would experience the structure's properties as their physics. The coordinates (c_real, c_imag) are their "spacetime." The result of the iteration (whether the point is inside or outside the set, and how quickly it escapes) is the "physical property" at that location. The "Max Iterations" control is analogous to the precision of a physical measurement, or the "energy scale" of a probe—deeper probes reveal finer details. The infinite detail you find by zooming is a key feature: a simple law can contain endless novelty, just as the simple laws of our Standard Model give rise to all the complexity of our world.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. Is this just a pretty picture, or could it really be a universe?</strong>
                    <p>This is the core of the hypothesis. From our "outside" perspective, it's a mathematical visualization. But the MUH asks you to consider the "internal" perspective. If a self-aware substructure (an "observer") were to exist within the Mandelbrot set, its perceptions would be determined by the mathematical relations of the set. The patterns, spirals, and filaments would be its "galaxies" and "nebulae." The iterative rule would be its unbreakable law of physics. To this observer, their reality would feel just as physical and real as ours feels to us. The MUH proposes that there is no fundamental difference between the "physicality" of our universe and the "mathematical existence" of the Mandelbtrote set; they are both just consistent structures.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on the MUH ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };

    SimApp.init();
    </script>
</body>
</html>
