<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Scalar Field Evolution in LQC</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --accent-color: #00ffaa; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 350px 1fr; grid-template-areas: "header header" "controls main" "exposition exposition" "qa qa" "footer footer"; gap: 20px; }
        @media (max-width: 1200px) { .container { grid-template-columns: 1fr; grid-template-areas: "header" "controls" "main" "exposition" "qa" "footer"; } }
        header { grid-area: header; text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; }
        h1 { font-size: 2.5em; margin: 0; }
        main { grid-area: main; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-container { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        h2 { color: var(--header-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        aside { grid-area: controls; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; position: sticky; top: 20px; }
        .control-group { margin-bottom: 25px; }
        h3 { color: var(--secondary-color); }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 1em; width: 100%; margin-top: 10px;}
        .exposition, .qa-section { grid-area: exposition; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Scalar Field Evolution Through the Bounce</h1></header>
        <aside>
            <h2>Controls</h2>
            <div class="control-group">
                <label for="model-type">Model</label>
                <select id="model-type"><option value="lqc">LQC</option><option value="classical">Classical</option></select>
            </div>
            <div class="control-group">
                <label>Field Mass (m): <span id="mass-value">1.0</span></label>
                <input type="range" id="field-mass" min="0.1" max="5" step="0.1" value="1.0">
            </div>
            <button id="start-sim">Run Simulation</button>
        </aside>
        <main>
            <div class="chart-container"><h2>Scalar Field Phase Space (φ vs φ̇)</h2><div id="phase-space-chart"></div></div>
            <div class="chart-container"><h2>Energy Density Components</h2><div id="energy-chart"></div></div>
            <div class="chart-container" style="grid-column: 1 / 3;"><h2>Scale Factor a(t)</h2><div id="scale-factor-chart"></div></div>
        </main>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full LQC scalar field simulation script.
    // The final version will contain a numerical solver for the coupled
    // differential equations and dynamic SVG charts.

    const DOM = {
        phaseChart: document.getElementById('phase-space-chart'),
        energyChart: document.getElementById('energy-chart'),
        scaleChart: document.getElementById('scale-factor-chart'),
        runBtn: document.getElementById('start-sim'),
        modelSelect: document.getElementById('model-type'),
        massSlider: document.getElementById('field-mass'),
        massValue: document.getElementById('mass-value'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    function runSimulation() {
        const model = DOM.modelSelect.value;
        const mass = parseFloat(DOM.massSlider.value);

        // --- Physics & Initial Conditions ---
        const G = 1;
        const RHO_CRIT = 100;
        const dt = 0.01;
        let a = 10, a_dot = -0.1, phi = 1, phi_dot = 0, t = -20;

        const history = [];

        while (t < 20) {
            const V = 0.5 * mass * mass * phi * phi;
            const rho_phi = 0.5 * phi_dot * phi_dot + V;

            let H_sq;
            if (model === 'lqc') {
                H_sq = (8/3) * Math.PI * G * rho_phi * (1 - rho_phi / RHO_CRIT);
            } else {
                H_sq = (8/3) * Math.PI * G * rho_phi;
            }
            if (H_sq < 0) H_sq = 0; // Bounce point
            const H = (a_dot > 0 ? 1 : -1) * Math.sqrt(H_sq);

            const dV_dphi = mass * mass * phi;
            const phi_ddot = -3 * H * phi_dot - dV_dphi;

            phi_dot += phi_ddot * dt;
            phi += phi_dot * dt;
            a_dot = H * a;
            a += a_dot * dt;
            t += dt;

            if (a <= 0.01 && model === 'classical') {
                history.push({t, a: 0, phi, phi_dot, rho_phi});
                break; // Singularity
            }
            if (history.length > 4000) break; // Safety

            history.push({t, a, phi, phi_dot, rho_phi});
        }

        drawCharts(history);
    }

    function drawCharts(data) {
        // Placeholder for dynamic SVG chart drawing logic
        DOM.phaseChart.innerHTML = `<p>Chart will show φ vs φ̇.</p>`;
        DOM.energyChart.innerHTML = `<p>Chart will show energy components.</p>`;
        DOM.scaleChart.innerHTML = `<p>Chart will show a(t). Max ρ was ~${Math.max(...data.map(d=>d.rho_phi)).toFixed(1)}</p>`;
    }

    DOM.runBtn.addEventListener('click', runSimulation);
    DOM.massSlider.oninput = () => { DOM.massValue.textContent = DOM.massSlider.value; };

    DOM.expositionContent.innerHTML = "<h1>Scalar Fields at the Bounce</h1><p>...Full 5000+ word text...</p>";
    DOM.qaContent.innerHTML = "<h2>Questions & Answers</h2>" + "<div>...20+ Q&A items...</div>";

    runSimulation();
});
</script>
</body>
</html>
