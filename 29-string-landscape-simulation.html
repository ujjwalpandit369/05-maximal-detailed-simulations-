<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: The String Theory Landscape</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        canvas { width: 100%; height: 500px; display: block; background: #000; border-radius: 4px; cursor: move; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .info-panel { background: #111; padding: 15px; border-radius: 5px; min-height: 150px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>The String Theory Landscape</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Landscape of Possible Universes</h2>
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <button id="regen-btn">Generate New Landscape</button>
                <h3>Selected Universe</h3>
                <div class="info-panel" id="info-panel">Click on a valley (glowing dot) to see its properties.</div>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full String Landscape script.
    // The final version will contain a Diamond-Square algorithm for fractal
    // terrain, a "fake 3D" renderer, and valley-finding logic.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        regenBtn: document.getElementById('regen-btn'),
        infoPanel: document.getElementById('info-panel'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    const SIZE = 129; // Must be 2^n + 1
    let heightmap = new Float32Array(SIZE * SIZE);
    let valleys = [];

    function generateLandscape() {
        // Placeholder for Diamond-Square algorithm
        for(let i=0; i<heightmap.length; i++) heightmap[i] = Math.random();
        findValleys();
    }

    function findValleys() {
        // Placeholder for local minima finding
        valleys = [{x: 50, y: 60, z: 0.1, laws: { "Fine Structure": 0.007 }}];
    }

    function draw() {
        const { ctx, canvas } = DOM;
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // "Fake 3D" rendering of heightmap
        const cellW = canvas.width / SIZE;
        const cellH = canvas.height / SIZE;
        for (let i = 0; i < SIZE - 1; i++) {
            for (let j = 0; j < SIZE - 1; j++) {
                const h = heightmap[i*SIZE+j] * 255;
                ctx.fillStyle = `rgb(${h}, ${h}, ${h})`;
                ctx.fillRect(j*cellW, i*cellH, cellW, cellH);
            }
        }

        // Draw valley markers
        ctx.fillStyle = 'cyan';
        valleys.forEach(v => {
            ctx.beginPath();
            ctx.arc(v.x * cellW, v.y * cellH, 5, 0, 2*Math.PI);
            ctx.fill();
        });
    }

    function setup() {
        DOM.regenBtn.addEventListener('click', () => { generateLandscape(); draw(); });
        DOM.canvas.addEventListener('click', e => {
            // ... logic to find nearest valley and display info ...
        });

        DOM.expositionContent.innerHTML = `<h1>A Landscape of 10^500 Universes</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        generateLandscape();
        draw();
    }

    setup();
});
</script>
</body>
</html>
