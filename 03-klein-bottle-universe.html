<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Klein Bottle Universe</title>
    <style>
        /* Using the same geometric theme */
        :root {
            --bg-color: #2c3e50;
            --primary-color: #ecf0f1;
            --secondary-color: #34495e;
            --accent-color: #e67e22;
            --highlight-color: #f1c40f;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 1px solid var(--secondary-color); padding-bottom: 10px; font-weight: 400; }
        .panel { background-color: var(--secondary-color); border-radius: 8px; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 3fr; gap: 30px; }
        .viz-item { background-color: #000; border: 2px solid var(--accent-color); border-radius: 8px; position: relative; min-height: 600px; }
        .viz-item canvas { width: 100%; height: 100%; }
        button { background-color: var(--accent-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1>Deep Simulation: Navigating a Klein Bottle</h1>
            <p>Exploring a non-orientable universe with two different kinds of 'wrap-around' loops.</p>
        </header>

        <div class="main-layout">
            <div class="controls-column">
                <div class="panel">
                    <h3>Controls</h3>
                    <p>Use Arrow Keys to fly the ship.</p>
                    <button id="reset-btn" style="margin-top: 20px;">Reset</button>
                </div>
            </div>

            <div class="simulation-column">
                <div class="panel">
                    <div class="viz-item">
                        <canvas id="main-viz-canvas"></canvas>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: { shipSpeed: 2 },
        state: {
            ship: { x: 0, y: 0, angle: 0, flipped: false },
            keys: {},
        },
        elements: {},
        ctx: null,

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.resetSimulation();
            this.gameLoop();
        },

        resetSimulation() {
            const w = this.elements.mainCanvas.width;
            const h = this.elements.mainCanvas.height;
            this.state.ship = { x: w/2, y: h/2, angle: 0, flipped: false };
        },

        step() {
            const { ship, keys } = this.state;
            if(keys['ArrowUp']) {
                ship.x += Math.cos(ship.angle) * this.config.shipSpeed;
                ship.y += Math.sin(ship.angle) * this.config.shipSpeed;
            }
            if(keys['ArrowLeft']) ship.angle -= 0.05;
            if(keys['ArrowRight']) ship.angle += 0.05;

            // Klein Bottle boundary conditions
            const w = this.elements.mainCanvas.width;
            const h = this.elements.mainCanvas.height;
            // Left/Right edges are a simple torus wrap
            if(ship.x > w) ship.x = 0;
            if(ship.x < 0) ship.x = w;
            // Top/Bottom edges are a Mobius wrap with reflection
            if(ship.y > h) { ship.y = 0; ship.x = w - ship.x; ship.flipped = !ship.flipped; }
            if(ship.y < 0) { ship.y = h; ship.x = w - ship.x; ship.flipped = !ship.flipped; }
        },

        draw() {
            const ctx = this.ctx;
            const w = this.elements.mainCanvas.width = this.elements.mainCanvas.clientWidth;
            const h = this.elements.mainCanvas.height = this.elements.mainCanvas.clientHeight;
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,w,h);

            // Draw boundary indicators
            // ... (code to draw arrows on edges) ...

            // Draw ship
            const { ship } = this.state;
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            ctx.strokeStyle = 'var(--highlight-color)';
            ctx.lineWidth = 3;
            // ... (code to draw chiral ship) ...
            ctx.restore();
        },

        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>The Klein bottle is a fascinating mathematical object, a step up in complexity from the Möbius strip. Like the Möbius strip, it is a "non-orientable" surface, meaning it has no distinct inside or outside. This simulation visualizes a 2D universe with the topology of a Klein bottle by showing its "fundamental polygon"—a square whose edges are glued together in a specific way. You can fly a chiral ship around this universe to discover its two distinct types of loops. A horizontal journey will feel like being on a normal torus, and you will return with your orientation intact. A vertical journey, however, will take you across the "twisted" boundary, and you will return mirror-reversed, just like on a Möbius strip.</p>

                <h2>Core Theory</h2>
                <p>A Klein bottle is constructed from a square by identifying two pairs of opposite edges. One pair is glued together directly, like forming a cylinder. The other pair is glued together with a reverse in direction, like forming a Möbius strip. The boundary conditions in the simulation implement this:</p>
                <ul>
                    <li><b>Horizontal (Left/Right):</b> These edges are glued like a torus. When the ship flies off the right side, it reappears on the left at the same height. This loop preserves orientation.</li>
                    <li><b>Vertical (Top/Bottom):</b> These edges are glued with a twist. When the ship flies off the top edge, it reappears at the bottom, but its horizontal position is reflected (x becomes width - x). This loop reverses orientation.</li>
                </ul>
                <p>This unique combination means that while the surface is non-orientable as a whole (due to the Möbius-like vertical loop), it also contains orientation-preserving loops (the horizontal ones). This makes it different from both the torus (which is fully orientable) and the Möbius strip (whose only loop is orientation-reversing). Like the Möbius strip, a 3D representation of a Klein bottle must pass through itself, so it can only be truly visualized in four dimensions.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. What would a 3D Klein Bottle be like?</strong>
                    <p>A 3D Klein bottle, or a non-orientable 3-manifold, is difficult to visualize. Just as a 2D Klein bottle needs a 4th dimension to be embedded without self-intersection, a 3D one would need a 5th. However, we can describe its properties. A journey in a 3D Klein-bottle-like universe would mean that there are specific directions of travel which, upon completing a round trip, would result in you being mirror-reversed (e.g., your heart on the right, text appearing backwards). However, there would also be other directions of travel where you could make a round trip and return completely unchanged. The existence of such a topology for our own universe is not ruled out by current data, but it is considered a more exotic possibility than a simple 3-torus.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on the Klein Bottle ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
        // ... other functions ...
    };
    SimApp.init();
    </script>
</body>
</html>
