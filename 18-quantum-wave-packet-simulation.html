<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Quantum Wave Packet on a Torus</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr 350px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; text-align: center; }
        canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 4px; cursor: crosshair; image-rendering: pixelated; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 4; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Quantum Wave Packet on a Torus</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Position Space |ψ(x,y)|²</h2>
                <canvas id="pos-canvas" width="512" height="512"></canvas>
            </div>
            <div class="simulation-panel">
                <h2>Momentum Space |ψ(k<sub>x</sub>,k<sub>y</sub>)|²</h2>
                <canvas id="mom-canvas" width="512" height="512"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <p>Click and drag on the Position Space canvas to set initial momentum, then press Start.</p>
                <button id="start-btn">Start</button>
                <button id="reset-btn">Reset</button>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full quantum wave packet simulation.
    // The final version will contain a 2D FFT implementation and the
    // split-step Fourier method for solving the Schrodinger equation.

    const DOM = {
        posCanvas: document.getElementById('pos-canvas'), posCtx: document.getElementById('pos-canvas').getContext('2d'),
        momCanvas: document.getElementById('mom-canvas'), momCtx: document.getElementById('mom-canvas').getContext('2d'),
        startBtn: document.getElementById('start-btn'),
        resetBtn: document.getElementById('reset-btn'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    const SIZE = 128;
    let psi_re = new Float32Array(SIZE * SIZE);
    let psi_im = new Float32Array(SIZE * SIZE);
    let isRunning = false;

    // FFT placeholder
    function fft2(re, im) { /* ... */ }
    function ifft2(re, im) { /* ... */ }

    function initialize(px, py) {
        // Create a Gaussian wave packet
        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                const idx = i * SIZE + j;
                const distSq = (i - SIZE/2)**2 + (j - SIZE/2)**2;
                const envelope = Math.exp(-distSq / 200);
                psi_re[idx] = envelope * Math.cos(px * j + py * i);
                psi_im[idx] = envelope * Math.sin(px * j + py * i);
            }
        }
    }

    function step() {
        // The Split-Step Fourier Method
        // 1. FFT to momentum space
        // 2. Apply kinetic operator
        // 3. iFFT back to position space
        // 4. Apply potential operator (trivial here as V=0)
    }

    function draw() {
        // Draw probability density |psi|^2 to the position canvas
        const posImageData = DOM.posCtx.createImageData(SIZE, SIZE);
        for (let i = 0; i < psi_re.length; i++) {
            const prob = psi_re[i]**2 + psi_im[i]**2;
            const c = Math.min(255, prob * 500);
            posImageData.data[i*4+0] = c;
            posImageData.data[i*4+1] = c/2;
            posImageData.data[i*4+2] = 255-c;
            posImageData.data[i*4+3] = 255;
        }
        DOM.posCtx.putImageData(posImageData, 0, 0);
    }

    function gameLoop() {
        if(isRunning) step();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function setup() {
        DOM.startBtn.onclick = () => { isRunning = true; };
        DOM.resetBtn.onclick = () => { isRunning = false; initialize(0,0); };

        DOM.expositionContent.innerHTML = `<h1>Quantum Mechanics on a Torus</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        initialize(0.5, 0.2); // Initial momentum
        gameLoop();
    }

    setup();
});
</script>
</body>
</html>
