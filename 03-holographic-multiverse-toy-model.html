<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Holographic Multiverse</title>
    <style>
        /* A new, holographic/ethereal theme */
        :root {
            --bg-color: #0c0a18;
            --primary-color: #d8d8e2;
            --secondary-color: #2a215a;
            --accent-color: #00fddc;
            --highlight-color: #ff00ff;
            --font-family: 'Orbitron', 'Segoe UI', sans-serif;
            --monospace-family: 'Share Tech Mono', 'Courier New', monospace;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 1px solid var(--secondary-color); padding-bottom: 10px; font-weight: 400; text-transform: uppercase; letter-spacing: 2px; }
        .panel { background-color: rgba(0,0,0,0.2); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; }
        .viz-item { background-color: #000; border-radius: 50%; position: relative; min-height: 600px; overflow: hidden; }
        .viz-item canvas { width: 100%; height: 100%; }
        button { background-color: var(--accent-color); color: #000; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1>Deep Simulation: The Holographic Principle</h1>
            <p>A toy model visualizing how a universe's 'bulk' reality could be encoded on a lower-dimensional 'boundary'.</p>
        </header>

        <div class="main-layout">
            <div class="controls-metrics-column">
                <div class="panel">
                    <h3>Boundary Controls</h3>
                    <div class="control-item" style="margin-bottom: 15px;">
                        <label>Coupling Strength:</label>
                        <input type="range" id="coupling" min="0.01" max="0.5" step="0.01" value="0.2">
                    </div>
                    <button id="excite-btn">Excite Boundary Field</button>
                    <button id="reset-btn" style="margin-top: 10px;">Reset</button>
                </div>
                <div class="panel">
                    <h3>Metrics</h3>
                    <div id="metrics-container"></div>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                    <div class="viz-item">
                        <canvas id="main-viz-canvas"></canvas>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            coupling: 0.2,
            boundaryPoints: 256,
            damping: 0.995,
        },
        state: {
            isRunning: false,
            boundary: null, // { pos, vel }
            bulkImageData: null,
        },
        elements: {},
        ctx: null,

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.resetSimulation();
        },

        cacheDOMElements() {
            this.elements = {
                couplingSlider: document.getElementById('coupling'),
                exciteBtn: document.getElementById('excite-btn'),
                resetBtn: document.getElementById('reset-btn'),
                mainCanvas: document.getElementById('main-viz-canvas'),
                metricsContainer: document.getElementById('metrics-container'),
            };
            this.ctx = this.elements.mainCanvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.exciteBtn.addEventListener('click', () => this.exciteBoundary());
            this.elements.resetBtn.addEventListener('click', () => this.resetSimulation());
            this.elements.couplingSlider.addEventListener('input', e => { this.config.coupling = parseFloat(e.target.value); });
        },

        resetSimulation() {
            this.state.isRunning = false;
            if (this.state.animationFrameId) cancelAnimationFrame(this.state.animationFrameId);

            this.state.boundary = [];
            for(let i=0; i<this.config.boundaryPoints; i++) {
                this.state.boundary.push({ pos: 0, vel: 0 });
            }

            this.state.isRunning = true;
            this.gameLoop();
        },

        exciteBoundary() {
            const index = Math.floor(Math.random() * this.config.boundaryPoints);
            this.state.boundary[index].vel += 1.0;
        },

        step(dt) {
            const { boundary } = this.state;
            const { coupling, damping, boundaryPoints } = this.config;
            const accelerations = new Float32Array(boundaryPoints);

            // Calculate forces (coupled oscillators)
            for(let i=0; i<boundaryPoints; i++) {
                const prev = boundary[(i - 1 + boundaryPoints) % boundaryPoints];
                const next = boundary[(i + 1) % boundaryPoints];
                const current = boundary[i];
                const force = (prev.pos - current.pos) + (next.pos - current.pos);
                accelerations[i] = coupling * force - current.pos * 0.1; // Spring force + pull to center
            }

            // Update velocities and positions
            for(let i=0; i<boundaryPoints; i++) {
                boundary[i].vel += accelerations[i] * dt;
                boundary[i].vel *= damping;
                boundary[i].pos += boundary[i].vel * dt;
            }
        },

        gameLoop() {
            if (!this.state.isRunning) return;
            this.step(0.1);
            this.draw();
            this.state.animationFrameId = requestAnimationFrame(() => this.gameLoop());
        },

        draw() {
            const ctx = this.ctx;
            const canvas = this.elements.mainCanvas;
            const w = canvas.width = canvas.clientWidth;
            const h = canvas.height = canvas.clientHeight;
            const cx = w/2;
            const cy = h/2;
            const radius = w * 0.45;

            // Draw Bulk
            if(!this.state.bulkImageData || this.state.bulkImageData.width !== w) {
                this.state.bulkImageData = ctx.createImageData(w,h);
            }
            const data = this.state.bulkImageData.data;
            // Simplified "bulk" calculation from boundary
            for(let y=0; y<h; y++) {
                for(let x=0; x<w; x++) {
                    const dx = x - cx;
                    const dy = y - cy;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    if (d < radius) {
                        const angle = Math.atan2(dy, dx);
                        const boundaryIndex = Math.floor((angle + Math.PI) / (2*Math.PI) * this.config.boundaryPoints);
                        const val = this.state.boundary[boundaryIndex].pos;
                        const idx = (y * w + x) * 4;
                        data[idx] = Math.abs(val) * 100;
                        data[idx+1] = Math.abs(val) * 255;
                        data[idx+2] = 200 - Math.abs(val)*100;
                        data[idx+3] = 255;
                    }
                }
            }
            ctx.putImageData(this.state.bulkImageData, 0, 0);

            // Draw Boundary
            ctx.strokeStyle = 'var(--accent-color)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<=this.config.boundaryPoints; i++) {
                const idx = i % this.config.boundaryPoints;
                const angle = (i / this.config.boundaryPoints) * 2 * Math.PI;
                const r = radius + this.state.boundary[idx].pos * 50;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();
        },

        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>The Holographic Principle is one of the most counter-intuitive and profound ideas in modern physics. It suggests that the information contained within a volume of space can be fully described by a theory living on the boundary of that volume. In a sense, our three-dimensional reality might be a "hologram" projected from a lower-dimensional surface. This simulation provides a toy model of this concept. The outer, oscillating ring represents the lower-dimensional "boundary" universe, governed by its own simple laws. The interior, the "bulk," is a higher-dimensional space whose appearance is entirely determined by the state of the boundary. By interacting with the boundary, you can see how changes there propagate to create the illusion of a dynamic, higher-dimensional reality.</p>

                <h2>Core Theory</h2>
                <p>The principle originated from studies of black hole thermodynamics, where it was found that the maximum entropy of a black hole is proportional to its surface area, not its volume. This suggested that the information content of the black hole (and perhaps any volume of space) is fundamentally limited by its surface area. The most concrete realization of this idea is the AdS/CFT correspondence, which posits a duality between a quantum field theory (CFT) in D dimensions and a theory of gravity (in Anti-de Sitter space, or AdS) in D+1 dimensions. They are two different mathematical descriptions of the same underlying reality.</p>
                <p>This simulation is an analogy. The 1D ring is the "boundary" where a simple field theory lives (modeled as coupled oscillators). The 2D interior is the "bulk" space. The "physical laws" of the bulk are not fundamental; they are an emergent consequence of the boundary's state. The color at any point in the bulk is calculated from the state of all points on the boundary, representing how the lower-dimensional theory encodes the higher-dimensional one. The "Holographic Multiverse" is a speculative extension of this: if different boundary theories are possible, then a multitude of different bulk universes, each with different emergent physical laws, could also exist.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. Is our universe "really" a hologram?</strong>
                    <p>This is a topic of active research and debate. The holographic principle is a mathematically robust conjecture in the context of string theory and quantum gravity, particularly in AdS space. However, our universe has a positive cosmological constant and is described by de Sitter space, not AdS space, so the direct correspondence does not apply. Nonetheless, many physicists believe that a holographic principle in some form must be a key feature of the correct theory of quantum gravity. It is not a fringe idea, but it is also not a proven fact about our specific universe. It remains one of the most powerful theoretical tools we have for thinking about quantum gravity.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on the holographic principle ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        }
    };

    document.addEventListener('DOMContentLoaded', () => SimApp.init());
    </script>
</body>
</html>
