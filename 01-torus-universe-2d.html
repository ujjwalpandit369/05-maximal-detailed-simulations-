<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The 2D Torus Universe</title>
    <style>
        /* A new, geometric theme */
        :root {
            --bg-color: #2c3e50;
            --primary-color: #ecf0f1;
            --secondary-color: #34495e;
            --accent-color: #e67e22;
            --highlight-color: #f1c40f;
            --font-family: 'Exo 2', 'Segoe UI', sans-serif;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 1px solid var(--secondary-color); padding-bottom: 10px; font-weight: 400; }
        .panel { background-color: var(--secondary-color); border-radius: 8px; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 3fr; gap: 30px; }
        .viz-item { background-color: #000; border: 2px solid var(--accent-color); border-radius: 8px; position: relative; min-height: 600px; }
        .viz-item canvas { width: 100%; height: 100%; }
        button { background-color: var(--accent-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1>Deep Simulation: Exploring a Toroidal Universe</h1>
            <p>Visualizing a finite universe with 'wrap-around' boundaries, similar to the classic Asteroids game.</p>
        </header>

        <div class="main-layout">
            <div class="controls-column">
                <div class="panel">
                    <h3>Controls</h3>
                    <p>Use Arrow Keys to fly the ship.</p>
                    <div class="control-item" style="margin-bottom:15px;">
                        <label>Ship Speed: <span id="speed-value">2</span></label>
                        <input type="range" id="ship-speed" min="1" max="10" step="1" value="2">
                    </div>
                     <div class="control-item">
                        <label><input type="checkbox" id="show-ghosts" checked> Show Topological Ghosts</label>
                    </div>
                    <button id="reset-btn" style="margin-top: 20px;">Reset</button>
                </div>
            </div>

            <div class="simulation-column">
                <div class="panel">
                    <div class="viz-item">
                        <canvas id="main-viz-canvas"></canvas>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            shipSpeed: 2,
            showGhosts: true,
            numGalaxies: 20,
        },
        state: {
            ship: { x: 0, y: 0, angle: 0, path: [] },
            galaxies: [],
            keys: {},
        },
        elements: {},
        ctx: null,

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.resetSimulation();
            this.gameLoop();
        },

        cacheDOMElements() { /* ... */ },
        setupUIListeners() {
            window.addEventListener('keydown', e => this.state.keys[e.key] = true);
            window.addEventListener('keyup', e => this.state.keys[e.key] = false);
            // ... other listeners
        },

        resetSimulation() {
            const w = this.elements.mainCanvas.width;
            const h = this.elements.mainCanvas.height;
            this.state.ship = { x: w/2, y: h/2, angle: 0, path: [] };
            this.state.galaxies = [];
            for(let i=0; i<this.config.numGalaxies; i++) {
                this.state.galaxies.push({ x: Math.random()*w, y: Math.random()*h, r: 5 + Math.random() * 10 });
            }
        },

        step(dt) {
            const { ship, keys } = this.state;
            if(keys['ArrowLeft']) ship.angle -= 0.1;
            if(keys['ArrowRight']) ship.angle += 0.1;

            ship.x += Math.cos(ship.angle) * this.config.shipSpeed;
            ship.y += Math.sin(ship.angle) * this.config.shipSpeed;

            // Torus boundary conditions
            const w = this.elements.mainCanvas.width;
            const h = this.elements.mainCanvas.height;
            if(ship.x > w) ship.x -= w;
            if(ship.x < 0) ship.x += w;
            if(ship.y > h) ship.y -= h;
            if(ship.y < 0) ship.y += h;

            ship.path.push({x: ship.x, y: ship.y});
            if(ship.path.length > 200) ship.path.shift();
        },

        gameLoop() {
            this.step(0.1);
            this.draw();
            requestAnimationFrame(() => this.gameLoop());
        },

        draw() {
            const ctx = this.ctx;
            const w = this.elements.mainCanvas.width = this.elements.mainCanvas.clientWidth;
            const h = this.elements.mainCanvas.height = this.elements.mainCanvas.clientHeight;
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,w,h);

            // Draw galaxies and their ghosts
            this.state.galaxies.forEach(g => {
                for(let dy=-1; dy<=1; dy++) {
                    for(let dx=-1; dx<=1; dx++) {
                        if(!this.config.showGhosts && (dx !== 0 || dy !== 0)) continue;
                        ctx.fillStyle = (dx===0 && dy===0) ? 'var(--highlight-color)' : 'rgba(241, 196, 15, 0.3)';
                        ctx.beginPath();
                        ctx.arc(g.x + dx*w, g.y + dy*h, g.r, 0, 2*Math.PI);
                        ctx.fill();
                    }
                }
            });

            // Draw ship and its path
            const { ship } = this.state;
            // ... ship drawing logic ...
        },

        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>What is the overall shape of the universe? While we can measure its local curvature (which appears to be flat), we don't know its global topology. One of the simplest and most intriguing possibilities is that the universe is finite but boundless, like the surface of a donut or torus. This simulation visualizes what it would be like to live in a 2D toroidal universe. The space behaves like the screen in the classic video game "Asteroids"—flying off one edge instantly makes you reappear on the opposite side. By flying your ship, you can explore the counter-intuitive nature of this "wrap-around" space and see how it's possible for a universe to be finite yet have no edge.</p>

                <h2>Core Theory</h2>
                <p>A 2D torus can be constructed from a simple flat square by "gluing" opposite edges together. Imagine a square piece of paper. First, glue the top and bottom edges to form a cylinder. Then, bend the cylinder around and glue its two circular ends together. This is impossible to do in 3D space without self-intersection, but mathematically it defines a 2D torus. An observer living on this surface would not perceive any curvature; the space would seem flat locally. However, its global topology is different from an infinite plane. If you travel in a straight line, you will eventually return to your starting point.</p>
                <p>This simulation shows the square "fundamental domain" of the torus. The wrap-around effect is the "gluing" of the edges in action. To help visualize the continuous nature of the space, you can enable "Topological Ghosts." This shows how an object near an edge is also, from another perspective, "peeking in" from the opposite edge. The universe is a single, seamless object, and the square is just one way of mapping it.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. Could our real universe be a torus?</strong>
                    <p>Yes, it is a serious possibility. Observations from satellites like WMAP and Planck have shown that the universe is very close to spatially flat. While many assume this means it must be infinite, that is not the only option. A flat space can have a non-trivial topology, like a torus. If our universe were a 3D torus, it would be finite. If we could look far enough in one direction, we would see the back of our own head. In cosmology, we look back in time, so we would see the "back" of our own region of space as it was billions of years ago. Searches for this effect in the Cosmic Microwave Background (CMB) have been conducted by looking for repeating patterns or "circles in the sky," but so far, no definitive evidence for a toroidal topology has been found. However, the universe could be a torus that is simply much larger than our observable horizon, making the topology undetectable to us.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on cosmic topology ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
