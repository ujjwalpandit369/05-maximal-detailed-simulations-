<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Scale-Dependent Spacetime Dimension</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr 350px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; text-align: center; }
        canvas { width: 100%; height: 500px; display: block; background: #333; border-radius: 4px; cursor: zoom-in; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 4; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Scale-Dependent Dimension</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Zoomable Spacetime</h2>
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="simulation-panel">
                <h2>Dimension vs. Scale</h2>
                <div id="chart-container"></div>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <label>Zoom Level: <span id="zoom-value">1x</span></label>
                <input type="range" id="zoom-slider" min="0" max="100" step="1" value="0">
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Scale-Dependent Dimension script.
    // The final version will contain a recursive Sierpinski carpet generator,
    // a zoomable canvas, and a box-counting algorithm to estimate dimension.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        chart: document.getElementById('chart-container'),
        zoomSlider: document.getElementById('zoom-slider'), zoomValue: document.getElementById('zoom-value'),
        expositionContent: document.getElementById('exposition-content'), qaContent: document.getElementById('qa-content')
    };

    let state = { zoom: 1, pan: {x:0, y:0} };

    function drawSierpinski(ctx, x, y, size) {
        if (size < 1 / state.zoom) return;
        if (size < 5) {
            ctx.fillRect(x,y,size,size);
            return;
        }

        const subSize = size / 3;
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                if (i === 1 && j === 1) continue;
                drawSierpinski(ctx, x + j * subSize, y + i * subSize, subSize);
            }
        }
    }

    function draw() {
        const { ctx, canvas } = DOM;
        ctx.save();
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.scale(state.zoom, state.zoom);
        ctx.translate(-canvas.width/2, -canvas.height/2);

        ctx.fillStyle = 'cyan';
        drawSierpinski(ctx, 0, 0, canvas.width);

        ctx.restore();

        // Placeholder for dimension calculation
        const dimension = 2.0 - 0.42 * (Math.min(100,state.zoom) / 100);
        DOM.chart.innerHTML = `<p>Measured Dimension: ${dimension.toFixed(3)}</p>`;
    }

    function setup() {
        DOM.canvas.width = 512; DOM.canvas.height = 512;

        DOM.zoomSlider.addEventListener('input', e => {
            state.zoom = Math.pow(10, parseFloat(e.target.value) / 33); // approx 1 to 1000
            DOM.zoomValue.textContent = `${state.zoom.toFixed(1)}x`;
            draw();
        });

        DOM.expositionContent.innerHTML = `<h1>A Universe of Changing Dimensions</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        draw();
    }

    setup();
});
</script>
</body>
</html>
