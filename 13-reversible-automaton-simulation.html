<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Reversible Cellular Automata</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .comparison-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; text-align: center; }
        canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 4px; image-rendering: pixelated; }
        .controls-panel { text-align: center; background: var(--panel-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .exposition, .qa-section { background: var(--panel-bg); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Reversibility and Information in Cellular Automata</h1></header>
        <div class="controls-panel">
            <button id="forward-btn">Step Forward</button>
            <button id="backward-btn">Step Backward</button>
            <button id="reset-btn">Reset</button>
        </div>
        <div class="comparison-layout">
            <div class="simulation-panel">
                <h2>Irreversible (Game of Life)</h2>
                <canvas id="gol-canvas" width="512" height="512"></canvas>
                <div id="gol-status"></div>
            </div>
            <div class="simulation-panel">
                <h2>Reversible (Block Automaton)</h2>
                <canvas id="rev-canvas" width="512" height="512"></canvas>
                <div id="rev-status"></div>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full reversible CA simulation script.
    // The final version will contain two distinct CA engines and the logic
    // for stepping both forward and backward (where possible).

    const DOM = {
        golCanvas: document.getElementById('gol-canvas'), golCtx: document.getElementById('gol-canvas').getContext('2d'),
        revCanvas: document.getElementById('rev-canvas'), revCtx: document.getElementById('rev-canvas').getContext('2d'),
        forwardBtn: document.getElementById('forward-btn'), backwardBtn: document.getElementById('backward-btn'),
        resetBtn: document.getElementById('reset-btn'),
        golStatus: document.getElementById('gol-status'), revStatus: document.getElementById('rev-status'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    const GRID_SIZE = 64;
    let gol_grid = new Uint8Array(GRID_SIZE * GRID_SIZE);
    let rev_grid = new Uint8Array(GRID_SIZE * GRID_SIZE);
    let history = []; // To store states of the reversible automaton

    function step_gol() { /* ... Game of Life logic from previous sim ... */ }

    function step_rev_forward() {
        const new_grid = new Uint8Array(GRID_SIZE * GRID_SIZE);
        // ... Reversible block automaton logic ...
        history.push(rev_grid.slice()); // Save current state
        rev_grid = new_grid;
    }

    function step_rev_backward() {
        if (history.length > 0) {
            rev_grid = history.pop();
            DOM.revStatus.textContent = "Reversed successfully.";
        } else {
            DOM.revStatus.textContent = "At initial state.";
        }
    }

    function draw(ctx, grid) {
        const cellSize = ctx.canvas.width / GRID_SIZE;
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,ctx.canvas.width, ctx.canvas.height);
        ctx.fillStyle = '#00ffaa';
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                if (grid[i * GRID_SIZE + j] === 1) {
                    ctx.fillRect(j * cellSize, i * cellSize, cellSize, cellSize);
                }
            }
        }
    }

    function reset() {
        history = [];
        for(let i=0; i<gol_grid.length; i++) {
            const val = Math.random() > 0.5 ? 1 : 0;
            gol_grid[i] = val;
            rev_grid[i] = val;
        }
        history.push(rev_grid.slice());
        draw(DOM.golCtx, gol_grid);
        draw(DOM.revCtx, rev_grid);
        DOM.golStatus.textContent = "Ready.";
        DOM.revStatus.textContent = "Ready.";
    }

    DOM.forwardBtn.onclick = () => {
        step_gol();
        step_rev_forward();
        draw(DOM.golCtx, gol_grid);
        draw(DOM.revCtx, rev_grid);
        DOM.golStatus.textContent = "Stepped forward.";
        DOM.revStatus.textContent = "Stepped forward.";
    };

    DOM.backwardBtn.onclick = () => {
        step_rev_backward();
        draw(DOM.revCtx, rev_grid);
        DOM.golStatus.textContent = "Cannot reverse: Information is lost.";
    };

    DOM.resetBtn.onclick = reset;

    DOM.expositionContent.innerHTML = `<h1>Reversibility and the Arrow of Time</h1><p>...Full 5000+ word text...</p>`;
    DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

    reset();
});
</script>
</body>
</html>
