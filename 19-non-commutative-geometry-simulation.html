<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Non-Commutative "Fuzzy" Spacetime</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        canvas { width: 100%; height: 500px; display: block; background: #000; border-radius: 4px; cursor: crosshair; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        h3 { color: var(--secondary-color); }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="range"] { width: 100%; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Visualizing a Non-Commutative Plane</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>"Fuzzy" Spacetime</h2>
                <p>Click to create a "point".</p>
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <label>Non-Commutativity (θ): <span id="theta-value">100</span></label>
                <input type="range" id="theta-slider" min="10" max="1000" step="10" value="100">
                <p>This controls the minimum possible area of a "point" (Δx * Δy ≥ θ).</p>
                <button id="clear-btn">Clear</button>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Non-Commutative Geometry script.
    // The final version will draw fuzzy ellipses representing the uncertainty
    // principle inherent in this geometry.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        thetaSlider: document.getElementById('theta-slider'), thetaValue: document.getElementById('theta-value'),
        clearBtn: document.getElementById('clear-btn'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = {
        theta: 100,
        points: []
    };

    function draw() {
        const { ctx, canvas } = DOM;
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        state.points.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, p.rx, p.ry, p.angle, 0, 2 * Math.PI);
            ctx.fill();
        });
    }

    function addPoint(x, y) {
        const area = state.theta;
        const rx = Math.sqrt(area * (0.5 + Math.random()));
        const ry = area / rx;
        state.points.push({
            x, y, rx, ry,
            angle: Math.random() * Math.PI,
            color: `hsla(${Math.random()*360}, 100%, 70%, 0.5)`
        });
        draw();
    }

    function setup() {
        DOM.canvas.width = DOM.canvas.offsetWidth;
        DOM.canvas.height = DOM.canvas.offsetHeight;

        DOM.thetaSlider.addEventListener('input', e => {
            state.theta = parseFloat(e.target.value);
            DOM.thetaValue.textContent = state.theta.toFixed(0);
        });

        DOM.canvas.addEventListener('click', e => {
            addPoint(e.offsetX, e.offsetY);
        });

        DOM.clearBtn.addEventListener('click', () => {
            state.points = [];
            draw();
        });

        DOM.expositionContent.innerHTML = `<h1>The Fuzziness of Reality</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        draw();
    }

    setup();
});
</script>
</body>
</html>
