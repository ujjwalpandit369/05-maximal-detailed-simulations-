<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Cosmological Natural Selection</title>
    <meta name="description" content="A statistical simulation of Lee Smolin's theory of Cosmological Natural Selection, where universes evolve to maximize black hole production.">
    <meta name="keywords" content="Cosmological Natural Selection, Lee Smolin, Fine-Tuning, Multiverse, Evolutionary Cosmology, Physics Simulation">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #c9d1d9;
            --secondary-color: #161b22;
            --accent-color: #82aaff; /* A scientific blue */
            --highlight-color: #c792ea; /* A soft purple */
            --border-color: #30363d;
            --font-family: 'Exo 2', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.8;
            font-size: 18px;
        }
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; color: var(--accent-color); font-weight: 700; }
        h2 { font-size: 2em; color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        h3 { font-size: 1.5em; color: var(--highlight-color); margin-top: 30px; }
        .panel {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            align-items: flex-start;
        }
        .viz-item {
            background-color: #000;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            position: relative;
            height: 800px;
            overflow: hidden;
        }
        .viz-item canvas { width: 100%; height: 100%; display: block; }
        .controls-column .panel { position: sticky; top: 20px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: var(--primary-color); }
        input[type="range"] { width: 100%; }
        button {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 48%;
            margin-top: 10px;
            font-size: 1em;
            transition: background-color 0.3s ease;
            font-weight: bold;
        }
        button:hover { background-color: var(--highlight-color); }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .metric-item { background-color: #0d1117; padding: 15px; border-radius: 5px; border-left: 3px solid var(--highlight-color); }
        .metric-item strong { display: block; color: var(--accent-color); font-size: 0.9em; }
        .metric-item span { font-family: var(--font-mono); font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Simulation: Cosmological Natural Selection</h1>
            <p>A Statistical Simulation of an Evolving Multiverse</p>
        </header>

        <div class="main-layout">
            <div class="simulation-column">
                <div class="panel">
                    <div class="viz-item">
                        <canvas id="cns-canvas"></canvas>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>

            <div class="controls-column">
                <div class="panel">
                    <h3>Evolution Controls</h3>
                    <div class="control-group">
                        <label for="mutation-rate">Mutation Rate</label>
                        <input type="range" id="mutation-rate" min="0.001" max="0.2" step="0.001" value="0.02">
                        <span id="mutation-rate-value">0.020</span>
                    </div>
                    <div class="control-group">
                        <label for="population-size">Max Population Size</label>
                        <input type="range" id="population-size" min="100" max="1000" step="10" value="500">
                        <span id="population-size-value">500</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <button id="next-gen-btn">Next Generation</button>
                        <button id="run-continuously-btn">Run Continuously</button>
                    </div>
                    <button id="reset-sim-btn" style="width: 100%;">Reset Simulation</button>
                </div>
                <div class="panel">
                    <h3>Population Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <strong>Generation</strong>
                            <span id="metric-generation">0</span>
                        </div>
                        <div class="metric-item">
                            <strong>Population</strong>
                            <span id="metric-population">0</span>
                        </div>
                        <div class="metric-item">
                            <strong>Avg. Fitness</strong>
                            <span id="metric-avg-fitness">0.00</span>
                        </div>
                        <div class="metric-item">
                            <strong>Peak Fitness</strong>
                            <span id="metric-peak-fitness">1.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            mutationRate: 0.02,
            maxPopulation: 500,
            peakX: 0.5,
            peakY: 0.5,
            peakWidth: 0.1,
        },
        state: {
            universes: [],
            generation: 0,
            isRunning: false,
        },
        elements: {},
        ctx: null,

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.reset();
            this.gameLoop();
        },

        cacheDOMElements() {
            this.elements = {
                canvas: document.getElementById('cns-canvas'),
                mutationSlider: document.getElementById('mutation-rate'),
                mutationValue: document.getElementById('mutation-rate-value'),
                populationSlider: document.getElementById('population-size'),
                populationValue: document.getElementById('population-size-value'),
                nextGenBtn: document.getElementById('next-gen-btn'),
                runBtn: document.getElementById('run-continuously-btn'),
                resetBtn: document.getElementById('reset-sim-btn'),
                metricGeneration: document.getElementById('metric-generation'),
                metricPopulation: document.getElementById('metric-population'),
                metricAvgFitness: document.getElementById('metric-avg-fitness'),
                metricPeakFitness: document.getElementById('metric-peak-fitness'),
            };
            this.ctx = this.elements.canvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.mutationSlider.addEventListener('input', e => {
                this.config.mutationRate = parseFloat(e.target.value);
                this.elements.mutationValue.textContent = this.config.mutationRate.toFixed(3);
            });
            this.elements.populationSlider.addEventListener('input', e => {
                this.config.maxPopulation = parseInt(e.target.value);
                this.elements.populationValue.textContent = this.config.maxPopulation;
            });
            this.elements.nextGenBtn.addEventListener('click', () => this.nextGeneration());
            this.elements.runBtn.addEventListener('click', () => {
                this.state.isRunning = !this.state.isRunning;
                this.elements.runBtn.textContent = this.state.isRunning ? 'Pause' : 'Run Continuously';
            });
            this.elements.resetBtn.addEventListener('click', () => this.reset());
            this.elements.canvas.addEventListener('click', e => {
                const rect = this.elements.canvas.getBoundingClientRect();
                this.config.peakX = (e.clientX - rect.left) / rect.width;
                this.config.peakY = (e.clientY - rect.top) / rect.height;
            });
        },

        reset() {
            this.state.generation = 0;
            this.state.universes = [];
            for(let i=0; i<200; i++) {
                this.state.universes.push({
                    x: Math.random(),
                    y: Math.random(),
                });
            }
            this.state.isRunning = false;
            this.elements.runBtn.textContent = 'Run Continuously';
        },

        getFitness(x, y) {
            const distSq = Math.pow(x - this.config.peakX, 2) + Math.pow(y - this.config.peakY, 2);
            return Math.exp(-distSq / (2 * Math.pow(this.config.peakWidth, 2)));
        },

        nextGeneration() {
            const newUniverses = [];
            let totalFitness = 0;
            for (const uni of this.state.universes) {
                const fitness = this.getFitness(uni.x, uni.y);
                totalFitness += fitness;
                const numOffspring = Math.floor(fitness * 5); // Max 5 offspring
                for(let i=0; i<numOffspring; i++) {
                    if (newUniverses.length >= this.config.maxPopulation) break;
                    newUniverses.push({
                        x: uni.x + (Math.random() - 0.5) * this.config.mutationRate,
                        y: uni.y + (Math.random() - 0.5) * this.config.mutationRate,
                    });
                }
            }
            this.state.universes = newUniverses;
            this.state.generation++;
            this.updateMetrics(totalFitness);
        },

        updateMetrics(totalFitness) {
            this.elements.metricGeneration.textContent = this.state.generation;
            const pop = this.state.universes.length;
            this.elements.metricPopulation.textContent = pop;
            if (pop > 0) {
                this.elements.metricAvgFitness.textContent = (totalFitness / pop).toFixed(2);
            }
            this.elements.metricPeakFitness.textContent = this.getFitness(this.config.peakX, this.config.peakY).toFixed(2);
        },

        gameLoop() {
            if (this.state.isRunning && this.state.generation < 1000) {
                this.nextGeneration();
            }
            this.draw();
            requestAnimationFrame(() => this.gameLoop());
        },

        draw() {
            const ctx = this.ctx;
            const w = ctx.canvas.width = ctx.canvas.clientWidth;
            const h = ctx.canvas.height = ctx.canvas.clientHeight;
            ctx.clearRect(0,0,w,h);

            // Draw fitness landscape
            const imageData = ctx.createImageData(w, h);
            for (let x = 0; x < w; x++) {
                for (let y = 0; y < h; y++) {
                    const fitness = this.getFitness(x/w, y/h);
                    const index = (y * w + x) * 4;
                    imageData.data[index] = 130 * fitness;     // R
                    imageData.data[index + 1] = 170 * fitness; // G
                    imageData.data[index + 2] = 255 * fitness; // B
                    imageData.data[index + 3] = 255;           // A
                }
            }
            ctx.putImageData(imageData, 0, 0);

            // Draw universes
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for(const uni of this.state.universes) {
                ctx.beginPath();
                ctx.arc(uni.x * w, uni.y * h, 2, 0, 2*Math.PI);
                ctx.fill();
            }

            // Draw peak fitness marker
            ctx.strokeStyle = 'var(--highlight-color)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.config.peakX * w, this.config.peakY * h, 10, 0, 2 * Math.PI);
            ctx.stroke();

            // Labels
            ctx.fillStyle = 'white';
            ctx.font = '14px Exo 2';
            ctx.fillText("Parameter 1 (e.g., Strength of Gravity)", w/2, h - 10);
            ctx.save();
            ctx.rotate(-Math.PI/2);
            ctx.textAlign = 'center';
            ctx.fillText("Parameter 2 (e.g., Fine-Structure Constant)", -h/2, 20);
            ctx.restore();
        },

        injectTextContent() {
            const content = `
                <h2>The Fine-Tuning Problem: A Universe Fit for Life?</h2>
                <p>One of the deepest and most persistent puzzles in science is the <strong>Fine-Tuning Problem</strong>. It arises from the observation that the fundamental constants of nature—numbers like the strength of gravity, the mass of the electron, the value of the cosmological constant—appear to be exquisitely adjusted to the precise values needed for a complex, life-permitting universe to exist. If the strong nuclear force were just a few percent weaker, stars couldn't fuse elements beyond hydrogen. If the cosmological constant were not incomprehensibly close to zero, the universe would have either flown apart or recollapsed before galaxies could even form. The universe appears to be balanced on a knife's edge, and this "unnatural" balance begs for an explanation.</p>
                <p>Traditionally, there have been two responses: divine intervention (the constants were set by a creator) or the anthropic principle (we only observe a fine-tuned universe because we couldn't exist in one that wasn't). Physicist Lee Smolin proposed a third, more scientific possibility, one that recasts cosmology in the language of biology: <strong>Cosmological Natural Selection (CNS)</strong>. This theory suggests that universes, like living organisms, can reproduce, and that a form of natural selection operating on a cosmic scale is responsible for the fine-tuned parameters we observe.</p>

                <h2>Darwin in the Cosmos: The CNS Hypothesis</h2>
                <p>The CNS hypothesis is built upon two speculative but plausible ideas from the preceding simulations:</p>
                <ol>
                    <li><strong>Universes reproduce:</strong> As seen in the "Universe from a Black Hole" model, every black hole could potentially create a new "child" universe.</li>
                    <li><strong>Traits are inherited with mutation:</strong> During the violent "bounce" that creates the new universe, the fundamental constants are slightly and randomly altered. The child universe inherits parameters very similar, but not identical, to its parent.</li>
                </ol>
                <p>If these two conditions hold, then a process analogous to Darwinian evolution can occur across the multiverse. The "fitness" of a universe is its ability to reproduce—in this case, the number of black holes it creates. Universes with parameters that are "fitter" (i.e., better at making black holes) will have more offspring. Over countless "generations," the population of universes will evolve. The parameters that become most common will be those that lie at a "peak" in the fitness landscape—a combination of constants that maximizes black hole production.</p>

                <h2>The Fitness Landscape of Universes</h2>
                <p>This simulation visualizes this exact process. The canvas represents a 2D slice of the vast "parameter space" of all possible physical laws. The color-coded background is the <strong>fitness landscape</strong>, where brighter regions correspond to parameters that yield more black holes. You can click on the landscape to move the "peak fitness" zone.</p>
                <p>The simulation starts with a random population of universes. As you step through the generations, you will see the population shift. Universes in low-fitness (dark) regions have few or no offspring and their "genetic lines" die out. Universes in high-fitness (bright) regions reproduce prolifically. The "mutation rate" introduces variation, allowing the population to explore the parameter space. Over time, the cloud of universes will "climb the hill" of the fitness landscape and congregate around the peak. The prediction of CNS is that we should find ourselves living in a universe whose constants are very near such a peak.</p>

                <h2>Is It Science? Predictions and Falsifiability</h2>
                <p>What elevates CNS from mere philosophical speculation to a genuine scientific theory is that it is <strong>falsifiable</strong>. It makes a bold, testable prediction: if you were to change any of the fundamental constants of our universe by a small amount, the new, hypothetical universe should be *less* efficient at producing black holes. If a physicist could perform a calculation showing that, for example, making the neutron slightly heavier would lead to a universe with many *more* black holes, the CNS hypothesis would be proven false.</p>
                <p>Calculations to test this are incredibly difficult but not impossible. They involve simulating stellar evolution and galaxy formation with different physical laws. So far, the existing (and highly complex) analyses suggest that our universe's parameters are indeed remarkably good for making black holes, lending circumstantial support to the theory. But the work is far from complete, and the theory remains a tantalizing but unproven idea on the frontiers of cosmology.</p>

                <h2>Q&A: An Evolving Multiverse</h2>
                <div class="qa-item">
                    <strong>1. Why are black holes the key to reproduction?</strong>
                    <p>The hypothesis links the creation of a new universe to the formation of a singularity, which is then resolved by a quantum gravity "bounce." In our universe, the only places where singularities are known to form (theoretically) is inside black holes. Therefore, black holes are the natural mechanism for cosmic reproduction.</p>
                </div>
                <div class="qa-item">
                    <strong>2. Does this mean life is the goal of the universe?</strong>
                    <p>No, and this is a key point. In CNS, life is a side effect, not the goal. The process selects for black hole production. However, to make a lot of black holes, a universe needs to be able to form large, stable stars. This requires a lot of carbon, which is produced in stellar fusion. Carbon, in turn, is the backbone of life as we know it. So, life appears in universes that are good at making black holes—we are a byproduct of a universe fine-tuned for something else.</p>
                </div>
                <!-- ... 18+ more Q&A items ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
