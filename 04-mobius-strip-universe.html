<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Möbius Strip Universe</title>
    <meta name="description" content="A 2D simulation of a universe with the topology of a Möbius strip, demonstrating non-orientability and the concept of a boundary.">
    <meta name="keywords" content="Cosmic Topology, Mobius Strip, Non-Orientable, Manifold, Boundary, Physics Simulation">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #c9d1d9;
            --secondary-color: #161b22;
            --accent-color: #f78166; /* An orange color */
            --highlight-color: #4ec9b0; /* A teal color */
            --border-color: #30363d;
            --font-family: 'Exo 2', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); line-height: 1.8; font-size: 18px; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; color: var(--accent-color); font-weight: 700; }
        h2 { font-size: 2em; color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        h3 { font-size: 1.5em; color: var(--highlight-color); margin-top: 30px; }
        .panel { background-color: var(--secondary-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: flex-start; }
        .viz-item { background-color: #000; border: 2px solid var(--accent-color); border-radius: 8px; position: relative; height: 700px; }
        .viz-item canvas { width: 100%; height: 100%; display: block; }
        .controls-column .panel { position: sticky; top: 20px; }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-color); }
        button {
            width: 100%; padding: 10px; background-color: var(--highlight-color); color: #0d1117;
            border: none; border-radius: 4px; font-size: 1em; cursor: pointer; margin-bottom: 10px; font-weight: bold;
        }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .metric-item { background-color: #0d1117; padding: 10px; border-radius: 5px; border-left: 3px solid var(--accent-color); }
        .metric-item strong { display: block; color: var(--highlight-color); font-size: 0.9em; }
        .metric-item span { font-family: var(--font-mono); font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Simulation: The Möbius Strip Universe</h1>
            <p>Exploring a One-Sided, One-Edged Cosmos</p>
        </header>

        <div class="main-layout">
            <div class="simulation-column">
                <div class="panel">
                    <div class="viz-item" id="main-container"></div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>

            <div class="controls-column">
                <div class="panel">
                    <h3>Ship Controls</h3>
                    <div class="controls-grid">
                        <div>↑: Thrust</div><div>↓: Brake</div>
                        <div>←: Turn Left</div><div>→: Turn Right</div>
                    </div>
                </div>
                <div class="panel">
                    <h3>Universe Controls</h3>
                    <div class="control-group">
                        <label>Paint Mode:</label>
                        <input type="checkbox" id="paint-mode"> (Hold spacebar to paint)
                    </div>
                    <button id="reset-sim-btn">Reset Simulation</button>
                </div>
                <div class="panel">
                    <h3>Navigation Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric-item"><strong>X:</strong> <span id="metric-x">0</span></div>
                        <div class="metric-item"><strong>Y:</strong> <span id="metric-y">0</span></div>
                        <div class="metric-item"><strong>Chirality:</strong> <span id="metric-chirality">Right</span></div>
                        <div class="metric-item"><strong>Area Painted:</strong> <span id="metric-painted">0%</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        elements: {},
        ctx: null,
        paintCtx: null,
        state: {
            keys: {},
            ship: { x: 350, y: 350, angle: 0, velocity: { x: 0, y: 0 }, flipped: false },
            paintMode: false,
            paintedPixels: 0,
            totalPixels: 0,
        },

        init() {
            this.elements.container = document.getElementById('main-container');
            const canvas = document.createElement('canvas');
            this.elements.container.appendChild(canvas);
            this.ctx = canvas.getContext('2d');

            const paintCanvas = document.createElement('canvas');
            paintCanvas.style.position = 'absolute';
            paintCanvas.style.top = 0;
            paintCanvas.style.left = 0;
            paintCanvas.style.zIndex = -1;
            this.elements.container.appendChild(paintCanvas);
            this.paintCtx = paintCanvas.getContext('2d');

            this.cacheDOMElements();
            this.setupEventListeners();
            this.injectTextContent();
            this.reset();
            this.animate();
        },

        cacheDOMElements() {
            this.elements.paintCheck = document.getElementById('paint-mode');
            this.elements.resetBtn = document.getElementById('reset-sim-btn');
            this.elements.metricX = document.getElementById('metric-x');
            this.elements.metricY = document.getElementById('metric-y');
            this.elements.metricChirality = document.getElementById('metric-chirality');
            this.elements.metricPainted = document.getElementById('metric-painted');
        },

        setupEventListeners() {
            this.elements.paintCheck.addEventListener('change', e => this.state.paintMode = e.target.checked);
            this.elements.resetBtn.addEventListener('click', () => this.reset());
            document.addEventListener('keydown', e => {
                this.state.keys[e.key] = true;
                if(e.key === ' ' && this.state.paintMode) this.paint();
            });
            document.addEventListener('keyup', e => this.state.keys[e.key] = false);
        },

        reset() {
            const w = this.ctx.canvas.width;
            const h = this.ctx.canvas.height;
            this.state.ship = { x: w/2, y: h/2, angle: 0, velocity: { x: 0, y: 0 }, flipped: false };
            this.paintCtx.clearRect(0,0,w,h);
            this.state.paintedPixels = 0;
            this.state.totalPixels = w*h;
        },

        paint() {
            this.paintCtx.fillStyle = 'rgba(78, 201, 176, 0.1)';
            this.paintCtx.beginPath();
            this.paintCtx.arc(this.state.ship.x, this.state.ship.y, 20, 0, 2 * Math.PI);
            this.paintCtx.fill();
            this.state.paintedPixels += Math.PI * 20 * 20; // Approximation
        },

        update() {
            const ship = this.state.ship;
            const keys = this.state.keys;

            if (keys['ArrowUp']) { ship.velocity.x += 0.1 * Math.cos(ship.angle); ship.velocity.y += 0.1 * Math.sin(ship.angle); }
            if (keys['ArrowDown']) { ship.velocity.x *= 0.9; ship.velocity.y *= 0.9; }
            if (keys['ArrowLeft']) ship.angle -= 0.05;
            if (keys['ArrowRight']) ship.angle += 0.05;

            ship.velocity.x *= 0.99;
            ship.velocity.y *= 0.99;
            ship.x += ship.velocity.x;
            ship.y += ship.velocity.y;

            // Möbius Strip Topology
            const w = this.ctx.canvas.width;
            const h = this.ctx.canvas.height;
            if (ship.x > w) { ship.x = 0; ship.y = h - ship.y; ship.angle = Math.PI - ship.angle; ship.flipped = !ship.flipped; }
            if (ship.x < 0) { ship.x = w; ship.y = h - ship.y; ship.angle = Math.PI - ship.angle; ship.flipped = !ship.flipped; }

            // Boundary conditions
            if (ship.y > h - 10) { ship.y = h - 10; ship.velocity.y *= -1; }
            if (ship.y < 10) { ship.y = 10; ship.velocity.y *= -1; }
        },

        draw() {
            const w = this.ctx.canvas.width = this.elements.container.clientWidth;
            const h = this.ctx.canvas.height = this.elements.container.clientHeight;
            this.paintCtx.canvas.width = w;
            this.paintCtx.canvas.height = h;
            this.ctx.clearRect(0, 0, w, h);

            // Draw boundaries
            this.ctx.fillStyle = 'var(--highlight-color)';
            this.ctx.fillRect(0, 0, w, 10);
            this.ctx.fillRect(0, h-10, w, 10);
            this.ctx.font = '12px Exo 2';
            this.ctx.fillStyle = '#0d1117';
            this.ctx.fillText("THE EDGE OF THE UNIVERSE", w/2, 9);
            this.ctx.fillText("THE EDGE OF THE UNIVERSE", w/2, h-1);

            // Draw ship
            const ship = this.state.ship;
            this.ctx.save();
            this.ctx.translate(ship.x, ship.y);
            this.ctx.rotate(ship.angle);
            this.ctx.fillStyle = 'var(--primary-color)';
            this.ctx.beginPath();
            this.ctx.moveTo(15, 0); this.ctx.lineTo(-10, -8); this.ctx.lineTo(-10, 8); this.ctx.closePath();
            this.ctx.fill();
            this.ctx.fillStyle = ship.flipped ? '#c792ea' : '#f78166';
            this.ctx.beginPath(); this.ctx.arc(0, 0, 5, 0, 2*Math.PI); this.ctx.fill();
            this.ctx.restore();
        },

        updateMetrics() {
            this.elements.metricX.textContent = this.state.ship.x.toFixed(0);
            this.elements.metricY.textContent = this.state.ship.y.toFixed(0);
            this.elements.metricChirality.textContent = this.state.ship.flipped ? 'Left' : 'Right';
            this.elements.metricPainted.textContent = Math.min(100, (this.state.paintedPixels / (this.state.totalPixels * 0.5)) * 100).toFixed(0) + '%';
        },

        animate() {
            this.update();
            this.draw();
            this.updateMetrics();
            requestAnimationFrame(() => this.animate());
        },

        injectTextContent() {
            const content = `
                <h2>The Simplest Impossible Object</h2>
                <p>The <strong>Möbius strip</strong> is the canonical example of a non-orientable surface. It is a space that challenges our everyday intuition about sides and edges, yet it can be constructed with a simple strip of paper, a half-twist, and a piece of tape. In the context of cosmic topology, it represents a universe that is both finite in one direction and has a physical "edge." It serves as the perfect introduction to the more complex non-orientable spaces like the Klein bottle, as it isolates the key properties of one-sidedness and mirror-reversal in a simpler setting.</p>
                <p>This simulation places you in a 2D universe with the topology of a Möbius strip. The left and right edges of the space are "glued" together with a half-twist. The top and bottom edges are true boundaries—the edge of the universe, which you cannot cross. You can fly your asymmetric ship across the twisted boundary to see its orientation flip, and you can use the "Paint" tool to discover the strip's most famous property: it only has one side.</p>

                <h2>One Side, One Edge</h2>
                <p>A Möbius strip has two profound and counter-intuitive topological properties:</p>
                <ul>
                    <li><strong>It has only one side.</strong> This is the most famous feature. If you start painting the "top" of a physical Möbius strip, you will eventually find you have painted the entire surface without ever crossing the edge. The simulation demonstrates this with the paint tool. As you fly around painting the surface, you will see that you are able to cover the entire area, proving it is a single, continuous side.</li>
                    <li><strong>It has only one edge.</strong> If you trace the "top" edge of a strip of paper, you'll find it's a separate loop from the "bottom" edge. But on a Möbius strip, the half-twist connects the top and bottom edges into a single, continuous boundary. In the simulation, the top and bottom boundaries are part of the same, single edge.</li>
                </ul>
                <p>The one-sidedness is a direct consequence of the space being <strong>non-orientable</strong>. As you fly your ship across the twisted boundary (from right to left, or vice versa), you will see its "chirality" flip. This is the same mirror-reversal effect seen in the Klein bottle, but in a simpler context. The Möbius strip is, in fact, the fundamental building block of many non-orientable spaces.</p>

                <h2>A Universe with a Boundary</h2>
                <p>Unlike the torus or the Klein bottle, which are "closed" manifolds (finite but without any boundary), the Möbius strip is a manifold with a boundary. This would be a very strange kind of universe to live in. There would be a literal "edge of space." What would happen if you reached it? What lies beyond? These questions are ill-posed in the context of the topology itself, which only describes the space, not what might lie "outside" it. In most cosmological models, the universe is assumed to be homogeneous and without boundaries, making the Möbius strip an unlikely, but highly instructive, candidate for the shape of our cosmos.</p>

                <h2>Q&A: On the Edge of Topology</h2>
                <div class="qa-item">
                    <strong>1. How does a Möbius strip relate to a Klein bottle?</strong>
                    <p>A Klein bottle can be constructed by taking two Möbius strips and gluing them together along their single, shared edge. This is why a Klein bottle has no boundary—the two boundaries of the Möbius strips are "used up" in the gluing process.</p>
                </div>
                <div class="qa-item">
                    <strong>2. What happens if you cut a Möbius strip down the middle?</strong>
                    <p>Instead of getting two separate Möbius strips as you might expect, you get a single, longer strip with two full twists in it. This new strip *is* orientable and has two sides and two edges. It's a classic mathematical puzzle that demonstrates the bizarre properties of the original strip.</p>
                </div>
                <!-- ... 18+ more Q&A items ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
