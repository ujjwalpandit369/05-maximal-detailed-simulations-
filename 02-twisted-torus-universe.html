<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Twisted Torus Universe</title>
    <meta name="description" content="A first-person 3D simulation of navigating a universe with a twisted toroidal topology, demonstrating non-trivial holonomy.">
    <meta name="keywords" content="Cosmic Topology, Twisted Torus, Holonomy, Anisotropy, Finite Universe, Physics Simulation">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #c9d1d9;
            --secondary-color: #161b22;
            --accent-color: #d73a49; /* A reddish color for the twist */
            --highlight-color: #c3e88d; /* A green color for markers */
            --border-color: #30363d;
            --font-family: 'Exo 2', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); line-height: 1.8; font-size: 18px; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; color: var(--accent-color); font-weight: 700; }
        h2 { font-size: 2em; color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        h3 { font-size: 1.5em; color: var(--highlight-color); margin-top: 30px; }
        .panel { background-color: var(--secondary-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; align-items: flex-start; }
        .viz-item { background-color: #000; border: 2px solid var(--accent-color); border-radius: 8px; position: relative; height: 700px; cursor: none; }
        .viz-item canvas { width: 100%; height: 100%; display: block; }
        .controls-column .panel { position: sticky; top: 20px; }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-color); }
        button {
            width: 100%; padding: 10px; background-color: var(--highlight-color); color: #0d1117;
            border: none; border-radius: 4px; font-size: 1em; cursor: pointer; margin-bottom: 10px; font-weight: bold;
        }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .metric-item { background-color: #0d1117; padding: 10px; border-radius: 5px; border-left: 3px solid var(--accent-color); }
        .metric-item strong { display: block; color: var(--highlight-color); font-size: 0.9em; }
        .metric-item span { font-family: var(--font-mono); font-size: 1.1em; }
        .hud-compass { position: absolute; bottom: 20px; left: 20px; width: 100px; height: 100px; border: 1px solid white; border-radius: 50%; }
        .hud-compass-arrow { position: absolute; top: 50%; left: 50%; width: 2px; height: 40px; background: #d73a49; transform-origin: bottom; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Simulation: The Twisted Torus Universe</h1>
            <p>Navigating a Universe with a Global Twist</p>
        </header>

        <div class="main-layout">
            <div class="simulation-column">
                <div class="panel">
                    <div class="viz-item" id="main-container">
                        <div class="hud-compass"><div id="hud-arrow" class="hud-compass-arrow"></div></div>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>

            <div class="controls-column">
                <div class="panel">
                    <h3>Flight Controls</h3>
                    <p>Click simulation to capture mouse. Press ESC to release.</p>
                    <div class="controls-grid">
                        <div>W/S: Forward/Back</div><div>A/D: Strafe L/R</div>
                        <div>R/F: Ascend/Descend</div><div>Mouse: Look</div>
                    </div>
                </div>
                <div class="panel">
                    <h3>Universe Controls</h3>
                    <div class="control-group">
                        <label>Twist Axis:</label>
                        <select id="twist-axis">
                            <option value="z" selected>Z-Axis (90° Twist)</option>
                            <option value="none">None (Simple Torus)</option>
                        </select>
                    </div>
                    <button id="drop-marker-btn">Drop Marker</button>
                    <button id="clear-markers-btn">Clear Markers</button>
                </div>
                <div class="panel">
                    <h3>Navigation Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric-item"><strong>X:</strong> <span id="metric-x">0</span></div>
                        <div class="metric-item"><strong>Y:</strong> <span id="metric-y">0</span></div>
                        <div class="metric-item"><strong>Z:</strong> <span id="metric-z">0</span></div>
                        <div class="metric-item"><strong>Markers:</strong> <span id="metric-markers">0</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // Requires THREE.js
    const SimApp = {
        elements: {},
        three: { scene: null, camera: null, renderer: null, galaxyGroup: null, markers: [] },
        state: {
            keys: {},
            universeSize: 100,
            twistAxis: 'z',
            velocity: new THREE.Vector3(),
            damping: 0.95,
        },

        init() {
            this.cacheDOMElements();
            this.initThreeJS();
            this.setupEventListeners();
            this.createGalaxies();
            this.injectTextContent();
            this.animate();
        },

        cacheDOMElements() {
            this.elements = {
                container: document.getElementById('main-container'),
                twistAxisSelect: document.getElementById('twist-axis'),
                dropMarkerBtn: document.getElementById('drop-marker-btn'),
                clearMarkersBtn: document.getElementById('clear-markers-btn'),
                metricX: document.getElementById('metric-x'),
                metricY: document.getElementById('metric-y'),
                metricZ: document.getElementById('metric-z'),
                metricMarkers: document.getElementById('metric-markers'),
                hudArrow: document.getElementById('hud-arrow'),
            };
        },

        initThreeJS() {
            const t = this.three;
            t.scene = new THREE.Scene();
            t.camera = new THREE.PerspectiveCamera(75, this.elements.container.clientWidth / this.elements.container.clientHeight, 0.1, 1000);
            t.renderer = new THREE.WebGLRenderer({ antialias: true });
            t.renderer.setSize(this.elements.container.clientWidth, this.elements.container.clientHeight);
            this.elements.container.appendChild(t.renderer.domElement);

            const light = new THREE.AmbientLight(0x606060);
            t.scene.add(light);
        },

        createGalaxies() {
            const t = this.three;
            if (t.galaxyGroup) t.scene.remove(t.galaxyGroup);
            t.galaxyGroup = new THREE.Group();

            const galaxyGeo = new THREE.SphereGeometry(1, 16, 16);
            for (let i = 0; i < 200; i++) {
                const galaxyMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.5 + 0.5*Math.random(), 0.5 + 0.5*Math.random(), 0.8 + 0.2*Math.random()) });
                const galaxy = new THREE.Mesh(galaxyGeo, galaxyMat);
                galaxy.position.set(
                    (Math.random() - 0.5) * this.state.universeSize,
                    (Math.random() - 0.5) * this.state.universeSize,
                    (Math.random() - 0.5) * this.state.universeSize
                );
                t.galaxyGroup.add(galaxy);
            }

            // Create 26 copies for seamless wraparound
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    for (let k = -1; k <= 1; k++) {
                        if (i === 0 && j === 0 && k === 0) continue;
                        const clone = t.galaxyGroup.clone();
                        clone.position.set(i * this.state.universeSize, j * this.state.universeSize, k * this.state.universeSize);

                        // Apply twist for relevant clones
                        if (this.state.twistAxis === 'z' && k !== 0) {
                           clone.rotation.z += k * Math.PI / 2;
                        }
                        // Similar logic for other twist axes can be added here.

                        t.scene.add(clone);
                    }
                }
            }
            t.scene.add(t.galaxyGroup);
        },

        setupEventListeners() {
            this.elements.twistAxisSelect.addEventListener('change', e => this.state.twistAxis = e.target.value);
            this.elements.dropMarkerBtn.addEventListener('click', () => this.dropMarker());
            this.elements.clearMarkersBtn.addEventListener('click', () => this.clearMarkers());

            document.addEventListener('keydown', e => this.state.keys[e.key.toLowerCase()] = true);
            document.addEventListener('keyup', e => this.state.keys[e.key.toLowerCase()] = false);

            this.elements.container.addEventListener('click', () => this.elements.container.requestPointerLock());
            document.addEventListener('mousemove', e => {
                if (document.pointerLockElement === this.elements.container) {
                    this.three.camera.rotation.y -= e.movementX * 0.002;
                    this.three.camera.rotation.x -= e.movementY * 0.002;
                    this.three.camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, this.three.camera.rotation.x));
                }
            });
        },

        dropMarker() {
            const markerGeo = new THREE.BoxGeometry(2, 2, 2);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0xc3e88d });
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.position.copy(this.three.camera.position);
            this.three.scene.add(marker);
            this.three.markers.push(marker);
            this.elements.metricMarkers.textContent = this.three.markers.length;
        },

        clearMarkers() {
            this.three.markers.forEach(m => this.three.scene.remove(m));
            this.three.markers = [];
            this.elements.metricMarkers.textContent = 0;
        },

        updatePlayer(delta) {
            const speed = 0.5;
            const moveDirection = new THREE.Vector3();
            if (this.state.keys['w']) moveDirection.z -= 1;
            if (this.state.keys['s']) moveDirection.z += 1;
            if (this.state.keys['a']) moveDirection.x -= 1;
            if (this.state.keys['d']) moveDirection.x += 1;
            if (this.state.keys['r']) moveDirection.y += 1;
            if (this.state.keys['f']) moveDirection.y -= 1;

            if (moveDirection.lengthSq() > 0) {
                moveDirection.normalize().multiplyScalar(speed);
                moveDirection.applyQuaternion(this.three.camera.quaternion);
                this.state.velocity.add(moveDirection);
            }

            this.three.camera.position.add(this.state.velocity);
            this.state.velocity.multiplyScalar(this.damping);

            // Wraparound logic with twist
            const L = this.state.universeSize;
            const halfL = L / 2;
            const pos = this.three.camera.position;
            const quat = this.three.camera.quaternion;

            if (pos.z > halfL && this.state.twistAxis === 'z') {
                pos.z = -halfL;
                const tempX = pos.x;
                pos.x = -pos.y;
                pos.y = tempX;
                quat.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), -Math.PI/2));
            } else if (pos.z < -halfL && this.state.twistAxis === 'z') {
                pos.z = halfL;
                const tempX = pos.x;
                pos.x = pos.y;
                pos.y = -tempX;
                quat.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), Math.PI/2));
            } else {
                 pos.x = ((pos.x + halfL) % L + L) % L - halfL;
                 pos.y = ((pos.y + halfL) % L + L) % L - halfL;
                 pos.z = ((pos.z + halfL) % L + L) % L - halfL;
            }
        },

        animate() {
            requestAnimationFrame(() => this.animate());
            this.updatePlayer(0.1);
            this.updateMetrics();
            this.three.renderer.render(this.three.scene, this.three.camera);
        },

        updateMetrics() {
            const pos = this.three.camera.position;
            this.elements.metricX.textContent = pos.x.toFixed(1);
            this.elements.metricY.textContent = pos.y.toFixed(1);
            this.elements.metricZ.textContent = pos.z.toFixed(1);

            const forward = new THREE.Vector3(0,0,-1).applyQuaternion(this.three.camera.quaternion);
            const angle = Math.atan2(forward.x, -forward.z);
            this.elements.hudArrow.style.transform = `translate(-50%, -100%) rotate(${angle}rad)`;
        },

        injectTextContent() {
            const content = `
                <h2>Beyond the Simple Torus</h2>
                <p>The 3-torus is the simplest possible topology for a finite, flat 3D universe, but it is far from the only one. By introducing "twists" in how the faces of the fundamental domain are identified, we can create much more complex and counter-intuitive spaces. These spaces are still locally flat—from any given point, the geometry appears perfectly Euclidean—but their global properties are profoundly different. This simulation allows you to explore one such space: a <strong>twisted 3-torus</strong>, where traveling through the universe in one direction will return you to your starting point, but rotated.</p>
                <p>To construct this space, we begin with a cube, just as we did for the simple 3-torus. The identifications for two pairs of faces (e.g., top/bottom and left/right) are normal. However, the front and back faces are glued together with a 90-degree twist. If you exit through the front face at coordinates (x, y), you re-enter through the back face at coordinates (-y, x), and your entire spaceship and local coordinate system have been rotated 90 degrees. This is a universe that is finite and locally identical everywhere, but which has a "preferred" global axis of rotation.</p>

                <h2>Holonomy and Global Anisotropy</h2>
                <p>This twisted identification introduces a concept known as non-trivial <strong>holonomy</strong>. In a simple space like a plane or a simple torus, if you take a vector (like a compass needle) and carry it around a large closed loop, it will be pointing in the same direction when you return. In our twisted torus, this is no longer true. If you complete a loop along the "twisted" axis, your compass needle will come back rotated by 90 degrees. Your sense of direction is not globally consistent.</p>
                <p>This has a profound consequence: although the universe is locally isotropic (it looks the same in all directions from any single point), it is <strong>globally anisotropic</strong> (it has a preferred direction or axis on a cosmic scale). An infinitely powerful telescope looking along the twisted axis would see a spiral or corkscrew pattern of galaxies, rather than a simple repeating lattice. You can experience this in the simulation by dropping markers and then flying around the Z-axis; when you return to your markers, you will find their constellation has been rotated relative to your ship's new orientation.</p>

                <h2>The Ten Flat Topologies</h2>
                <p>The twisted torus is just one example. Mathematicians have proven that there are only 10 possible ways to construct a finite, 3D universe that is locally flat. These are the "flat 3-manifolds." They fall into two categories:</p>
                <ul>
                    <li><strong>Orientable (6 manifolds):</strong> These are spaces where a sense of "right-handedness" and "left-handedness" is globally consistent. You cannot be mirror-reversed. The simple 3-torus and this "quarter-turn" twisted torus are two of these six orientable spaces. The other four involve 180-degree twists or more complex combinations.</li>
                    <li><strong>Non-Orientable (4 manifolds):</strong> These are spaces where "right" and "left" are not globally defined. Traveling on a certain path can bring you back to your starting point mirror-reversed. The most famous of these is based on the Klein Bottle, the subject of the next simulation.</li>
                </ul>
                <p>Cosmologists have searched for the signatures of these anisotropic topologies in the Cosmic Microwave Background. The CMB should show specific patterns of temperature correlations if we live in such a universe (e.g., spiral patterns instead of matched circles). To date, no such patterns have been found, indicating that if the universe does have a twisted topology, its fundamental size must be much larger than the part of the universe we can observe.</p>

                <h2>Q&A: A Twisted Reality</h2>
                <div class="qa-item">
                    <strong>1. Is this space curved?</strong>
                    <p>No, and that is the key takeaway. It is perfectly flat everywhere locally. A small triangle drawn anywhere in this space will have its angles sum to 180 degrees. The "twist" is a feature of the global topology (how the space is connected to itself), not the local geometry (curvature).</p>
                </div>
                <div class="qa-item">
                    <strong>2. What is a "deck transformation"?</strong>
                    <p>In topology, a deck transformation is the mathematical term for the "gluing" operation that defines the space. For a simple torus, the transformations are simple translations, like `(x, y, z) -> (x+L, y, z)`. For this twisted torus, one of the deck transformations is a combination of a translation and a rotation: `(x, y, z) -> (-y, x, z+L)`.</p>
                </div>
                <!-- ... 18+ more Q&A items ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
