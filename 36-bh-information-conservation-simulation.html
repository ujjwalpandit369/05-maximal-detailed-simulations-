<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Black Hole Information Paradox</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        canvas { width: 100%; height: 400px; display: block; background: #000; border-radius: 4px; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .info-strip { display: flex; gap: 5px; padding: 10px; background: #111; border-radius: 5px; margin-bottom: 10px; }
        .bit { width: 20px; height: 20px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>The Black Hole Information Paradox</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Spacetime</h2>
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <label for="model-select">Physics Model</label>
                <select id="model-select"><option value="conserved">Information Conserved</option><option value="loss">Information Loss</option></select>
                <button id="drop-btn">Drop Book</button>
                <button id="new-book-btn">New Book</button>
                <h3>Input Information</h3><div id="input-info" class="info-strip"></div>
                <h3>Outgoing Radiation</h3><div id="output-info" class="info-strip"></div>
                <h3>Reconstructed Info</h3><div id="recon-info" class="info-strip"></div>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Black Hole Information script.
    // The final version will contain the animation logic for the book falling in,
    // the black hole evaporating, and the information being reconstructed.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        modelSelect: document.getElementById('model-select'),
        dropBtn: document.getElementById('drop-btn'),
        newBookBtn: document.getElementById('new-book-btn'),
        inputInfo: document.getElementById('input-info'),
        outputInfo: document.getElementById('output-info'),
        reconInfo: document.getElementById('recon-info'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = { book: [], animation: null };
    const COLORS = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];

    function createBook() {
        state.book = Array.from({length: 8}, () => COLORS[Math.floor(Math.random() * COLORS.length)]);
        displayInfo(DOM.inputInfo, state.book);
        DOM.outputInfo.innerHTML = '';
        DOM.reconInfo.innerHTML = '';
    }

    function displayInfo(panel, data) {
        panel.innerHTML = '';
        data.forEach(color => {
            const bitDiv = document.createElement('div');
            bitDiv.className = 'bit';
            bitDiv.style.backgroundColor = color;
            panel.appendChild(bitDiv);
        });
    }

    function runAnimation() {
        // Placeholder for a complex animation sequence
        const model = DOM.modelSelect.value;
        const radiation = [];
        if (model === 'loss') {
            for (let i = 0; i < state.book.length; i++) radiation.push(COLORS[Math.floor(Math.random() * COLORS.length)]);
        } else { // Conserved
            // "Scramble" the information (simple reversal for demo)
            radiation.push(...state.book.slice().reverse());
        }
        displayInfo(DOM.outputInfo, radiation);

        // Attempt reconstruction
        if (model === 'conserved') {
            const reconstructed = radiation.slice().reverse();
            displayInfo(DOM.reconInfo, reconstructed);
        } else {
            DOM.reconInfo.innerHTML = "Information Lost";
        }
    }

    function setup() {
        DOM.dropBtn.addEventListener('click', runAnimation);
        DOM.newBookBtn.addEventListener('click', createBook);

        DOM.expositionContent.innerHTML = `<h1>Is Information Lost in Black Holes?</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        createBook();
    }

    setup();
});
</script>
</body>
</html>
