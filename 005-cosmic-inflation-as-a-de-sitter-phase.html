<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Cosmic Inflation as a de Sitter Phase</title>
    <style>
        /* CSS styles are identical for consistency. */
        :root {
            --bg-color: #1a1a1d; --primary-text: #c5c6c7; --secondary-text: #9fa0a1;
            --panel-bg: #2c2f33; --border-color: #444; --accent-color: #3a86ff;
            --accent-hover: #2b63bc; --error-color: #ff6b6b; --warn-color: #fca311;
            --success-color: #50c878; --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --code-font: 'Courier New', Courier, monospace;
        }
        [data-theme="light"] {
            --bg-color: #f4f4f9; --primary-text: #2c2f33; --secondary-text: #5a5a5a;
            --panel-bg: #ffffff; --border-color: #ddd; --accent-color: #3a86ff;
            --accent-hover: #2b63bc;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-text); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: auto 1fr; grid-template-areas: "header header" "controls main"; height: 100vh; gap: 1rem; padding: 1rem; }
        header { grid-area: header; text-align:center; }
        .controls-panel { grid-area: controls; }
        .main-panel { grid-area: main; display: grid; grid-template-rows: 1fr 1fr; gap: 1rem; }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; overflow-y: auto; }
        header h1 { color: var(--accent-color); margin:0; }
        header h2 { color: var(--primary-text); font-size: 1.1rem; font-weight: normal; margin:0; }
        .control-group { margin-bottom: 1.5rem; } .control-group h3 { margin-top: 0; border-bottom: 2px solid var(--accent-color); padding-bottom: 0.5rem; }
        .control { margin-bottom: 1rem; } .control label { display: block; font-size: 0.9rem; margin-bottom: 0.25rem; }
        .control input[type="range"], .control select { width: 100%; } .control .value-display { font-weight: bold; color: var(--accent-color); }
        .control .tooltip { font-size: 0.8rem; color: var(--secondary-text); }
        .control button { width: 100%; padding: 8px; border-radius: 4px; background-color: var(--accent-color); color: var(--bg-color); font-weight: bold; cursor: pointer; border:none; }
        .control button:hover { background-color: var(--accent-hover); }
        .sim-view { position: relative; width: 100%; height: 100%; background: #000; border-radius: 4px; }
        .metrics-overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; color: white; font-family: var(--code-font); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.7); }
        .modal-content { background-color: var(--panel-bg); margin: 5% auto; padding: 20px; border: 1px solid var(--border-color); width: 80%; max-width: 1000px; border-radius: 8px; position: relative; }
        .modal-close { color: var(--secondary-text); position: absolute; top: 10px; right: 25px; font-size: 35px; font-weight: bold; cursor: pointer; }
        .modal-body { max-height: 70vh; overflow-y: auto; }
        .modal-body h2 { color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cosmic Inflation as a de Sitter Phase</h1>
            <h2>Watch a quantum field drive the exponential expansion of the early universe.</h2>
        </header>

        <aside class="controls-panel panel">
            <div class="control-group">
                <h3>Global Controls</h3>
                <div class="control">
                    <label for="sim-speed">Simulation Speed: <span class="value-display" id="sim-speed-value">1</span>x</label>
                    <input type="range" id="sim-speed" min="0.1" max="5" step="0.1" value="1">
                </div>
                <div class="control">
                    <button id="start-stop-sim">Start/Stop</button>
                    <button id="reset-sim" style="margin-top:5px;">Reset</button>
                </div>
            </div>
            <div class="control-group">
                <h3>Inflaton Potential V(φ)</h3>
                <div class="control">
                    <label for="potential-type">Potential Type</label>
                    <select id="potential-type">
                        <option value="m2phi2">Chaotic (m²φ²)</option>
                        <option value="lambda_phi4">λφ⁴</option>
                    </select>
                </div>
                <div class="control">
                    <label for="potential-m">Mass/Coupling (m or √λ): <span class="value-display" id="potential-m-value">0.1</span></label>
                    <input type="range" id="potential-m" min="0.01" max="0.5" step="0.01" value="0.1">
                    <div class="tooltip">Controls the steepness of the potential.</div>
                </div>
                <div class="control">
                    <label for="initial-phi">Initial Field Value (φ₀): <span class="value-display" id="initial-phi-value">10</span></label>
                    <input type="range" id="initial-phi" min="1" max="20" step="1" value="10">
                    <div class="tooltip">Where the inflaton field starts on the potential.</div>
                </div>
            </div>
             <div class="control-group">
                <h3>Content</h3>
                <button onclick="document.getElementById('exposition-modal').style.display='block'">Read Exposition</button>
            </div>
        </aside>

        <main class="main-panel">
            <div class="sim-view" id="potential-view">
                <canvas id="potential-canvas"></canvas>
                <div class="metrics-overlay" id="potential-metrics"></div>
            </div>
            <div class="sim-view" id="expansion-view">
                <canvas id="expansion-canvas"></canvas>
                <div class="metrics-overlay" id="expansion-metrics"></div>
            </div>
        </main>
    </div>

    <div id="exposition-modal" class="modal"><div class="modal-content"><span class="modal-close" onclick="document.getElementById('exposition-modal').style.display='none'">&times;</span><div class="modal-body" id="exposition-content"></div></div></div>

    <script>
    window.addEventListener('DOMContentLoaded', () => {

        const Sim = {
            config: {
                simSpeed: 1,
                potentialType: 'm2phi2',
                m: 0.1, // mass or sqrt(lambda)
                initialPhi: 10,
            },
            state: {
                isRunning: true,
                time: 0,
                phi: 10, // Inflaton field value
                phi_dot: 0, // Inflaton field velocity
                scale_factor: 1,
                hubble: 0,
                efolds: 0,
                lastFrameTime: 0,
                grid_points: [],
            },
            elements: {},

            init() {
                this.cacheDOMElements();
                this.setupControls();
                this.reset();
                this.state.lastFrameTime = performance.now();
                requestAnimationFrame(this.gameLoop.bind(this));
                document.getElementById('exposition-content').innerHTML = this.getExpositionHTML();
            },

            cacheDOMElements() {
                const ids = [
                    'sim-speed', 'start-stop-sim', 'reset-sim', 'potential-type', 'potential-m', 'potential-m-value',
                    'initial-phi', 'initial-phi-value', 'potential-canvas', 'expansion-canvas',
                    'potential-metrics', 'expansion-metrics'
                ];
                ids.forEach(id => this.elements[id] = document.getElementById(id));
                this.elements.potential_ctx = this.elements.potentialCanvas.getContext('2d');
                this.elements.expansion_ctx = this.elements.expansionCanvas.getContext('2d');
            },

            setupControls() {
                this.elements.simSpeed.addEventListener('input', e => this.config.simSpeed = parseFloat(e.target.value));
                this.elements.startStopSim.addEventListener('click', () => this.state.isRunning = !this.state.isRunning);
                this.elements.resetSim.addEventListener('click', () => this.reset());
                this.elements.potentialType.addEventListener('change', e => this.config.potentialType = e.target.value);
                this.elements.potentialM.addEventListener('input', e => {
                    this.config.m = parseFloat(e.target.value);
                    this.elements.potentialMValue.textContent = this.config.m.toFixed(2);
                });
                this.elements.initialPhi.addEventListener('input', e => {
                    this.config.initialPhi = parseFloat(e.target.value);
                    this.elements.initialPhiValue.textContent = this.config.initialPhi.toFixed(1);
                });
            },

            reset() {
                this.state.time = 0;
                this.state.phi = this.config.initialPhi;
                this.state.phi_dot = 0;
                this.state.scale_factor = 1;
                this.state.efolds = 0;

                this.state.grid_points = [];
                for(let i=0; i<100; i++) {
                    this.state.grid_points.push({
                        x: Math.random(), y: Math.random(),
                        val: Math.random() // Represents quantum fluctuation
                    });
                }
            },

            getPotential(phi) {
                const m = this.config.m;
                if (this.config.potentialType === 'm2phi2') {
                    return 0.5 * m * m * phi * phi;
                } else { // lambda_phi4
                    return 0.25 * m * m * phi * phi * phi * phi;
                }
            },

            getPotentialDerivative(phi) {
                const m = this.config.m;
                if (this.config.potentialType === 'm2phi2') {
                    return m * m * phi;
                } else { // lambda_phi4
                    return m * m * phi * phi * phi;
                }
            },

            gameLoop(currentTime) {
                if (!this.state.isRunning) {
                    this.state.lastFrameTime = currentTime;
                    requestAnimationFrame(this.gameLoop.bind(this));
                    return;
                };
                const dt = ((currentTime - this.state.lastFrameTime) / 1000) * this.config.simSpeed;
                if (dt > 0) {
                    this.update(dt);
                    this.draw();
                }
                this.state.lastFrameTime = currentTime;
                requestAnimationFrame(this.gameLoop.bind(this));
            },

            update(dt) {
                this.state.time += dt;

                const V = this.getPotential(this.state.phi);
                const V_prime = this.getPotentialDerivative(this.state.phi);

                // Friedmann equation: H^2 = (8piG/3) * rho. Here rho ~ V
                this.state.hubble = Math.sqrt(V / 3); // Using 8piG = 1 units

                // Klein-Gordon equation with Hubble friction: phi_ddot + 3H*phi_dot + V'(phi) = 0
                const phi_ddot = -3 * this.state.hubble * this.state.phi_dot - V_prime;
                this.state.phi_dot += phi_ddot * dt;
                this.state.phi += this.state.phi_dot * dt;

                // Update scale factor
                const d_efolds = this.state.hubble * dt;
                this.state.efolds += d_efolds;
                this.state.scale_factor = Math.exp(this.state.efolds);

                // End inflation when potential energy is no longer dominant
                const kinetic_energy = 0.5 * this.state.phi_dot * this.state.phi_dot;
                if (kinetic_energy > V) {
                    this.state.isRunning = false; // Stop when inflation ends
                }
            },

            draw() {
                this.drawPotentialView();
                this.drawExpansionView();
                this.updateMetrics();
            },

            drawPotentialView() {
                const { potential_ctx: ctx, potentialCanvas: canvas } = this.elements;
                const { width, height } = canvas;
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, width, height);

                // Draw potential curve
                ctx.strokeStyle = 'var(--accent-color)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                const max_phi = this.config.initialPhi * 1.1;
                for (let i = 0; i <= width; i++) {
                    const phi = (i / width) * max_phi;
                    const V = this.getPotential(phi);
                    const y = height - (V / this.getPotential(max_phi)) * height * 0.9;
                    if (i === 0) ctx.moveTo(i, y); else ctx.lineTo(i, y);
                }
                ctx.stroke();

                // Draw inflaton "ball"
                const ball_x = (this.state.phi / max_phi) * width;
                const ball_y = height - (this.getPotential(this.state.phi) / this.getPotential(max_phi)) * height * 0.9;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(ball_x, ball_y, 8, 0, 2 * Math.PI);
                ctx.fill();
            },

            drawExpansionView() {
                const { expansion_ctx: ctx, expansionCanvas: canvas } = this.elements;
                const { width, height } = canvas;
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, width, height);

                const spacing = 20 * this.state.scale_factor;
                if (spacing > Math.max(width, height) * 2) return; // Stop drawing if too big

                this.state.grid_points.forEach(p => {
                    const x = p.x * width;
                    const y = p.y * height;
                    const size = p.val * 5 * this.state.scale_factor;
                    const hue = p.val * 360;
                    ctx.fillStyle = `hsla(${hue}, 80%, 60%, 0.8)`;
                    ctx.beginPath();
                    ctx.arc(x,y,size,0,2*Math.PI);
                    ctx.fill();
                });
            },

            updateMetrics() {
                this.elements.potentialMetrics.innerHTML = `
                    Time: ${this.state.time.toFixed(2)}<br>
                    φ: ${this.state.phi.toFixed(3)}<br>
                    V(φ): ${this.getPotential(this.state.phi).toFixed(3)}<br>
                    KE(φ): ${(0.5 * this.state.phi_dot**2).toFixed(3)}
                `;
                this.elements.expansionMetrics.innerHTML = `
                    Scale Factor: ${this.state.scale_factor.toExponential(2)}<br>
                    e-folds: ${this.state.efolds.toFixed(1)}
                `;
            },

            getExpositionHTML() {
                return `
                <h2>Inflation: The Universe's First Growth Spurt</h2>
                <p>The standard Big Bang model is incredibly successful, but it leaves some deep puzzles. For example, why is the universe so uniform on large scales (the "horizon problem") and so geometrically flat (the "flatness problem")? Cosmic Inflation is our leading theoretical solution. It proposes that in the first tiny fraction of a second (around 10⁻³⁶s), the universe underwent a period of extreme, accelerated, exponential expansion—a de Sitter-like phase—driven by the energy of a hypothetical quantum field called the "inflaton."</p>

                <h3>Section 1: The Inflaton Field and its Potential</h3>
                <p>Imagine a new quantum field, the inflaton (φ), permeates all of space. Like all fields, it has a potential energy, V(φ). Inflationary theory proposes this potential had a "slow-roll" region—a vast, nearly flat plateau. If the inflaton field started high up on this plateau, its potential energy would have been enormous and nearly constant. This constant energy density acts just like a cosmological constant, driving the de Sitter-like exponential expansion of space. In the top canvas, you can see the inflaton field visualized as a ball rolling down the potential curve. As long as it rolls slowly, inflation continues.</p>

                <h3>Section 2: From Quantum Fluctuations to Cosmic Structures</h3>
                <p>The bottom canvas visualizes the most profound consequence of inflation. According to quantum mechanics, the inflaton field wasn't perfectly smooth; it had tiny, unavoidable quantum fluctuations. During inflation, the universe expanded so rapidly that these microscopic quantum jitters were stretched to astronomical sizes. Regions where the field fluctuated to a slightly higher value would exit inflation slightly later, resulting in a slightly denser region of space. These tiny density variations became the seeds for all cosmic structure. Every galaxy, star, and planet ultimately owes its existence to these stretched quantum fluctuations. The simulation shows this process: tiny dots (quantum fluctuations) are stretched by the expansion (driven by the inflaton's potential energy) into large-scale structures.</p>

                <h3>Section 3: Reheating - The Graceful Exit</h3>
                <p>When the inflaton field finally rolls to the bottom of its potential well, inflation ends. The field oscillates around the minimum, and its stored potential energy is converted into a hot, dense soup of the elementary particles we know and love (quarks, leptons, photons, etc.). This process is called "reheating." It marks the end of inflation and the beginning of the hot Big Bang era that standard cosmology describes. In the simulation, inflation stops when the kinetic energy of the field (how fast it's rolling) overwhelms its potential energy (how high it is).</p>
                `;
            }
        };

        Sim.init();
    });
    </script>
</body>
</html>
