<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: The Circles-in-the-Sky Test</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; text-align: center; }
        canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 4px; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>The Circles-in-the-Sky Test for Cosmic Topology</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>CMB Sky Map (Equirectangular Projection)</h2>
                <canvas id="main-canvas" width="800" height="400"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <label>Universe Size / Observable Size: <span id="size-value">1.2</span></label>
                <input type="range" id="size-slider" min="0.5" max="1.5" step="0.05" value="1.2">
                <p>Set size < 1 to see matching circles.</p>
                <button id="search-btn">Run Search</button>
                <button id="new-cmb-btn">New CMB Sky</button>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Circles-in-the-Sky script.
    // The final version will generate a procedural CMB map and calculate
    // the intersection circles based on the user-controlled universe size.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        sizeSlider: document.getElementById('size-slider'), sizeValue: document.getElementById('size-value'),
        searchBtn: document.getElementById('search-btn'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = {
        universeSize: 1.2,
        cmbTexture: null,
        circles: []
    };

    function generateCMB() {
        const { ctx, canvas } = DOM;
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        // Simple random noise for placeholder
        for (let i = 0; i < imageData.data.length; i += 4) {
            const c = Math.random() * 255;
            imageData.data[i] = c; imageData.data[i+1] = c; imageData.data[i+2] = c; imageData.data[i+3] = 255;
        }
        state.cmbTexture = imageData;
    }

    function findCircles() {
        state.circles = [];
        if (state.universeSize < 1) {
            const numPairs = Math.floor((1 - state.universeSize) * 10);
            for (let i = 0; i < numPairs; i++) {
                const r = Math.random() * 50 + 20;
                const x1 = Math.random() * 800;
                const y1 = Math.random() * 400;
                // In a simple torus model, the matching circle is just translated
                const x2 = (x1 + 400) % 800;
                const y2 = y1;
                state.circles.push({x1,y1,x2,y2,r});
            }
        }
        draw();
    }

    function draw() {
        const { ctx, canvas } = DOM;
        if (state.cmbTexture) {
            ctx.putImageData(state.cmbTexture, 0, 0);
        }

        ctx.strokeStyle = 'cyan';
        ctx.lineWidth = 2;
        state.circles.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x1, c.y1, c.r, 0, 2 * Math.PI);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(c.x2, c.y2, c.r, 0, 2 * Math.PI);
            ctx.stroke();
        });
    }

    function setup() {
        DOM.sizeSlider.addEventListener('input', e => {
            state.universeSize = parseFloat(e.target.value);
            DOM.sizeValue.textContent = state.universeSize.toFixed(2);
        });
        DOM.searchBtn.addEventListener('click', findCircles);
        document.getElementById('new-cmb-btn').addEventListener('click', () => { generateCMB(); draw(); });

        DOM.expositionContent.innerHTML = `<h1>Searching for a Finite Universe</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        generateCMB();
        draw();
    }

    setup();
});
</script>
</body>
</html>
