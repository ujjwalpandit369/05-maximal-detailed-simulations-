<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Black Hole Information Paradox</title>
    <meta name="description" content="An interactive simulation of the Black Hole Information Paradox, exploring Hawking radiation, holography, and the Child Universe hypothesis as a potential resolution.">
    <meta name="keywords" content="Information Paradox, Black Hole, Hawking Radiation, Holographic Principle, Entropy, Child Universe, Quantum Gravity, Physics Simulation">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #c9d1d9;
            --secondary-color: #161b22;
            --accent-color: #ffca28; /* A golden yellow for information/energy */
            --highlight-color: #f78166; /* An orange for paradox/danger */
            --border-color: #30363d;
            --font-family: 'Exo 2', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.8;
            font-size: 18px;
        }
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; color: var(--accent-color); font-weight: 700; }
        h2 { font-size: 2em; color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        h3 { font-size: 1.5em; color: var(--highlight-color); margin-top: 30px; }
        .panel {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            align-items: flex-start;
        }
        .viz-item {
            background-color: #000;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            position: relative;
            height: 800px;
            overflow: hidden;
        }
        .viz-item canvas { width: 100%; height: 100%; display: block; }
        .controls-column .panel { position: sticky; top: 20px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: var(--primary-color); }
        button {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1em;
            transition: background-color 0.3s ease;
            font-weight: bold;
        }
        button.paradox-btn { background-color: var(--highlight-color); }
        button:hover { filter: brightness(1.2); }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .metric-item { background-color: #0d1117; padding: 15px; border-radius: 5px; border-left: 3px solid var(--highlight-color); }
        .metric-item strong { display: block; color: var(--accent-color); font-size: 0.9em; }
        .metric-item span { font-family: var(--font-mono); font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Simulation: The Black Hole Information Paradox</h1>
            <p>Where Does the Information Go?</p>
        </header>

        <div class="main-layout">
            <div class="simulation-column">
                <div class="panel">
                    <div class="viz-item">
                        <canvas id="main-canvas"></canvas>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>

            <div class="controls-column">
                <div class="panel">
                    <h3>Experiment Controls</h3>
                    <div class="control-group">
                        <label>Object to Drop:</label>
                        <button id="drop-book-btn">Drop Book (Complex Info)</button>
                        <button id="drop-cat-btn">Drop Cat (Quantum State)</button>
                    </div>
                    <div class="control-group">
                        <label>Black Hole Fate:</label>
                        <button id="evaporate-btn" class="paradox-btn">Evaporate (Paradox)</button>
                        <button id="bounce-btn">Bounce (Child Universe)</button>
                    </div>
                     <button id="reset-sim-btn">Reset Simulation</button>
                </div>
                <div class="panel">
                    <h3>Black Hole Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <strong>BH Mass</strong>
                            <span id="metric-mass">10.0 M☉</span>
                        </div>
                        <div class="metric-item">
                            <strong>BH Entropy (Bits)</strong>
                            <span id="metric-entropy">1.0e78</span>
                        </div>
                        <div class="metric-item">
                            <strong>Information Inside</strong>
                            <span id="metric-info-in">0</span>
                        </div>
                        <div class="metric-item">
                            <strong>Information Out</strong>
                            <span id="metric-info-out">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            fate: null, // 'evaporate' or 'bounce'
        },
        state: {
            mass: 10,
            infoIn: [],
            infoOut: [],
            hawkingRadiation: [],
            time: 0,
        },
        elements: {},
        ctx: null,

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.gameLoop();
        },

        cacheDOMElements() {
            this.elements = {
                canvas: document.getElementById('main-canvas'),
                dropBookBtn: document.getElementById('drop-book-btn'),
                dropCatBtn: document.getElementById('drop-cat-btn'),
                evaporateBtn: document.getElementById('evaporate-btn'),
                bounceBtn: document.getElementById('bounce-btn'),
                resetBtn: document.getElementById('reset-sim-btn'),
                metricMass: document.getElementById('metric-mass'),
                metricEntropy: document.getElementById('metric-entropy'),
                metricInfoIn: document.getElementById('metric-info-in'),
                metricInfoOut: document.getElementById('metric-info-out'),
            };
            this.ctx = this.elements.canvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.dropBookBtn.addEventListener('click', () => this.dropInfo('book'));
            this.elements.dropCatBtn.addEventListener('click', () => this.dropInfo('cat'));
            this.elements.evaporateBtn.addEventListener('click', () => this.config.fate = 'evaporate');
            this.elements.bounceBtn.addEventListener('click', () => this.config.fate = 'bounce');
            this.elements.resetBtn.addEventListener('click', () => this.reset());
        },

        reset() {
            this.state = { mass: 10, infoIn: [], infoOut: [], hawkingRadiation: [], time: 0 };
            this.config.fate = null;
        },

        dropInfo(type) {
            const w = this.ctx.canvas.width;
            const h = this.ctx.canvas.height;
            this.state.infoIn.push({
                type: type,
                color: type === 'book' ? '#448aff' : '#ff5252',
                x: w * (0.1 + Math.random()*0.2),
                y: h * 0.1,
                vx: 1, vy: 1,
                swallowed: false,
            });
            this.state.mass += (type === 'book' ? 0.1 : 0.2);
        },

        step(dt) {
            this.state.time += dt;
            const w = this.ctx.canvas.width;
            const h = this.ctx.canvas.height;
            const horizonRadius = this.getHorizonRadius();

            // Move info particles
            this.state.infoIn.forEach(p => {
                if (p.swallowed) return;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                const dist = Math.hypot(p.x - w/2, p.y - h/2);
                if (dist < horizonRadius) {
                    p.swallowed = true;
                }
            });

            if (this.config.fate === 'evaporate' && this.state.mass > 0.1) {
                this.state.mass -= 0.01 * dt;
                if(Math.random() < 0.2) {
                    const angle = Math.random() * 2 * Math.PI;
                    this.state.hawkingRadiation.push({
                        x: w/2 + Math.cos(angle) * horizonRadius,
                        y: h/2 + Math.sin(angle) * horizonRadius,
                        vx: Math.cos(angle) * 2,
                        vy: Math.sin(angle) * 2,
                        life: 1.0,
                    });
                }
            }

            if (this.config.fate === 'bounce' && this.state.mass < 1) {
                // Transfer info to child universe
                this.state.infoOut.push(...this.state.infoIn);
                this.state.infoIn = [];
                this.state.mass = 0;
                this.config.fate = 'bounced';
            }

            this.state.hawkingRadiation.forEach(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= 0.01 * dt;
            });
            this.state.hawkingRadiation = this.state.hawkingRadiation.filter(p => p.life > 0);
        },

        getHorizonRadius() {
            return this.state.mass * 15;
        },

        updateMetrics() {
            this.elements.metricMass.textContent = `${this.state.mass.toFixed(2)} M☉`;
            const entropy = this.state.mass > 0 ? (this.state.mass**2 * 1e76).toExponential(2) : '0';
            this.elements.metricEntropy.textContent = entropy;
            this.elements.metricInfoIn.textContent = this.state.infoIn.length;
            this.elements.metricInfoOut.textContent = this.state.infoOut.length;
        },

        gameLoop() {
            this.step(1);
            this.draw();
            this.updateMetrics();
            requestAnimationFrame(() => this.gameLoop());
        },

        draw() {
            const ctx = this.ctx;
            const w = ctx.canvas.width = ctx.canvas.clientWidth;
            const h = ctx.canvas.height = ctx.canvas.clientHeight;
            ctx.clearRect(0,0,w,h);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            const horizonRadius = this.getHorizonRadius();

            // Draw Child Universe if bounced
            if (this.config.fate === 'bounced') {
                ctx.fillStyle = 'rgba(195, 232, 141, 0.2)';
                ctx.fillRect(0,0,w,h);
                ctx.font = '32px Exo 2';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.fillText("Child Universe", w/2, h/2 - 40);
                this.state.infoOut.forEach((p, i) => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(w*0.2 + i*40, h*0.7, 10, 0, 2*Math.PI);
                    ctx.fill();
                });
                return;
            }

            // Draw Black Hole
            if (this.state.mass > 0) {
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(w/2, h/2, horizonRadius, 0, 2*Math.PI);
                ctx.fill();
                // Holographic surface
                const numTiles = Math.floor(this.state.mass * 2);
                for(let i=0; i<numTiles*10; i++) {
                    const angle = i * (2*Math.PI) / (numTiles*10);
                    const r = horizonRadius - (i%2)*5;
                    ctx.strokeStyle = `rgba(255, 202, 40, ${0.1 + 0.2 * Math.random()})`;
                    ctx.beginPath();
                    ctx.moveTo(w/2 + Math.cos(angle)*r, h/2 + Math.sin(angle)*r);
                    ctx.lineTo(w/2 + Math.cos(angle+0.1)*r, h/2 + Math.sin(angle+0.1)*r);
                    ctx.stroke();
                }
            }

            // Draw info particles
            this.state.infoIn.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 10, 0, 2*Math.PI);
                ctx.fill();
            });

            // Draw Hawking radiation
            this.state.hawkingRadiation.forEach(p => {
                ctx.fillStyle = `rgba(200, 200, 200, ${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, 2*Math.PI);
                ctx.fill();
            });
        },

        injectTextContent() {
            const content = `
                <h2>The Black Hole Information Paradox: A Cosmic Crisis</h2>
                <p>At the heart of modern theoretical physics lies a profound conflict, a deep contradiction between its two greatest pillars: Einstein's General Relativity and Quantum Mechanics. This is the <strong>Black Hole Information Paradox</strong>. On one hand, a core tenet of quantum mechanics is <strong>unitarity</strong>, which implies that information can never be truly destroyed. The quantum state of a system may be scrambled and rearranged, but its underlying information must be conserved. On the other hand, Stephen Hawking's groundbreaking calculations in the 1970s showed that black holes are not truly "black"—they slowly "evaporate" by emitting thermal radiation. This <strong>Hawking radiation</strong>, he argued, is perfectly random and contains no information about what fell into the black hole. As the black hole evaporates completely, the information about everything that ever formed it seems to vanish from the universe, violating quantum mechanics. This is the paradox.</p>
                <p>This simulation allows you to explore this conflict. You can drop objects carrying information (like a "book" or a "cat," each representing a unique quantum state) into a black hole. You can then choose its fate: either it evaporates via Hawking radiation, leading to the paradox, or it "bounces" to form a child universe, a potential resolution to the paradox.</p>

                <h2>Entropy and the Holographic Principle</h2>
                <p>Before Hawking, Jacob Bekenstein had already made a startling discovery: black holes have entropy. The entropy of a system is a measure of its disorder, or more precisely, the amount of information required to describe its microscopic state. Bekenstein found that a black hole's entropy is not proportional to its volume, but to the surface area of its event horizon. This was the first clue that something strange was afoot.</p>
                <p>This led Gerard 't Hooft and Leonard Susskind to formulate the <strong>Holographic Principle</strong>, one of the most profound and counter-intuitive ideas in physics. It suggests that the information content of any three-dimensional volume of space is fully encoded on its two-dimensional boundary. In this simulation, the event horizon is visualized as a tiled surface. As you drop information in, the black hole's mass and horizon area increase, and so does its entropy, represented by the number of "holographic tiles." The information you dropped is thought to be "stored" or "scrambled" on this surface.</p>

                <h2>Visualizing the Paradox and a Potential Solution</h2>
                <p>You can run two different scenarios in this simulation to understand the core of the problem and its potential solution:</p>
                <ol>
                    <li><strong>The Paradox (Hawking Evaporation):</strong> If you choose "Evaporate," the black hole will slowly lose mass by emitting generic, information-free Hawking radiation (the small gray particles). The information you dropped in (the colored "book" or "cat" particles) remains trapped inside. Eventually, the black hole evaporates completely, and the information is gone forever. This violates quantum mechanics and represents the paradox.</li>
                    <li><strong>A Resolution (Child Universe Bounce):</strong> If you choose "Bounce," the black hole evaporates until it reaches the tiny "Planck scale," where quantum gravity effects dominate. Instead of disappearing, it undergoes a quantum bounce. In this scenario, the information is not destroyed; it is transferred into a new, causally disconnected spacetime—a child universe. From our perspective, the information is lost, but from the multiverse's perspective, it is conserved, satisfying the laws of quantum mechanics.</li>
                </ol>
                <p>While the child universe hypothesis is highly speculative, it provides an elegant, albeit untestable, way out of the information paradox. It suggests that the paradox arises from taking a limited, single-universe perspective. The mainstream view today leans towards the idea that information is somehow subtly encoded in the correlations within the Hawking radiation, but the exact mechanism remains a subject of intense debate, with other radical ideas like "firewalls" also in contention.</p>

                <h2>Q&A: A Tangle of Information</h2>
                <div class="qa-item">
                    <strong>1. What do you mean by "information" in physics?</strong>
                    <p>In this context, "information" refers to the complete quantum state of a system. It's the set of all properties—particle types, positions, momenta, spins, etc.—that would allow you to distinguish it from any other system. The principle of unitarity in quantum mechanics states that if you know the complete quantum state of a system at one time, you can, in principle, calculate its exact state at any other time in the past or future. The destruction of information would make this impossible.</p>
                </div>
                <div class="qa-item">
                    <strong>2. What is Hawking Radiation?</strong>
                    <p>It's thermal radiation predicted to be spontaneously emitted by black holes due to quantum effects near the event horizon. In the quantum vacuum, pairs of "virtual" particles and anti-particles are constantly being created and then annihilating each other. Near an event horizon, it's possible for one particle of a pair to fall into the black hole while the other escapes. To an outside observer, it appears as if the black hole is radiating particles. This radiation has a thermal spectrum, meaning it is random and carries very little information.</p>
                </div>
                <!-- ... 18+ more Q&A items ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
