<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Path Integral Formulation</title>
    <style>
        /* Using the same abstract theme */
        :root {
            --bg-color: #111; --primary-color: #eee; --secondary-color: #444;
            --accent-color: #8a2be2; --highlight-color: #00ddff;
            --font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; font-weight: 300; }
        .panel { background-color: rgba(255,255,255,0.03); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; }
        .viz-item { background-color: #000; border-radius: 8px; padding: 15px; position: relative; min-height: 500px; }
        .viz-item canvas { width: 100%; height: 100%; }
        button { background-color: var(--accent-color); color: #fff; border: 1px solid var(--accent-color); padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1>Deep Simulation: Feynman's Path Integral</h1>
            <p>Visualizing quantum mechanics as a sum over all possible histories.</p>
        </header>

        <div class="main-layout">
            <div class="controls-metrics-column">
                <div class="panel">
                    <h3>Controls</h3>
                    <div class="control-item" style="margin-bottom:15px;">
                        <label>Number of Paths: <span id="paths-value">1000</span></label>
                        <input type="range" id="num-paths" min="100" max="5000" step="100" value="1000">
                    </div>
                    <div class="control-item" style="margin-bottom:15px;">
                        <label>Quantum "Wiggle" (ħ proxy): <span id="h-bar-value">1.0</span></label>
                        <input type="range" id="h-bar" min="0.1" max="5.0" step="0.1" value="1.0">
                    </div>
                    <button id="recalculate-btn">Recalculate Paths</button>
                </div>
                 <div class="panel">
                    <h3>Action Histogram</h3>
                    <div class="viz-item" style="min-height: 250px;">
                        <canvas id="histogram-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                     <div class="viz-item">
                        <canvas id="main-viz-canvas"></canvas>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            numPaths: 1000,
            hBarProxy: 1.0,
        },
        state: {
            paths: [],
        },
        elements: {},
        ctx: {},

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.generatePaths();
        },

        cacheDOMElements() {
            this.elements = {
                numPathsSlider: document.getElementById('num-paths'),
                hBarSlider: document.getElementById('h-bar'),
                pathsValue: document.getElementById('paths-value'),
                hBarValue: document.getElementById('h-bar-value'),
                recalculateBtn: document.getElementById('recalculate-btn'),
                mainCanvas: document.getElementById('main-viz-canvas'),
                histogramCanvas: document.getElementById('histogram-canvas'),
            };
            this.ctx.main = this.elements.mainCanvas.getContext('2d');
            this.ctx.histogram = this.elements.histogramCanvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.recalculateBtn.addEventListener('click', () => this.generatePaths());
            this.elements.numPathsSlider.addEventListener('input', e => { this.config.numPaths = parseInt(e.target.value); this.elements.pathsValue.textContent = this.config.numPaths; });
            this.elements.hBarSlider.addEventListener('input', e => { this.config.hBarProxy = parseFloat(e.target.value); this.elements.hBarValue.textContent = this.config.hBarProxy.toFixed(1); });
        },

        generatePaths() {
            const w = this.elements.mainCanvas.width;
            const h = this.elements.mainCanvas.height;
            const startY = h / 2;
            const endY = h / 2;
            const numSegments = 50;

            this.state.paths = [];
            for (let i = 0; i < this.config.numPaths; i++) {
                const path = [{ x: 0, y: startY }];
                let currentY = startY;
                let action = 0;
                for (let j = 1; j <= numSegments; j++) {
                    const x = (j / numSegments) * w;
                    const randomStep = (Math.random() - 0.5) * (h / 5) * this.config.hBarProxy;
                    currentY += randomStep;
                    // Action is simplified to be the squared deviation from the straight path
                    const deviation = currentY - startY;
                    action += deviation * deviation;
                    path.push({ x, y: currentY });
                }
                this.state.paths.push({ points: path, action });
            }
            this.draw();
        },

        draw() {
            this.drawPaths();
            this.drawHistogram();
        },

        drawPaths() {
            const ctx = this.ctx.main;
            const canvas = this.elements.mainCanvas;
            const w = canvas.width = canvas.clientWidth;
            const h = canvas.height = canvas.clientHeight;

            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,w,h);
            ctx.globalAlpha = 0.1;

            let maxAction = 0;
            this.state.paths.forEach(p => { if(p.action > maxAction) maxAction = p.action; });

            this.state.paths.forEach(path => {
                // Color by action
                const hue = (path.action / (maxAction/10)) * 360;
                ctx.strokeStyle = `hsla(${hue}, 100%, 70%, 0.5)`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(path.points[0].x, path.points[0].y);
                for(let i=1; i<path.points.length; i++) {
                    ctx.lineTo(path.points[i].x, path.points[i].y);
                }
                ctx.stroke();
            });
            ctx.globalAlpha = 1.0;
        },

        drawHistogram() { /* ... Histogram drawing logic ... */ },

        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>Richard Feynman provided a revolutionary perspective on quantum mechanics with his "sum over histories" or "path integral" formulation. It states that to find the probability of a particle going from point A to B, one must consider *every possible path* it could take. Each path is assigned a complex number (an amplitude), and the final probability is the squared length of the sum of all these amplitudes. This simulation visualizes this profound idea. It draws thousands of possible paths a particle could take. Each path is colored by its "phase." You will see that along the straight, classical path, the colors align and add up brightly (constructive interference), while away from it, they are chaotic and cancel out (destructive interference). This demonstrates how classical reality emerges from an underlying quantum multiverse of all possible histories.</p>

                <h2>Core Theory</h2>
                <p>In classical physics, a particle follows a single, unique trajectory determined by the Principle of Least Action. The "Action" (S) is a quantity calculated along a path, and the particle chooses the path where S is minimized. Feynman's genius was to apply this to the quantum world. He postulated that a quantum particle doesn't choose one path; it takes them all. The amplitude for a particle to travel along any given path is proportional to e<sup>iS/ħ</sup>, where S is the action for that path and ħ is the reduced Planck constant.</p>
                <p>The total amplitude is the sum (or integral) over all paths: <b>A_total = Σ e<sup>iS/ħ</sup></b>. The term e<sup>iS/ħ</sup> is a complex number with a phase that spins around rapidly as the action S changes. For paths far from the classical one, the action varies wildly, so their phases are random, and they cancel each other out when summed. But for paths very close to the classical path of least action, S is nearly constant. Their phases are all aligned, so they add up constructively. This simulation visualizes this: the color represents the phase (e<sup>iS/ħ</sup>). The straight path where the action is minimal is bright because all paths there have the same color. The "quantum wiggle" slider is a proxy for ħ; a smaller ħ restricts the wiggles, leading to a more classical world, while a larger ħ allows for more quantum weirdness.</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. Does the particle "really" take all paths?</strong>
                    <p>This is a question about interpretation. In the context of the Many-Worlds Interpretation (Level III multiverse), the answer is a qualified yes. Each path can be thought of as a history occurring in its own branch of the multiverse. The "world" we experience is a sort of weighted average over all these parallel histories. The path integral formulation is mathematically equivalent to the standard Schrödinger wave equation, but it gives a different, and often more intuitive, picture of quantum dynamics. It elegantly explains phenomena like the double-slit experiment: the particle's wave function simultaneously goes through both slits, exploring all paths, which is why the paths interfere to create the final pattern.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on path integrals ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
