<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Universe from a Quantum Fluctuation</title>
    <meta name="description" content="An interactive simulation of a 'baby universe' tunneling into existence from a quantum fluctuation in a parent universe's false vacuum.">
    <meta name="keywords" content="Quantum Fluctuation, Universe Creation, False Vacuum, Quantum Tunneling, Inflaton, Eternal Inflation, Cosmology, Physics Simulation">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-color: #c9d1d9;
            --secondary-color: #161b22;
            --accent-color: #a371f7; /* A mystical purple */
            --highlight-color: #00bcd4; /* A vibrant cyan */
            --border-color: #30363d;
            --font-family: 'Exo 2', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.8;
            font-size: 18px;
        }
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3em; color: var(--accent-color); font-weight: 700; }
        h2 { font-size: 2em; color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        h3 { font-size: 1.5em; color: var(--highlight-color); margin-top: 30px; }
        .panel {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            align-items: flex-start;
        }
        .viz-container { display: grid; grid-template-columns: 1fr; grid-template-rows: 450px 350px; gap: 20px; }
        .viz-item {
            background-color: #000;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        .viz-item canvas { width: 100%; height: 100%; display: block; }
        .controls-column .panel { position: sticky; top: 20px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: var(--primary-color); }
        input[type="range"] { width: 100%; }
        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }
        button:hover { background-color: var(--highlight-color); }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .metric-item { background-color: #0d1117; padding: 15px; border-radius: 5px; border-left: 3px solid var(--highlight-color); }
        .metric-item strong { display: block; color: var(--accent-color); font-size: 0.9em; }
        .metric-item span { font-family: var(--font-mono); font-size: 1.2em; }
        .qa-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--highlight-color);
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Deep Simulation: Universe from a Quantum Fluctuation</h1>
            <p>Visualizing the Birth of a Baby Universe via False Vacuum Tunneling</p>
        </header>

        <div class="main-layout">
            <div class="simulation-column">
                <div class="panel">
                    <div class="viz-container">
                        <div class="viz-item" id="potential-viz">
                             <canvas id="potential-canvas"></canvas>
                        </div>
                        <div class="viz-item" id="universe-viz">
                            <canvas id="universe-canvas"></canvas>
                        </div>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>

            <div class="controls-column">
                <div class="panel">
                    <h3>Potential Landscape Controls</h3>
                    <div class="control-group">
                        <label for="barrier-height">Potential Barrier Height</label>
                        <input type="range" id="barrier-height" min="10" max="100" step="1" value="50">
                        <span id="barrier-height-value">50</span>
                    </div>
                    <div class="control-group">
                        <label for="false-vacuum-energy">False Vacuum Energy</label>
                        <input type="range" id="false-vacuum-energy" min="5" max="50" step="1" value="20">
                        <span id="false-vacuum-energy-value">20</span>
                    </div>
                    <button id="reset-sim-btn">Reset Simulation</button>
                </div>
                <div class="panel">
                    <h3>Live Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <strong>Field Value (φ)</strong>
                            <span id="metric-field-value">0.00</span>
                        </div>
                        <div class="metric-item">
                            <strong>Tunneling Probability</strong>
                            <span id="metric-tunnel-prob">1.2e-6</span>
                        </div>
                        <div class="metric-item">
                            <strong>Baby Universe Status</strong>
                            <span id="metric-baby-status">Dormant</span>
                        </div>
                        <div class="metric-item">
                            <strong>Inflationary Scale Factor</strong>
                            <span id="metric-baby-scale">1.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const SimApp = {
        config: {
            barrierHeight: 50,
            falseVacuumEnergy: 20,
        },
        state: {
            fieldValue: 150, // Start in false vacuum
            fieldVelocity: 0,
            time: 0,
            tunnelingOccurred: false,
            babyUniverse: { scale: 0, time: 0 }
        },
        elements: {},
        ctx: { potential: null, universe: null },

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.gameLoop();
        },

        cacheDOMElements() {
            this.elements = {
                potentialCanvas: document.getElementById('potential-canvas'),
                universeCanvas: document.getElementById('universe-canvas'),
                barrierSlider: document.getElementById('barrier-height'),
                barrierValue: document.getElementById('barrier-height-value'),
                vacuumSlider: document.getElementById('false-vacuum-energy'),
                vacuumValue: document.getElementById('false-vacuum-energy-value'),
                resetBtn: document.getElementById('reset-sim-btn'),
                metricFieldValue: document.getElementById('metric-field-value'),
                metricTunnelProb: document.getElementById('metric-tunnel-prob'),
                metricBabyStatus: document.getElementById('metric-baby-status'),
                metricBabyScale: document.getElementById('metric-baby-scale'),
            };
            this.ctx.potential = this.elements.potentialCanvas.getContext('2d');
            this.ctx.universe = this.elements.universeCanvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.barrierSlider.addEventListener('input', e => {
                this.config.barrierHeight = parseInt(e.target.value);
                this.elements.barrierValue.textContent = this.config.barrierHeight;
            });
            this.elements.vacuumSlider.addEventListener('input', e => {
                this.config.falseVacuumEnergy = parseInt(e.target.value);
                this.elements.vacuumValue.textContent = this.config.falseVacuumEnergy;
            });
            this.elements.resetBtn.addEventListener('click', () => this.reset());
        },

        reset() {
            this.state.fieldValue = 150;
            this.state.fieldVelocity = 0;
            this.state.time = 0;
            this.state.tunnelingOccurred = false;
            this.state.babyUniverse = { scale: 0, time: 0 };
        },

        getPotential(x) {
            const w = this.elements.potentialCanvas.width;
            const trueMinX = w * 0.8;
            const falseMinX = w * 0.2;
            const barrierX = w * 0.5;

            // True vacuum (quartic)
            const V_true = 0.0001 * Math.pow(x - trueMinX, 4);
            // False vacuum (quadratic)
            const V_false = this.config.falseVacuumEnergy + 0.05 * Math.pow(x - falseMinX, 2);
            // Barrier (Gaussian)
            const V_barrier = this.config.barrierHeight * Math.exp(-0.001 * Math.pow(x - barrierX, 2));

            return V_true + V_false + V_barrier;
        },

        step(dt) {
            this.state.time += dt;
            if (this.state.tunnelingOccurred) {
                this.state.babyUniverse.time += dt;
                // Exponential growth (inflation)
                this.state.babyUniverse.scale = Math.exp(this.state.babyUniverse.time * Math.sqrt(this.config.falseVacuumEnergy) * 0.1);
            } else {
                // Jiggle in the false vacuum
                const w = this.elements.potentialCanvas.width;
                const falseMinX = w * 0.2;
                const restoringForce = -0.01 * (this.state.fieldValue - falseMinX);
                const quantumJiggle = (Math.random() - 0.5) * 5;
                this.state.fieldVelocity += restoringForce;
                this.state.fieldVelocity *= 0.9; // Damping
                this.state.fieldValue += this.state.fieldVelocity + quantumJiggle;

                // Check for tunneling
                const tunnelProb = this.calculateTunnelingProbability();
                if (Math.random() < tunnelProb) {
                    this.state.tunnelingOccurred = true;
                    this.state.fieldValue = this.elements.potentialCanvas.width * 0.8; // Emerge in true vacuum
                }
            }
        },

        calculateTunnelingProbability() {
            // Simplified Gamow factor: P ~ exp(-sqrt(V_barrier))
            const prob = Math.exp(-Math.sqrt(this.config.barrierHeight) * (12 - Math.log(this.config.falseVacuumEnergy)));
            return prob * 1e-3; // Scale for simulation
        },

        updateMetrics() {
            this.elements.metricFieldValue.textContent = ((this.state.fieldValue / this.elements.potentialCanvas.width - 0.5)*10).toFixed(2);
            this.elements.metricTunnelProb.textContent = this.calculateTunnelingProbability().toExponential(2);
            if(this.state.tunnelingOccurred) {
                this.elements.metricBabyStatus.textContent = "Inflating!";
                this.elements.metricBabyScale.textContent = this.state.babyUniverse.scale.toExponential(2);
            } else {
                this.elements.metricBabyStatus.textContent = "Dormant";
                this.elements.metricBabyScale.textContent = "---";
            }
        },

        gameLoop() {
            this.step(0.1);
            this.draw();
            this.updateMetrics();
            requestAnimationFrame(() => this.gameLoop());
        },

        drawPotential() {
            const ctx = this.ctx.potential;
            const w = this.elements.potentialCanvas.width = this.elements.potentialCanvas.clientWidth;
            const h = this.elements.potentialCanvas.height = this.elements.potentialCanvas.clientHeight;
            ctx.clearRect(0,0,w,h);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            // Draw potential curve
            ctx.strokeStyle = 'var(--accent-color)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let x=0; x<w; x++) {
                const y = h - this.getPotential(x);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Draw field particle
            const particleX = this.state.fieldValue;
            const particleY = h - this.getPotential(particleX);
            ctx.fillStyle = 'var(--highlight-color)';
            ctx.beginPath();
            ctx.arc(particleX, particleY, 8, 0, 2*Math.PI);
            ctx.fill();

            // Labels
            ctx.font = '14px Exo 2';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText("False Vacuum", w * 0.2, h - 10);
            ctx.fillText("True Vacuum", w * 0.8, h - 10);
            ctx.fillText("Potential Energy V(φ)", w/2, 20);
            ctx.fillText("Field Value φ", w/2, h - 30);
        },

        drawUniverse() {
            const ctx = this.ctx.universe;
            const w = this.elements.universeCanvas.width = this.elements.universeCanvas.clientWidth;
            const h = this.elements.universeCanvas.height = this.elements.universeCanvas.clientHeight;
            ctx.clearRect(0,0,w,h);

            // Draw parent universe background
            const parentBg = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, w);
            parentBg.addColorStop(0, `rgba(163, 113, 247, 0.1)`);
            parentBg.addColorStop(1, `rgba(163, 113, 247, 0.0)`);
            ctx.fillStyle = parentBg;
            ctx.fillRect(0,0,w,h);
            ctx.font = '16px Exo 2';
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.textAlign = 'center';
            ctx.fillText("Parent Universe Spacetime", w/2, 30);

            if(this.state.tunnelingOccurred) {
                const radius = this.state.babyUniverse.scale * 2;
                ctx.beginPath();
                ctx.arc(w/2, h/2, radius, 0, 2 * Math.PI);

                const babyGradient = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, radius);
                babyGradient.addColorStop(0, `rgba(0, 188, 212, 0.8)`);
                babyGradient.addColorStop(1, `rgba(0, 188, 212, 0.2)`);
                ctx.fillStyle = babyGradient;
                ctx.fill();

                ctx.strokeStyle = 'var(--highlight-color)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = 'white';
                ctx.fillText("Baby Universe", w/2, h/2);
            }
        },

        draw() {
            this.drawPotential();
            this.drawUniverse();
        },

        injectTextContent() {
            const content = `
                <h2>The Universe from Nothing: A Quantum Free Lunch</h2>
                <p>Where did our universe come from? The standard Big Bang model describes how the universe evolved from a hot, dense state, but it doesn't explain the origin of that state itself. One of the most profound and mind-bending ideas in modern cosmology is that our entire universe may have arisen from a random quantum fluctuation in a pre-existing space, or perhaps from literally "nothing." This concept, often called the "universe as a free lunch," was pioneered by physicists like Edward Tryon, Alan Guth, and Alexander Vilenkin. It hinges on two core principles of physics: the bizarre nature of the quantum vacuum and the unique properties of gravity.</p>
                <p>In classical physics, "nothing" is simple: the absence of stuff, space, and time. In quantum field theory, "nothing"—the vacuum—is a bubbling, seething cauldron of activity. It is filled with "virtual particles" that flicker in and out of existence, governed by the uncertainty principle. The vacuum possesses a certain amount of energy, known as vacuum energy. This simulation explores how a patch of this vacuum, in a high-energy state called a "false vacuum," could randomly fluctuate and, through a process called <strong>quantum tunneling</strong>, spontaneously blossom into a new, rapidly expanding baby universe like our own.</p>

                <h2>The Inflaton Field and its Potential</h2>
                <p>To understand this, we must think of the vacuum not just as empty space, but as the lowest energy state of one or more quantum fields. The key player in this story is a hypothetical scalar field called the <strong>inflaton field</strong>, which permeates all of space. Like all fields, it has a value at every point and possesses potential energy, described by a potential energy curve V(φ), where φ is the field's value. This simulation's main visualization shows such a potential curve.</p>
                <ul>
                    <li><strong>True Vacuum:</strong> This is the state of lowest possible energy, a stable, global minimum on the potential curve. A universe in the true vacuum might have a very small amount of vacuum energy (like our current universe seems to).</li>
                    <li><strong>False Vacuum:</strong> This is a "metastable" state—a local minimum on the curve, but not the lowest one. A patch of space can get "stuck" in this state, possessing a very high vacuum energy. This high energy acts like a powerful, repulsive gravity, as described by Einstein's equations.</li>
                </ul>
                <p>The simulation begins with the field value (the dot) jiggling around in the false vacuum well. This jiggling represents the inherent quantum uncertainty of the field. Classically, the field is trapped. It doesn't have enough energy to roll up and over the potential barrier to get to the true vacuum. But in quantum mechanics, there's another way: tunneling.</p>

                <h2>Quantum Tunneling and the Birth of a Universe</h2>
                <p><strong>Quantum tunneling</strong> is a real, observed phenomenon where a particle can pass through a barrier that it classically shouldn't be able to overcome. It's as if a ball in a valley could spontaneously appear in an adjacent, lower valley without ever rolling over the hill between them. The probability of this happening is very low, and it depends sensitively on the height and width of the barrier.</p>
                <p>In cosmology, a small patch of the false vacuum can tunnel through the potential barrier. When this happens, a "bubble" of true vacuum is formed within the parent space of false vacuum. From the inside, this bubble appears as a new universe. The immense difference in energy density between the false vacuum outside and the true vacuum inside is what drives the process. This energy is dumped into the bubble wall and the bubble's interior, creating the particles and radiation of a hot Big Bang and, crucially, causing the bubble of spacetime itself to expand at an astonishing, exponential rate. This period of hyper-expansion is what we call <strong>cosmic inflation</strong>. The lower visualization, "Baby Universe," shows this process: once tunneling occurs, a new universe appears and begins to inflate, its scale factor growing exponentially.</p>

                <h2>The Zero-Energy Universe</h2>
                <p>But how can a whole universe, with all its matter and energy, come from nothing without violating the law of conservation of energy? The answer lies in the peculiar nature of gravity. The total energy of the universe can be thought of as having two components: the positive energy of matter and radiation, and the negative potential energy of the gravitational field that binds it all together. Remarkably, for a closed universe, these two values can cancel out perfectly, leading to a total energy of exactly zero. An object with zero total energy can, according to the uncertainty principle, exist for an indefinite amount of time. The universe, in this sense, is the ultimate free lunch.</p>

                <h2>Eternal Inflation: A Multiverse of Bubbles</h2>
                <p>This process might not be a one-time event. The parent space, filled with the false vacuum, is itself inflating at a tremendous rate. While bubbles of true vacuum (like our universe) are constantly forming via tunneling, the space between them is expanding even faster. This means the false vacuum is never fully used up. Each bubble becomes a universe, and within that universe, new fluctuations can occur. And in the parent space, new bubbles are constantly forming. This leads to the concept of <strong>eternal inflation</strong>, a scenario where the creation of universes is an ongoing, endless process, resulting in a vast, fractal-like "multiverse" of bubble universes, each with potentially different properties.</p>

                <h2>Q&A: Probing the Void</h2>
                <div class="qa-item">
                    <strong>1. What is the "parent universe"?</strong>
                    <p>It's the hypothetical space in which the quantum fluctuation that created our universe occurred. In the context of eternal inflation, it would be a vast, inflating region of space in a false vacuum state. We can never access it or observe it directly, as our own inflating bubble of spacetime has causally disconnected from it.</p>
                </div>
                <div class="qa-item">
                    <strong>2. Is this theory testable?</strong>
                    <p>Directly testing the existence of a parent universe is likely impossible. However, the scenario makes predictions for our own universe. Specifically, the process of tunneling and subsequent inflation should leave faint imprints on the cosmic microwave background (CMB). For instance, some models predict that if our bubble universe ever collided with another, it would leave a "bruise" in the form of a specific circular pattern in the CMB temperature. Searches for such patterns have so far been inconclusive.</p>
                </div>
                <!-- ... 18+ more Q&A items ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
