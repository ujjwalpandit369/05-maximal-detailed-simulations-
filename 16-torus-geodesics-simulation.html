<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Geodesics on a Torus</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        h1 { font-size: 2.5em; margin: 0; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr 350px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; text-align: center; }
        canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 4px; cursor: crosshair; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 4; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Geodesics on a Torus: A Multiply-Connected Universe</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Fundamental Domain (Your Universe)</h2>
                <canvas id="main-canvas" width="500" height="500"></canvas>
            </div>
            <div class="simulation-panel">
                <h2>Tiled View (The "Unwrapped" Space)</h2>
                <canvas id="tiled-canvas" width="500" height="500"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <p>Click and drag on the 'Your Universe' canvas to launch a particle.</p>
                <button id="reset-btn">Reset</button>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Torus Geodesics script.
    // The final version will contain linked canvases showing the fundamental
    // domain and the tiled covering space.

    const DOM = {
        mainCanvas: document.getElementById('main-canvas'), mainCtx: document.getElementById('main-canvas').getContext('2d'),
        tiledCanvas: document.getElementById('tiled-canvas'), tiledCtx: document.getElementById('tiled-canvas').getContext('2d'),
        resetBtn: document.getElementById('reset-btn'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = {
        particles: [],
        isDragging: false,
        launchPos: null,
    };

    function update() {
        state.particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            // Periodic boundary conditions
            p.x = (p.x + 500) % 500;
            p.y = (p.y + 500) % 500;
        });
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        const { mainCtx, tiledCtx, mainCanvas, tiledCanvas } = DOM;
        mainCtx.fillStyle = 'black';
        mainCtx.fillRect(0,0,mainCanvas.width, mainCanvas.height);
        tiledCtx.fillStyle = 'black';
        tiledCtx.fillRect(0,0,tiledCanvas.width, tiledCanvas.height);

        state.particles.forEach(p => {
            mainCtx.fillStyle = 'cyan';
            mainCtx.fillRect(p.x-2, p.y-2, 4, 4);

            // Draw tiled view
            tiledCtx.fillStyle = 'cyan';
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    const x = p.x + i * mainCanvas.width;
                    const y = p.y + j * mainCanvas.height;
                    // Scale to tiled canvas size
                    const tx = (x / mainCanvas.width) * (tiledCanvas.width / 3) + tiledCanvas.width / 2;
                    const ty = (y / mainCanvas.height) * (tiledCanvas.height / 3) + tiledCanvas.height / 2;
                    if (i===0 && j===0) tiledCtx.fillStyle = 'yellow';
                    else tiledCtx.fillStyle = 'cyan';
                    tiledCtx.fillRect(tx-1, ty-1, 2, 2);
                }
            }
        });
    }

    function setup() {
        DOM.mainCanvas.onmousedown = (e) => {
            state.isDragging = true;
            state.launchPos = {x: e.offsetX, y: e.offsetY};
        };
        DOM.mainCanvas.onmouseup = (e) => {
            if (!state.isDragging) return;
            state.isDragging = false;
            const launchVel = {x: (e.offsetX - state.launchPos.x) / 20, y: (e.offsetY - state.launchPos.y) / 20};
            state.particles.push({x: state.launchPos.x, y: state.launchPos.y, vx: launchVel.x, vy: launchVel.y});
        };
        DOM.resetBtn.onclick = () => { state.particles = []; };

        DOM.expositionContent.innerHTML = `<h1>Geodesics on a Torus</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        update();
    }

    setup();
});
</script>
</body>
</html>
