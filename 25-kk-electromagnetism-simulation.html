<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Electromagnetism from 5D Gravity</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr 350px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; text-align: center; }
        canvas { width: 100%; height: 500px; display: block; background: #000; border-radius: 4px; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 4; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Unification: Electromagnetism from 5D Gravity</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>5D "Bulk" View</h2>
                <canvas id="bulk-canvas"></canvas>
            </div>
            <div class="simulation-panel">
                <h2>4D "Brane" View (Our Perception)</h2>
                <canvas id="brane-canvas"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <label>5th Dimension "Tilt" (Field Strength): <span id="tilt-value">0.1</span></label>
                <input type="range" id="tilt-slider" min="0" max="1" step="0.05" value="0.1">
                <button id="launch-btn">Launch Particle</button>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Kaluza-Klein force script.
    // The final version will contain linked 3D and 2D projections
    // to visualize how a geodesic in 5D can appear as a curved
    // path under a force in 4D.

    const DOM = {
        bulkCanvas: document.getElementById('bulk-canvas'), bulkCtx: document.getElementById('bulk-canvas').getContext('2d'),
        braneCanvas: document.getElementById('brane-canvas'), braneCtx: document.getElementById('brane-canvas').getContext('2d'),
        tiltSlider: document.getElementById('tilt-slider'), tiltValue: document.getElementById('tilt-value'),
        launchBtn: document.getElementById('launch-btn'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = {
        tilt: 0.1,
        particle: null,
        path5d: [],
        path4d: []
    };

    function launchParticle() {
        state.particle = { x: 0, y: 250, z: 0, vx: 5 }; // z is the 5th dimension coordinate
        state.path5d = [];
        state.path4d = [];
    }

    function update() {
        if (state.particle) {
            // Move particle in a straight line in the "tilted" 5D space
            state.particle.x += state.particle.vx;
            // The "tilt": z coordinate changes with x
            state.particle.z = state.particle.x * state.tilt;

            state.path5d.push({x: state.particle.x, y: state.particle.y, z: state.particle.z});
            state.path4d.push({x: state.particle.x, y: state.particle.y - state.particle.z}); // Project by subtracting z

            if (state.particle.x > DOM.bulkCanvas.width) state.particle = null;
        }
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        const { bulkCtx, bulkCanvas, braneCtx, braneCanvas } = DOM;
        // Draw Bulk (5D)
        bulkCtx.fillStyle = '#000'; bulkCtx.fillRect(0,0,bulkCanvas.width, bulkCanvas.height);
        // Draw Brane (4D)
        braneCtx.fillStyle = '#000'; braneCtx.fillRect(0,0,braneCanvas.width, braneCanvas.height);

        // Draw paths
        drawPath(bulkCtx, state.path5d, true);
        drawPath(braneCtx, state.path4d, false);
    }

    function drawPath(ctx, path, is5d) {
        ctx.strokeStyle = 'cyan';
        ctx.lineWidth = 2;
        ctx.beginPath();
        path.forEach((p, i) => {
            const y = is5d ? p.y - p.z : p.y; // Fake 3D perspective
            if (i === 0) ctx.moveTo(p.x, y);
            else ctx.lineTo(p.x, y);
        });
        ctx.stroke();
    }

    function setup() {
        DOM.tiltSlider.oninput = () => {
            state.tilt = parseFloat(DOM.tiltSlider.value);
            DOM.tiltValue.textContent = state.tilt.toFixed(2);
        };
        DOM.launchBtn.onclick = launchParticle;

        DOM.expositionContent.innerHTML = `<h1>Forces from Geometry</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        launchParticle();
        update();
    }

    setup();
});
</script>
</body>
</html>
