<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Micro Black Holes at the LHC</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        canvas { width: 100%; height: 500px; display: block; background: #000; border-radius: 4px; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Searching for Micro Black Holes</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Particle Detector View</h2>
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <button id="collide-btn">Collide Protons (x1)</button>
                <button id="collide-100-btn">Collide Protons (x100)</button>
                <label>BH Probability: <span id="prob-value">5%</span></label>
                <input type="range" id="prob-slider" min="1" max="50" value="5">
                <div id="metrics"></div>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Micro Black Hole script.
    // The final version will probabilistically generate either a standard
    // jet event or a spherically symmetric black hole decay event.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        collideBtn: document.getElementById('collide-btn'),
        collide100Btn: document.getElementById('collide-100-btn'),
        probSlider: document.getElementById('prob-slider'), probValue: document.getElementById('prob-value'),
        metrics: document.getElementById('metrics'),
        expositionContent: document.getElementById('exposition-content'), qaContent: document.getElementById('qa-content')
    };

    let state = { prob: 0.05, total_collisions: 0, bh_events: 0 };

    function runCollision() {
        state.total_collisions++;
        const { ctx, canvas } = DOM;
        ctx.fillStyle = 'black'; ctx.fillRect(0,0,canvas.width, canvas.height);

        if (Math.random() < state.prob) {
            state.bh_events++;
            // Draw spherical black hole event
            ctx.strokeStyle = 'yellow';
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * 2 * Math.PI;
                ctx.beginPath();
                ctx.moveTo(canvas.width/2, canvas.height/2);
                ctx.lineTo(canvas.width/2 + Math.cos(angle)*500, canvas.height/2 + Math.sin(angle)*500);
                ctx.stroke();
            }
        } else {
            // Draw standard model jet event
            ctx.strokeStyle = 'cyan';
            for (let i = 0; i < 25; i++) {
                const angle = 0.5 + (Math.random()-0.5) * 0.8;
                ctx.beginPath();
                ctx.moveTo(canvas.width/2, canvas.height/2);
                ctx.lineTo(canvas.width/2 + Math.cos(angle)*500, canvas.height/2 + Math.sin(angle)*500);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(canvas.width/2, canvas.height/2);
                ctx.lineTo(canvas.width/2 + Math.cos(angle+Math.PI)*500, canvas.height/2 + Math.sin(angle+Math.PI)*500);
                ctx.stroke();
            }
        }
        updateMetrics();
    }

    function updateMetrics() {
        DOM.metrics.innerHTML = `Total Collisions: ${state.total_collisions}<br>BH Events: ${state.bh_events}`;
    }

    function setup() {
        DOM.canvas.width = 500; DOM.canvas.height = 500;

        DOM.collideBtn.onclick = runCollision;
        DOM.collide100Btn.onclick = () => { for(let i=0; i<100; i++) runCollision(); };
        DOM.probSlider.oninput = (e) => {
            state.prob = parseFloat(e.target.value) / 100;
            DOM.probValue.textContent = `${(state.prob*100).toFixed(0)}%`;
        };

        DOM.expositionContent.innerHTML = `<h1>Searching for Micro Black Holes</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        updateMetrics();
        draw();
    }

    setup();
});
</script>
</body>
</html>
