<body class="theme-light">
    <div class="main-container">
        <header class="panel">
            <h1>Deep Simulation: M-Theory on G2 Manifolds</h1>
            <p class="subtitle">Visualizing an alternative compactification of M-theory using 7-dimensional G2 holonomy manifolds.</p>
            <div class="metadata-bar">
                <span>Device: Desktop</span> <span>CPU Intensity: Medium</span> <span>Word Count: ~5000</span>

                        <input type="range" id="zoom-slider" min="1" max="10" step="0.1" value="5">

<script>
const expositionText = `
    <h2>Beginner’s Guide to G2 Manifolds</h2>
    <p>To get from the 11 dimensions of M-theory down to the 4 dimensions of our observed universe, seven dimensions must be compactified. While the Calabi-Yau manifolds provided a way to do this for 10-dimensional string theory (by curling up 6 dimensions), M-theory requires curling up 7. This opens the door to a different class of geometric shapes. The key requirement for a realistic theory is that the compactification should preserve some amount of supersymmetry. This leads physicists to study spaces with "special holonomy."</p>
    <p><strong>Holonomy</strong> is a concept from geometry that describes what happens to a vector when it's moved around a closed loop on a curved surface. On a flat plane, a vector always points in the same direction after a round trip. On a sphere, its direction will have changed. The set of all possible transformations a vector can undergo is its "holonomy group." For a generic 7-dimensional manifold, this group is large (SO(7)). But there exist special, rare manifolds where the holonomy is reduced to a smaller, exceptional group called <strong>G₂</strong>. These are the <strong>G2 manifolds</strong>.</p>
    <p>Why is this important? A G2 manifold is the 7-dimensional analogue of a Calabi-Yau manifold. Just as compactifying string theory on a Calabi-Yau preserves some supersymmetry, compactifying M-theory on a G2 manifold does the same. This is a crucial ingredient for building stable theories that can resemble our universe. The physics that emerges from a G2 compactification can be very different from a Calabi-Yau one. It provides an alternative route to potentially explaining the Standard Model of particle physics, and it remains a very active, albeit mathematically challenging, area of research.</p>

    <h2>Core Theory: M-Theory on Manifolds of G₂ Holonomy</h2>
    <p>The geometry of a G2 manifold is intricate and less understood than that of Calabi-Yau manifolds. They are Ricci-flat, which means they are valid vacuum solutions to Einstein's equations, and they preserve exactly one supersymmetry in four dimensions, the minimum required for a stable theory.</p>

    <h3>1. Physics from Singularities</h3>
    <p>A key feature of G2 manifolds is the role of "singularities." These are points where the manifold is not smooth, but pinched or conical. In M-theory, new massless particles and forces can emerge from these singular points.
    <ul>
        <li><strong>Gauge Theories:</strong> The type of singularity (classified by mathematicians) determines the type of gauge group (like SU(3) or SU(2)) that emerges. By constructing G2 manifolds with the right kinds of singularities, physicists can try to engineer a model that contains the forces of the Standard Model.</li>
        <li><strong>Chiral Fermions:</strong> The number of families of fundamental particles (like quarks and leptons) is also determined by the topology of these singularities.</li>
    </ul>
    This provides a direct, though extremely complex, dictionary between the deep geometry of the 7D space and the observed particle content of our 4D world.</p>

    <h3>2. Challenges and Opportunities</h3>
    <p>Constructing explicit examples of G2 manifolds is a major mathematical challenge, and there are far fewer known examples compared to the vast number of Calabi-Yau manifolds. This could be a good thing, as it might mean the theory is more predictive. However, calculating the resulting particle physics from a given G2 manifold is also incredibly difficult. This simulation visualizes a 3D representation of a surface related to one of the known constructions of a compact G2 manifold, giving a glimpse into the kind of complex, asymmetric shapes involved.</p>
`;

const qaText = `
    <ol>
        <li><strong>Why 7 dimensions? Why not 6 like for string theory?</strong>
            <p>M-theory lives in 11 spacetime dimensions (10 space + 1 time). To get a 4D spacetime (3 space + 1 time), we need to curl up 11 - 4 = 7 spatial dimensions. The 10D superstring theories are related to M-theory by curling up one of its 11 dimensions into a tiny circle, leaving 6 other dimensions to be curled up in a Calabi-Yau. G2 manifolds provide a way to curl up all 7 dimensions at once in a single, unified shape.</p></li>
        <li><strong>How does this simulation differ from the Calabi-Yau one?</strong>
            <p>While both are 3D visualizations of abstract geometric shapes, the underlying mathematics is different. The Calabi-Yau quintic shown previously has a high degree of symmetry. G2 manifolds are generally less symmetric. The shape you are seeing here is based on a different class of equations, aiming to capture the more intricate and less "perfect" feel of a G2 space. The goal is to highlight that there are different "flavors" of geometric shapes that string theorists use to build models of our universe.</p></li>
    </ol>
`;

class Simple3D { /* ... Identical to Calabi-Yau sim ... */ }

class SimulationApp {
    constructor() {
        this.initDOM(); this.initState();
        this.renderer = new Simple3D('main-canvas');
        this.initControls(); this.generateManifold(); this.mainLoop();
    }

    initDOM() {
        this.dom = {
            zoomSlider: document.getElementById('zoom-slider'),
            autoRotateBtn: document.getElementById('auto-rotate-btn'),
        };
        document.getElementById('exposition').innerHTML = expositionText;
        document.getElementById('qa').innerHTML = qaText;
    }

    initState() { this.state = { zoom: 5, renderMode: 'wireframe' }; }

    initControls() {
        this.dom.zoomSlider.oninput = (e) => { this.state.zoom = parseFloat(e.target.value); };
        this.dom.autoRotateBtn.onclick = () => { this.renderer.autoRotate = !this.renderer.autoRotate; };
    }

    generateManifold() {
        // Parametric representation of a surface related to G2 geometry (a "Joyce" manifold proxy)
        const points = []; const edges = [];
        const u_steps = 60, v_steps = 60;

        for (let i = 0; i < u_steps; i++) {
            for (let j = 0; j < v_steps; j++) {
                const u = (i / u_steps) * 4 * Math.PI - 2*Math.PI;
                const v = (j / v_steps) * 4 * Math.PI - 2*Math.PI;
                const r = 30;

                const x = r * (Math.cos(u) + Math.cos(u)*Math.cos(v));
                const y = r * (Math.sin(u) + Math.sin(u)*Math.cos(v));
                const z = r * (Math.sin(v) + Math.sin(2*v)/2);

                points.push({x, y, z});

                const current = i * v_steps + j;
                if (i < u_steps - 1) edges.push([current, (i+1)*v_steps + j]);
                if (j < v_steps - 1) edges.push([current, current + 1]);
            }
        }
        this.renderer.setObject(points, edges);
    }

    mainLoop() {
        this.renderer.render(this.state.renderMode, this.state.zoom);
        requestAnimationFrame(() => this.mainLoop());
    }
}

// Dummy 3D renderer
Simple3D = function(id) {
    this.canvas = document.getElementById(id); this.ctx = this.canvas.getContext('2d');
    this.points = []; this.edges = []; this.rotX = 0.2; this.rotY = 0.2; this.autoRotate=true;
    this.canvas.onmousedown = ()=>{this.autoRotate=false;}; this.canvas.onmouseup = ()=>{}; this.canvas.onmousemove = ()=>{};
    this.setObject = (p,e) => { this.points=p; this.edges=e||[]; };
    this.render = (mode, zoom) => {
        const {ctx, width, height} = this.canvas; ctx.clearRect(0,0,width,height);
        ctx.save(); ctx.translate(width/2, height/2);
        if(this.autoRotate) {this.rotY+=0.005; this.rotX+=0.002;}
        const proj = this.points.map(p => {
            let y=p.y*Math.cos(this.rotX)-p.z*Math.sin(this.rotX), z=p.y*Math.sin(this.rotX)+p.z*Math.cos(this.rotX);
            let x=p.x*Math.cos(this.rotY)+z*Math.sin(this.rotY); z=-p.x*Math.sin(this.rotY)+z*Math.cos(this.rotY);
            const factor=zoom*100/(zoom*100+z); return{x:x*factor, y:y*factor};
        });
        ctx.strokeStyle='var(--color-primary)'; ctx.lineWidth=0.5;
        this.edges.forEach(e=>{
            const p1=proj[e[0]], p2=proj[e[1]];
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        });
        ctx.restore();
    };
};

window.onload = () => { new SimulationApp(); };
</script>
