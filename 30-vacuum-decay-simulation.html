<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Vacuum Decay and Quantum Tunneling</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        canvas { width: 100%; height: 400px; display: block; background: #000; border-radius: 4px; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .info-panel { background: #111; padding: 15px; border-radius: 5px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Vacuum Decay: Quantum Tunneling to Oblivion</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Potential Energy Landscape</h2>
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <button id="attempt-btn">Attempt to Tunnel</button>
                <button id="regen-btn">New Landscape</button>
                <h3>Status</h3>
                <div class="info-panel" id="info-panel">Our universe rests in a metastable false vacuum.</div>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Vacuum Decay script.
    // The final version will generate a 1D potential landscape and simulate
    // the probabilistic quantum tunneling of the universe's vacuum state.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        attemptBtn: document.getElementById('attempt-btn'),
        regenBtn: document.getElementById('regen-btn'),
        infoPanel: document.getElementById('info-panel'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = { landscape: [], universePos: {x: 0, y: 0}, decayed: false };

    function generateLandscape() {
        // Simplified landscape with a false and true vacuum
        state.landscape = [];
        for(let x=0; x<DOM.canvas.width; x++) {
            const y1 = 150 * Math.exp(-((x-150)**2)/8000) + 200; // False vacuum
            const y2 = 250 * Math.exp(-((x-550)**2)/15000) + 100; // True vacuum
            state.landscape.push(Math.min(y1, y2));
        }
        state.universePos = { x: 150, y: state.landscape[150] };
        state.decayed = false;
        DOM.infoPanel.textContent = "Universe is in a metastable false vacuum.";
    }

    function draw() {
        const { ctx, canvas } = DOM;
        ctx.fillStyle = 'black'; ctx.fillRect(0,0,canvas.width,canvas.height);

        // Draw landscape
        ctx.strokeStyle = '#444'; ctx.beginPath();
        ctx.moveTo(0, state.landscape[0]);
        for(let x=1; x<canvas.width; x++) ctx.lineTo(x, state.landscape[x]);
        ctx.stroke();

        // Draw universe ball
        ctx.fillStyle = state.decayed ? 'red' : 'cyan';
        ctx.beginPath();
        ctx.arc(state.universePos.x, state.universePos.y - 10, 10, 0, 2*Math.PI);
        ctx.fill();
    }

    function attemptTunnel() {
        if (state.decayed) return;
        // Simplified probability
        const probability = 0.05;
        if (Math.random() < probability) {
            DOM.infoPanel.textContent = "TUNNELING SUCCEEDED! Universe annihilated.";
            state.decayed = true;
            // Animate ball moving to true vacuum
            state.universePos = { x: 550, y: state.landscape[550] };
        } else {
            DOM.infoPanel.textContent = "Tunneling attempt failed. The universe survives... for now.";
        }
        draw();
    }

    function setup() {
        DOM.canvas.width = DOM.canvas.offsetWidth;
        DOM.canvas.height = 400;

        DOM.attemptBtn.onclick = attemptTunnel;
        DOM.regenBtn.onclick = () => { generateLandscape(); draw(); };

        DOM.expositionContent.innerHTML = `<h1>The False Vacuum</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        generateLandscape();
        draw();
    }

    setup();
});
</script>
</body>
</html>
