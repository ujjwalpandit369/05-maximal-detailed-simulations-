<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Matter-Antimatter Annihilation</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        canvas { width: 100%; height: 500px; display: block; background: #000; border-radius: 4px; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Matter-Antimatter Annihilation</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Universe Boundary</h2>
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <button id="start-btn">Start Mixing</button>
                <button id="reset-btn">Reset</button>
                <div id="metrics"></div>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Annihilation script.
    // The final version will contain a particle system with collision
    // detection that removes matter/antimatter pairs and creates an
    // energy flash animation.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        startBtn: document.getElementById('start-btn'), resetBtn: document.getElementById('reset-btn'),
        metrics: document.getElementById('metrics'),
        expositionContent: document.getElementById('exposition-content'),
        qaContent: document.getElementById('qa-content')
    };

    let state = { isRunning: false, matter: [], antimatter: [], flashes: [] };
    const NUM_PARTICLES = 150;

    function reset() {
        state.isRunning = false;
        state.matter = [];
        state.antimatter = [];
        state.flashes = [];
        for (let i = 0; i < NUM_PARTICLES; i++) {
            state.matter.push({ x: Math.random()*300, y: Math.random()*500, vx: (Math.random()-0.5), vy: (Math.random()-0.5) });
            state.antimatter.push({ x: 500+Math.random()*300, y: Math.random()*500, vx: (Math.random()-0.5), vy: (Math.random()-0.5) });
        }
    }

    function update() {
        if (!state.isRunning) return;

        // Move particles
        [...state.matter, ...state.antimatter].forEach(p => { p.x += p.vx; p.y += p.vy; });

        // Annihilation
        for (let i = state.matter.length - 1; i >= 0; i--) {
            for (let j = state.antimatter.length - 1; j >= 0; j--) {
                const m = state.matter[i];
                const am = state.antimatter[j];
                const distSq = (m.x-am.x)**2 + (m.y-am.y)**2;
                if (distSq < 25) {
                    state.flashes.push({ x: m.x, y: m.y, life: 1.0 });
                    state.matter.splice(i, 1);
                    state.antimatter.splice(j, 1);
                    break; // Move to next matter particle
                }
            }
        }

        state.flashes.forEach(f => f.life -= 0.05);
        state.flashes = state.flashes.filter(f => f.life > 0);
    }

    function draw() {
        const { ctx, canvas } = DOM;
        ctx.fillStyle='black'; ctx.fillRect(0,0,canvas.width,canvas.height);

        state.matter.forEach(p => { ctx.fillStyle='cyan'; ctx.fillRect(p.x-2,p.y-2,4,4); });
        state.antimatter.forEach(p => { ctx.fillStyle='red'; ctx.fillRect(p.x-2,p.y-2,4,4); });

        state.flashes.forEach(f => {
            ctx.fillStyle = `rgba(255, 255, 0, ${f.life})`;
            ctx.beginPath(); ctx.arc(f.x, f.y, 20*(1-f.life), 0, 2*Math.PI); ctx.fill();
        });
    }

    function gameLoop() {
        update();
        draw();
        DOM.metrics.innerHTML = `Matter: ${state.matter.length}<br>Antimatter: ${state.antimatter.length}`;
        requestAnimationFrame(gameLoop);
    }

    function setup() {
        DOM.canvas.width = 800; DOM.canvas.height = 500;
        DOM.startBtn.onclick = () => { state.isRunning = true; };
        DOM.resetBtn.onclick = reset;

        DOM.expositionContent.innerHTML = `<h1>The Great Annihilation</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        reset();
        gameLoop();
    }

    setup();
});
</script>
</body>
</html>
