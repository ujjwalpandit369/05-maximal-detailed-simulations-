<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: The Simulation Hypothesis Testbed</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --accent-color: #00ffaa; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 350px; grid-template-areas: "header header" "main controls" "exposition exposition" "qa qa" "footer footer"; gap: 20px; }
        header { grid-area: header; text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; }
        main { grid-area: main; }
        canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 4px; cursor: crosshair; }
        aside { grid-area: controls; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; position: sticky; top: 20px; }
        h3 { color: var(--secondary-color); }
        button { background-color: var(--primary-color); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-right: 5px; }
        .exposition, .qa-section { grid-area: exposition; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
        #metrics-panel { background: #111; padding: 10px; border-radius: 5px; font-family: 'Courier New', monospace; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Simulation Hypothesis Testbed</h1></header>
        <aside>
            <h2>Controls</h2>
            <div><button id="start-btn">Start</button><button id="pause-btn">Pause</button><button id="reset-btn">Reset</button></div>
            <h3>Objects</h3>
            <div><button id="add-ball-btn">Add Ball</button><button id="remove-ball-btn">Remove Ball</button></div>
            <h3>"Glitches"</h3>
            <label><input type="checkbox" id="observer-glitch"> Observer Effect</label>
            <label><input type="checkbox" id="zoom-glitch"> Resolution Limit</label>
        </aside>
        <main>
            <div class="simulation-window"><h2>"Universe" Sandbox</h2><canvas id="main-canvas" width="800" height="600"></canvas></div>
            <div id="metrics-panel"></div>
        </main>
        <div class="exposition" id="exposition-content"></div><div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Simulation Hypothesis script.
    // The final version will contain a simple physics engine and implement
    // the various "glitch" modes the user can toggle.
    const DOM = { canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'), metricsPanel: document.getElementById('metrics-panel'), addBallBtn: document.getElementById('add-ball-btn'), observerToggle: document.getElementById('observer-glitch'), expositionContent: document.getElementById('exposition-content'), qaContent: document.getElementById('qa-content') };
    let state = { isRunning: true, balls: [], observerEffect: false, mousePos: {x:0,y:0}, fps: 0 };
    let lastTime = 0;

    function createBall() {
        return { x: Math.random()*800, y: Math.random()*600, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, r: 10 };
    }

    function update(time) {
        const dt = (time - lastTime) / 1000;
        state.fps = 1 / dt;
        lastTime = time;

        if (state.isRunning) {
            state.balls.forEach(ball => {
                let updatePrecision = true;
                if (state.observerEffect) {
                    const distToMouse = Math.sqrt((ball.x-state.mousePos.x)**2 + (ball.y-state.mousePos.y)**2);
                    if (distToMouse > 200) updatePrecision = false;
                }

                if (updatePrecision) {
                    ball.x += ball.vx; ball.y += ball.vy;
                    if (ball.x < ball.r || ball.x > 800 - ball.r) ball.vx *= -1;
                    if (ball.y < ball.r || ball.y > 600 - ball.r) ball.vy *= -1;
                } else {
                    // "Unobserved" balls have sloppy physics
                    ball.x += ball.vx * 0.5; ball.y += ball.vy * 0.5;
                }
            });
        }
        draw();
        updateMetrics();
        requestAnimationFrame(update);
    }

    function draw() {
        DOM.ctx.fillStyle = 'black';
        DOM.ctx.fillRect(0,0,800,600);
        state.balls.forEach(ball => {
            DOM.ctx.beginPath();
            DOM.ctx.arc(ball.x, ball.y, ball.r, 0, 2*Math.PI);
            DOM.ctx.fillStyle = 'cyan';
            DOM.ctx.fill();
        });
    }

    function updateMetrics() {
        DOM.metricsPanel.innerHTML = `Object Count: ${state.balls.length} | FPS: ${state.fps.toFixed(1)}`;
    }

    function setup() {
        for(let i=0; i<10; i++) state.balls.push(createBall());
        DOM.addBallBtn.onclick = () => { for(let i=0; i<10; i++) state.balls.push(createBall()); };
        DOM.observerToggle.onchange = (e) => { state.observerEffect = e.target.checked; };
        DOM.canvas.onmousemove = (e) => { state.mousePos = {x: e.offsetX, y: e.offsetY }; };

        DOM.expositionContent.innerHTML = `<h1>Are We Living in a Simulation?</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        requestAnimationFrame(update);
    }

    setup();
});
</script>
</body>
</html>
