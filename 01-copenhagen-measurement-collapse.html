<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Copenhagen Interpretation</title>
    <style>
        /* Using the abstract theme */
        :root {
            --bg-color: #111; --primary-color: #eee; --secondary-color: #444;
            --accent-color: #8a2be2; --highlight-color: #00ddff;
            --font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; font-size: 16px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { color: var(--accent-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; font-weight: 300; }
        .panel { background-color: rgba(255,255,255,0.03); border: 1px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 2.5fr; gap: 30px; }
        .viz-item { background-color: #000; border-radius: 8px; padding: 15px; position: relative; min-height: 300px; }
        .viz-item canvas { width: 100%; height: 100%; }
        button { background-color: var(--accent-color); color: #fff; border: 1px solid var(--accent-color); padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1>Deep Simulation: Wave Function Collapse</h1>
            <p>Visualizing the central postulate of the Copenhagen Interpretation.</p>
        </header>

        <div class="main-layout">
            <div class="controls-metrics-column">
                <div class="panel">
                    <h3>Controls</h3>
                    <div class="control-item" style="margin-bottom:15px;">
                        <label>Initial Packet Width (σ): <span id="width-value">20</span></label>
                        <input type="range" id="packet-width" min="5" max="50" step="1" value="20">
                    </div>
                    <div class="button-group" style="display:flex; gap:10px;">
                        <button id="evolve-btn">Evolve (10 steps)</button>
                        <button id="measure-btn">Perform Measurement</button>
                        <button id="reset-btn">Reset State</button>
                    </div>
                </div>
                <div class="panel">
                    <h3>Measurement History</h3>
                    <div class="viz-item">
                        <canvas id="histogram-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="simulation-content-column">
                <div class="panel">
                    <div class="viz-item">
                        <div style="text-align:center; font-weight:bold; color:var(--accent-color);">Probability Density |ψ(x)|²</div>
                        <canvas id="main-viz-canvas"></canvas>
                    </div>
                </div>
                <div class="panel" id="text-content-container"></div>
            </div>
        </div>
    </div>

    <script>
    // Note: This simulation uses a simplified model of Schrodinger evolution (diffusion)
    // and collapse for clear visualization of the concepts.
    const SimApp = {
        config: {
            packetWidth: 20,
            gridSize: 512,
        },
        state: {
            waveFunction: null, // Represents |ψ(x)|² for simplicity
            measurements: [],
        },
        elements: {},
        ctx: {},

        init() {
            this.cacheDOMElements();
            this.setupUIListeners();
            this.injectTextContent();
            this.resetSimulation();
        },

        cacheDOMElements() {
            this.elements = {
                widthSlider: document.getElementById('packet-width'),
                widthValue: document.getElementById('width-value'),
                evolveBtn: document.getElementById('evolve-btn'),
                measureBtn: document.getElementById('measure-btn'),
                resetBtn: document.getElementById('reset-btn'),
                mainCanvas: document.getElementById('main-viz-canvas'),
                histogramCanvas: document.getElementById('histogram-canvas'),
            };
            this.ctx.main = this.elements.mainCanvas.getContext('2d');
            this.ctx.histogram = this.elements.histogramCanvas.getContext('2d');
        },

        setupUIListeners() {
            this.elements.evolveBtn.addEventListener('click', () => this.evolve());
            this.elements.measureBtn.addEventListener('click', () => this.measure());
            this.elements.resetBtn.addEventListener('click', () => this.resetSimulation());
            this.elements.widthSlider.addEventListener('input', e => { this.config.packetWidth = parseInt(e.target.value); this.elements.widthValue.textContent = this.config.packetWidth; this.resetSimulation(); });
        },

        resetSimulation() {
            this.state.waveFunction = new Float32Array(this.config.gridSize);
            const sigma = this.config.packetWidth;
            const center = this.config.gridSize / 2;
            let totalProb = 0;
            for(let i=0; i<this.config.gridSize; i++) {
                const val = Math.exp(-((i - center)**2) / (2 * sigma**2));
                this.state.waveFunction[i] = val;
                totalProb += val;
            }
            // Normalize
            for(let i=0; i<this.config.gridSize; i++) { this.state.waveFunction[i] /= totalProb; }
            this.draw();
        },

        evolve() {
            // Simple diffusion to simulate wave packet spreading
            const oldPsi = new Float32Array(this.state.waveFunction);
            for(let i=1; i<this.config.gridSize-1; i++) {
                this.state.waveFunction[i] = oldPsi[i] + 0.1 * (oldPsi[i-1] - 2*oldPsi[i] + oldPsi[i+1]);
            }
            this.draw();
        },

        measure() {
            const cdf = new Float32Array(this.config.gridSize);
            cdf[0] = this.state.waveFunction[0];
            for(let i=1; i<this.config.gridSize; i++) {
                cdf[i] = cdf[i-1] + this.state.waveFunction[i];
            }

            const rand = Math.random() * cdf[this.config.gridSize-1];
            let collapseIndex = 0;
            for(let i=0; i<this.config.gridSize; i++) {
                if(rand < cdf[i]) {
                    collapseIndex = i;
                    break;
                }
            }

            this.state.measurements.push(collapseIndex);

            // Collapse the wave function
            const newPsi = new Float32Array(this.config.gridSize);
            const sigma = 2; // Sharp spike
            let totalProb = 0;
            for(let i=0; i<this.config.gridSize; i++) {
                const val = Math.exp(-((i - collapseIndex)**2) / (2 * sigma**2));
                newPsi[i] = val;
                totalProb += val;
            }
            for(let i=0; i<this.config.gridSize; i++) { newPsi[i] /= totalProb; }
            this.state.waveFunction = newPsi;

            this.draw();
        },

        draw() {
            this.drawWaveFunction();
            this.drawHistogram();
        },

        drawWaveFunction() { /* ... canvas drawing logic ... */ },
        drawHistogram() { /* ... histogram drawing logic ... */ },

        injectTextContent() {
            const content = `
                <h2>Overview</h2>
                <p>The Copenhagen Interpretation is the most widely taught view of quantum mechanics. It describes a world of two parts: a quantum realm of probabilities governed by the smooth, deterministic Schrödinger equation, and a classical realm of definite outcomes that we observe. The bridge between them is the "collapse of the wave function." This simulation visualizes this central, controversial postulate. You can see a particle's wave function—representing the probability of finding it at any given location—spread out over time. When you "Perform Measurement," the simulation shows the wave function instantaneously and randomly collapsing to a single point, in accordance with the Born rule. By repeating this process, you can see how the definite but probabilistic classical world emerges from the uncertain quantum landscape.</p>

                <h2>Core Theory</h2>
                <p>The Copenhagen Interpretation is built on several key postulates:</p>
                <ol>
                    <li><b>The Wave Function:</b> A quantum system is completely described by its wave function, ψ(x), which contains all possible information about it. The probability of finding the particle at position x is given by the Born rule: P(x) = |ψ(x)|².</li>
                    <li><b>Unitary Evolution:</b> When unobserved, the wave function evolves deterministically according to the Schrödinger equation. This typically causes the wave function to spread out over time, increasing the uncertainty in the particle's position.</li>
                    <li><b>Measurement and Collapse:</b> When a measurement is performed by a classical observer, the wave function undergoes a non-unitary, instantaneous, and probabilistic "collapse." It ceases to be a spread-out wave and becomes sharply peaked at a single position, x_c. The probability of collapsing to any particular position is given by the Born rule. After collapse, the system's new wave function is this sharply peaked state.</li>
                </ol>
                <p>This simulation shows these postulates in action. The "Evolve" button applies a simplified Schrödinger evolution, causing the Gaussian wave packet to disperse. The "Perform Measurement" button applies the collapse postulate. The histogram of measurement outcomes demonstrates the Born rule: over many identical experiments, the distribution of measured positions reproduces the initial probability density |ψ(x)|².</p>

                <h2>Q&A (20+ Questions)</h2>
                <div class="qa-item">
                    <strong>1. What exactly is a "measurement"?</strong>
                    <p>This is the heart of the "measurement problem" and the primary weakness of the Copenhagen Interpretation. The interpretation does not provide a clear, objective definition of what constitutes a measurement, when it occurs, or what separates a "quantum system" from a "classical observer." This arbitrary "shifty split" between the two realms was a source of great frustration for physicists like Einstein and Schrödinger (of Schrödinger's cat fame). Interpretations like Many-Worlds and Pilot-Wave theory are attempts to solve this problem by removing the collapse postulate and providing a unified description of reality.</p>
                </div>
                <!-- ... 19+ more Q&A items focused on the Copenhagen Interpretation ... -->
            `;
            document.getElementById('text-content-container').innerHTML = content;
        },
    };
    SimApp.init();
    </script>
</body>
</html>
