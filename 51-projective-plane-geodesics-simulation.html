<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Geodesics on a Projective Plane</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        canvas { width: 100%; height: 500px; display: block; background: #000; border-radius: 4px; cursor: crosshair; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Geodesics on a Projective Plane (RP²)</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Universe (Disk with Antipodal Identification)</h2>
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <p>Click and drag to launch a particle.</p>
                <button id="reset-btn">Reset</button>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Projective Plane script.
    // The final version will contain the logic for particle movement
    // with antipodal boundary identification.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        resetBtn: document.getElementById('reset-btn'),
        expositionContent: document.getElementById('exposition-content'), qaContent: document.getElementById('qa-content')
    };

    let state = { particles: [], paths: [], isDragging: false, launchPos: null };
    const R = 240; // Radius of the disk
    const center = { x: 400, y: 250 };

    function update() {
        state.particles.forEach((p, i) => {
            const oldPos = {x: p.x, y: p.y};
            p.x += p.vx;
            p.y += p.vy;

            const dist = Math.sqrt((p.x-center.x)**2 + (p.y-center.y)**2);
            if (dist > R) {
                p.x = center.x - (p.x - center.x);
                p.y = center.y - (p.y - center.y);
                state.paths[i].push(null); // Break in path
            }
            state.paths[i].push({x:p.x, y:p.y});
        });
    }

    function draw() {
        const { ctx, canvas } = DOM;
        ctx.fillStyle = 'black'; ctx.fillRect(0,0,canvas.width, canvas.height);

        // Draw disk boundary
        ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(center.x, center.y, R, 0, 2*Math.PI); ctx.stroke();

        // Draw paths
        ctx.strokeStyle = 'cyan'; ctx.lineWidth = 1;
        state.paths.forEach(path => {
            ctx.beginPath();
            let first = true;
            path.forEach(p => {
                if (p === null) { ctx.stroke(); first = true; return; }
                if (first) { ctx.moveTo(p.x, p.y); first = false; }
                else { ctx.lineTo(p.x, p.y); }
            });
            ctx.stroke();
        });
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function setup() {
        DOM.canvas.width = 800; DOM.canvas.height = 500;
        DOM.resetBtn.onclick = () => { state.particles = []; state.paths = []; };

        DOM.canvas.onmousedown = (e) => { state.isDragging = true; state.launchPos = {x:e.offsetX, y:e.offsetY}; };
        DOM.canvas.onmouseup = (e) => {
            if (!state.isDragging) return;
            state.isDragging = false;
            const vel = {x: (e.offsetX - state.launchPos.x)/10, y: (e.offsetY - state.launchPos.y)/10};
            state.particles.push({x: state.launchPos.x, y: state.launchPos.y, vx: vel.x, vy: vel.y});
            state.paths.push([{x: state.launchPos.x, y: state.launchPos.y}]);
        };

        DOM.expositionContent.innerHTML = `<h1>Living on a Projective Plane</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        gameLoop();
    }

    setup();
});
</script>
</body>
</html>
