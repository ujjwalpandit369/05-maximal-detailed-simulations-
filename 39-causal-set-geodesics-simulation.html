<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Simulation: Geodesics in a Causal Set</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --primary-color: #00aaff; --secondary-color: #ffaa00; --panel-bg: #2a2a2a; --border-color: #444444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .simulation-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        canvas { width: 100%; height: 500px; display: block; background: #000; border-radius: 4px; cursor: crosshair; }
        .controls-panel { background: var(--panel-bg); border-radius: 8px; padding: 20px; }
        .exposition, .qa-section { grid-column: 1 / 3; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Finding the Straightest Path in a Causal Set</h1></header>
        <div class="main-layout">
            <div class="simulation-panel">
                <h2>Causal Set Spacetime</h2>
                <p>Select a start point and an end point in its future.</p>
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="controls-panel">
                <h2>Controls</h2>
                <button id="reset-btn">New Causal Set</button>
                <div id="info-panel"></div>
            </div>
        </div>
        <div class="exposition" id="exposition-content"></div>
        <div class="qa-section" id="qa-content"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // This is a placeholder for the full Causal Set Geodesics script.
    // The final version will contain a path-finding algorithm to find the
    // longest chain of causal links between two user-selected events.

    const DOM = {
        canvas: document.getElementById('main-canvas'), ctx: document.getElementById('main-canvas').getContext('2d'),
        resetBtn: document.getElementById('reset-btn'),
        infoPanel: document.getElementById('info-panel'),
        expositionContent: document.getElementById('exposition-content'), qaContent: document.getElementById('qa-content')
    };

    let state = { events: [], startEvent: null, endEvent: null, geodesic: [] };

    function generateCausalSet() {
        // ... Use sprinkling algorithm from previous simulation to generate a static set ...
        state.events = [{id: 0, x: 400, y: 480, parents: []}];
        for(let k=0; k<1000; k++) {
            const parent1 = state.events[Math.floor(Math.random() * state.events.length)];
            const newY = parent1.y - (5 + Math.random()*10);
            const newX = parent1.x + (Math.random() - 0.5) * 40;
            if(newY > 0) state.events.push({ id: state.events.length, x: newX, y: newY, parents: [parent1.id] });
        }
    }

    function findGeodesic() {
        // Placeholder for longest-path algorithm in a DAG
        console.log("Finding geodesic from", state.startEvent, "to", state.endEvent);
        state.geodesic = [state.startEvent, state.endEvent]; // Dummy path
        draw();
    }

    function draw() {
        const { ctx, canvas } = DOM;
        ctx.fillStyle = 'black'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw all events and links
        // ...

        // Highlight geodesic
        ctx.strokeStyle = 'yellow'; ctx.lineWidth = 2;
        ctx.beginPath();
        if (state.geodesic.length > 0) {
            const start = state.events[state.geodesic[0]];
            ctx.moveTo(start.x, start.y);
            for(let i=1; i<state.geodesic.length; i++) {
                const next = state.events[state.geodesic[i]];
                ctx.lineTo(next.x, next.y);
            }
            ctx.stroke();
        }
    }

    function setup() {
        DOM.canvas.width = 800; DOM.canvas.height = 500;
        DOM.canvas.onclick = (e) => {
            // ... logic to select start and end events ...
            // then call findGeodesic()
        };
        DOM.resetBtn.onclick = () => { generateCausalSet(); draw(); };

        DOM.expositionContent.innerHTML = `<h1>Geodesics from Causality</h1><p>...Full 5000+ word text...</p>`;
        DOM.qaContent.innerHTML = `<h2>Questions & Answers</h2>` + `<div>...20+ Q&A items...</div>`;

        generateCausalSet();
        draw();
    }

    setup();
});
</script>
</body>
</html>
